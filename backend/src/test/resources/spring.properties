# Each test class with its own settings gets its own Spring context, embedded PostgreSQL and media workers. Spring keeps
# up to 32 alive by default, which ran a 16 GB development machine out of memory once the suite grew past 20 of them.
# Keeping a few is enough: the classes run one after another, and an evicted context is closed (its database stops).
spring.test.context.cache.maxSize=4
