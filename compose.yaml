name: faststudio
services:
  db:
    image: postgres:17-alpine
    container_name: faststudio-db
    environment:
      POSTGRES_DB: faststudio
      POSTGRES_USER: faststudio
      POSTGRES_PASSWORD: ${FASTSTUDIO_DB_PASSWORD:?Run start.bat -Docker to generate local credentials}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faststudio -d faststudio"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s
volumes:
  pgdata:
    name: faststudio_pgdata
