# Checks every push and pull request: backend tests, frontend type-check + build, Cloudflare Worker tests.
# The three jobs run in parallel; a red job blocks nothing by itself, so protect main with "require status checks".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # MailTest sends through the real mailer (mailer/send.mjs + nodemailer), so it needs Node and those packages.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mailer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mailer
      - name: SQL only in repositories
        run: |
          if grep -rln "\.sql(" backend/src/main/java/com/faststudio/v1/controllers backend/src/main/java/com/faststudio/v1/services; then
            echo "::error::Controllers and services must not run SQL; add a repository method (docs/BACKEND_ARCHITECTURE.md)."
            exit 1
          fi
      # Clean build: never trust compiled classes from a previous run. Embedded PostgreSQL starts inside the tests.
      - run: sh ./mvnw -B -ntp clean test
        working-directory: backend
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      # `build` runs `tsc -b` first, so type errors fail here.
      - run: npm run build
        working-directory: frontend
      - name: No screen imports another feature
        run: |
          if grep -rnE "from '\.\./[a-z]+/" frontend/src/features; then
            echo "::error::A feature imports another feature; move the shared code to frontend/src/shared (docs/FRONTEND_ARCHITECTURE.md)."
            exit 1
          fi

  worker:
    name: Cloudflare Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: worker
      - run: npm test
        working-directory: worker

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: sh ./mvnw -B -ntp -DskipTests package
        working-directory: backend
      # Demo mode with a throwaway data folder; video processing is off (screens only need the seeded catalogue).
      - name: Start FAST Studio
        run: |
          FASTSTUDIO_DATA_DIR="$RUNNER_TEMP/fs-data" FASTSTUDIO_FFMPEG=disabled \
            nohup java -jar backend/target/backend-*.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0; sleep 2; done
          echo "::error::FAST Studio did not become healthy"; tail -50 "$RUNNER_TEMP/app.log"; exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Keep screenshots, traces and the server log when something fails
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/app.log
          retention-days: 7
