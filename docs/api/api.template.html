<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Studio API</title>
<!-- Generated by tools/build-api-docs.mjs from docs/api/api.json and the controller sources. Edit those, not this file. -->
<style>
  :root { --bg:#f6f7fb; --panel:#fff; --ink:#151a2d; --muted:#5b6478; --line:#e3e6ef; --accent:#4f46e5; --accent-soft:#eef0ff; --code:#0f1322; --code-ink:#e6e9f5;
          --get:#047857; --get-bg:#e7f7f0; --post:#1d4ed8; --post-bg:#e8efff; --put:#b45309; --put-bg:#fff4e0; --patch:#7c3aed; --patch-bg:#f2ecff; --del:#b91c1c; --del-bg:#fde8e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b0e16; --panel:#121726; --ink:#e7eaf3; --muted:#9aa3b8; --line:#232a3d; --accent:#8b8cff; --accent-soft:#1d2140; --code:#070912;
          --get:#34d399; --get-bg:#0f2a22; --post:#7aa2ff; --post-bg:#14203f; --put:#fbbf24; --put-bg:#2b220e; --patch:#c4a5ff; --patch-bg:#241a3d; --del:#f87171; --del-bg:#2e1414; } }
  :root[data-theme="dark"] { --bg:#0b0e16; --panel:#121726; --ink:#e7eaf3; --muted:#9aa3b8; --line:#232a3d; --accent:#8b8cff; --accent-soft:#1d2140; --code:#070912;
          --get:#34d399; --get-bg:#0f2a22; --post:#7aa2ff; --post-bg:#14203f; --put:#fbbf24; --put-bg:#2b220e; --patch:#c4a5ff; --patch-bg:#241a3d; --del:#f87171; --del-bg:#2e1414; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
  .bar h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .bar input[type=search] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 12px; transition: background .15s, border-color .15s, transform .1s; }
  button:hover { border-color: var(--accent); } button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 16px; }
  nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; padding-right: 4px; }
  nav a { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; transition: background .15s, color .15s; }
  nav a span { color: var(--muted); font-size: 12px; }
  nav a:hover, nav a.on { background: var(--accent-soft); color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
  .intro p { margin: 0 0 10px; color: var(--muted); }
  .intro ul { margin: 8px 0 0; padding-left: 20px; } .intro li { margin: 4px 0; }
  details.values summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.values summary::-webkit-details-marker { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
  .grid label { display: block; font-size: 12px; color: var(--muted); }
  .grid input { width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .tools label { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  section.cat { margin-bottom: 30px; }
  section.cat > h2 { font-size: 20px; margin: 0 0 4px; }
  .who { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: border-color .15s; }
  .ep:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .ep > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 12px 14px; flex-wrap: wrap; }
  .ep > summary::-webkit-details-marker { display: none; }
  .m { font: 700 11px ui-monospace, Consolas, monospace; padding: 3px 8px; border-radius: 6px; min-width: 58px; text-align: center; }
  .GET { color: var(--get); background: var(--get-bg); } .POST { color: var(--post); background: var(--post-bg); } .PUT { color: var(--put); background: var(--put-bg); }
  .PATCH { color: var(--patch); background: var(--patch-bg); } .DELETE { color: var(--del); background: var(--del-bg); }
  .path { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
  .t { margin-left: auto; color: var(--muted); font-size: 14px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .tag.danger { background: var(--del-bg); color: var(--del); }
  .body { padding: 0 14px 14px; animation: open .18s ease-out; }
  @keyframes open { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .body p { margin: 0 0 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 10px; }
  td, th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); } th { color: var(--muted); font-weight: 600; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .curl { position: relative; background: var(--code); color: var(--code-ink); border-radius: 12px; padding: 14px 14px 14px 14px; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .curl button { position: absolute; top: 8px; right: 8px; padding: 5px 10px; font-size: 12px; background: #262c44; color: #e6e9f5; border-color: #3a4160; }
  .curl button.ok { background: #065f46; border-color: #065f46; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  footer { max-width: 1280px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } nav { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; } .t { margin-left: 0; width: 100%; } .bar h1 { display: none; } }
</style>
</head>
<body>
<header><div class="bar"><h1>FAST Studio API</h1>
  <input id="q" type="search" placeholder="Search endpoints, e.g. schedule, publish, token…" aria-label="Search endpoints">
  <button id="expand" title="Open or close every endpoint">Expand all</button>
  <button id="theme" title="Light or dark">◐</button></div></header>
<div class="layout">
  <nav id="nav" aria-label="Categories"></nav>
  <main>
    <div class="panel intro" id="intro"></div>
    <div class="panel"><details class="values" open><summary>Your values <span class="muted">used in every example below · saved in this browser</span></summary>
      <div class="grid" id="vars"></div>
      <div class="tools">
        <label><input type="checkbox" id="postman"> Show Postman variables (<code>{{baseUrl}}</code>) instead of my values</label>
        <button class="primary" id="collection">Download Postman collection</button>
        <button id="reset">Reset values</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Postman: Import → Raw text → paste a curl, or import the downloaded collection (it carries these values as collection variables). Windows PowerShell: run <code>curl.exe</code> instead of <code>curl</code>, or use Git Bash.</p>
    </details></div>
    <div id="main"></div>
  </main>
</div>
<footer id="foot"></footer>
<script>
const DATA = /*__API__*/null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const DEFAULTS = Object.fromEntries(DATA.variables.map(v => [v.key, v.value]));
let values = { ...DEFAULTS };
try { Object.assign(values, JSON.parse(store.get('fs-api-values') || '{}')) } catch {}
// path variables the page fills in by name; endpoints can override ({id}, {key}, …) in "params"
const PATH = { org: '{{org}}', orgId: '{{orgId}}', tenant: '{{tenant}}', project: '{{project}}', partner: '{{partner}}', owner: '{{owner}}',
  channelId: '{{channelId}}', destinationId: '{{destinationId}}', linkId: '{{linkId}}', userId: '{{userId}}', session: '{{sessionId}}' };

function fill(text, postman) { return String(text).replace(/\{\{(\w+)\}\}/g, (m, k) => postman || !(k in values) ? m : values[k]) }
function url(ep, postman) {
  let p = ep.path.replace(/\{(\w+)\}/g, (m, k) => (ep.params && ep.params[k]) || PATH[k] || m);
  const q = Object.entries(ep.query || {}).filter(([, v]) => v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return fill('{{baseUrl}}' + p + (q ? '?' + q : ''), postman);
}
const sq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
function curl(ep, postman) {
  const lines = [`curl -X ${ep.method} ${sq(url(ep, postman))}`];
  if (ep.auth === 'basic') lines.push(`-u ${sq('CLIENT_ID:CLIENT_SECRET')}`);
  else if (!ep.auth || ep.auth === 'bearer') lines.push(`-H ${sq('Authorization: Bearer ' + fill('{{token}}', postman))}`);
  if (ep.form) for (const [k, v] of Object.entries(ep.form)) lines.push(`--data-urlencode ${sq(k + '=' + v)}`);
  if (ep.multipart) lines.push(`-F ${sq('file=@/path/to/video.mp4')}`);
  if (ep.body) { lines.push(`-H ${sq('Content-Type: application/json')}`); lines.push(`--data-raw ${sq(fill(JSON.stringify(ep.body, null, 2), postman))}`) }
  return lines.join(' \\\n  ');
}
function params(ep) {
  const rows = [];
  for (const m of ep.path.matchAll(/\{(\w+)\}/g)) { const v = (ep.params && ep.params[m[1]]) || PATH[m[1]]; rows.push(['path', m[1], v ? v.replace(/\{\{(\w+)\}\}/, '$1 (your value)') : 'see description']) }
  for (const q of ep.route.query) rows.push(['query', q.name, q.required ? 'required' : 'optional' + (ep.query && ep.query[q.name] ? ', e.g. ' + ep.query[q.name] : '')]);
  return rows.length ? `<table><tr><th>Where</th><th>Name</th><th>Value</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}</table>` : '';
}
const authText = { none: 'No token needed.', basic: 'HTTP Basic with the API client id and secret.', webhook: 'Signed by the sender (no token).' };

function renderVars() {
  document.getElementById('vars').innerHTML = DATA.variables.map(v => `<label>${esc(v.label)}<input data-k="${esc(v.key)}" value="${esc(values[v.key])}" ${v.secret ? 'type="password" autocomplete="off"' : ''} spellcheck="false" title="${esc(v.help)}" placeholder="${esc(v.help)}"></label>`).join('');
  document.querySelectorAll('#vars input').forEach(i => i.addEventListener('input', () => { values[i.dataset.k] = i.value; store.set('fs-api-values', JSON.stringify(values)); refreshCurls() }));
}
function refreshCurls() {
  const pm = document.getElementById('postman').checked;
  document.querySelectorAll('.curl pre').forEach(pre => { const ep = EPS[pre.dataset.i]; pre.textContent = curl(ep, pm) });
}
const EPS = [];
function render(filter = '') {
  const f = filter.trim().toLowerCase();
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  let html = '', links = '', total = 0;
  EPS.length = 0;
  for (const c of DATA.categories) {
    const eps = c.endpoints.filter(e => !f || (e.method + ' ' + e.path + ' ' + e.title + ' ' + e.description + ' ' + c.title).toLowerCase().includes(f));
    if (!eps.length) continue;
    total += eps.length;
    links += `<a href="#${c.id}">${esc(c.title)}<span>${eps.length}</span></a>`;
    html += `<section class="cat" id="${c.id}"><h2>${esc(c.title)}</h2><p class="muted" style="margin:0 0 4px">${md(c.summary)}</p><div class="who">Who: ${md(c.who)}</div>`;
    for (const e of eps) {
      const i = EPS.push(e) - 1;
      html += `<details class="ep" ${f ? 'open' : ''}><summary><span class="m ${e.method}">${e.method}</span><span class="path">${esc(e.path)}</span>${e.danger ? '<span class="tag danger">cannot be undone</span>' : ''}<span class="t">${esc(e.title)}</span></summary>
        <div class="body"><p>${md(e.description)}</p><p class="muted">${authText[e.auth] || 'Needs a token (Authorization: Bearer …).'}</p>${params(e)}
        ${e.noExample ? '' : `<div class="curl"><button data-copy="${i}">Copy</button><pre data-i="${i}" style="margin:0;white-space:pre-wrap"></pre></div>`}</div></details>`;
    }
    html += '</section>';
  }
  nav.innerHTML = links;
  main.innerHTML = html || '<div class="panel empty">No endpoint matches. Try another word.</div>';
  refreshCurls();
  spy();
}
function collection() {
  const item = e => {
    const raw = url(e, true), [base, qs] = raw.split('?');
    const r = { method: e.method, header: [], url: { raw, host: ['{{baseUrl}}'], path: base.replace('{{baseUrl}}', '').split('/').filter(Boolean),
      query: qs ? qs.split('&').map(p => { const [k, v] = p.split('='); return { key: k, value: decodeURIComponent(v) } }) : [] } };
    if (e.auth === 'none' || e.auth === 'webhook') r.auth = { type: 'noauth' };
    if (e.auth === 'basic') r.auth = { type: 'basic', basic: [{ key: 'username', value: 'CLIENT_ID' }, { key: 'password', value: 'CLIENT_SECRET' }] };
    if (e.body) { r.header.push({ key: 'Content-Type', value: 'application/json' }); r.body = { mode: 'raw', raw: JSON.stringify(e.body, null, 2), options: { raw: { language: 'json' } } } }
    if (e.form) r.body = { mode: 'urlencoded', urlencoded: Object.entries(e.form).map(([key, value]) => ({ key, value })) };
    if (e.multipart) r.body = { mode: 'formdata', formdata: [{ key: 'file', type: 'file', src: [] }] };
    return { name: e.title, request: r };
  };
  const out = { info: { name: 'FAST Studio API', schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json', description: DATA.intro },
    auth: { type: 'bearer', bearer: [{ key: 'token', value: '{{token}}', type: 'string' }] },
    variable: DATA.variables.map(v => ({ key: v.key, value: values[v.key] })),
    item: DATA.categories.map(c => ({ name: c.title, description: c.summary, item: c.endpoints.filter(e => !e.noExample).map(item) })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'FAST-Studio.postman_collection.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let observer;
function spy() {
  observer?.disconnect();
  const links = [...document.querySelectorAll('#nav a')];
  observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)) }), { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('section.cat').forEach(s => observer.observe(s));
}
document.getElementById('intro').innerHTML = `<p>${md(DATA.intro)}</p><b>Signing in</b><ul>${DATA.auth.map(a => `<li>${md(a)}</li>`).join('')}</ul>`;
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from the server's ${DATA.routeCount} routes and docs/api/api.json. Every route is documented; the build fails otherwise.`;
renderVars();
render();
document.getElementById('q').addEventListener('input', e => render(e.target.value));
document.getElementById('postman').addEventListener('change', refreshCurls);
document.getElementById('collection').addEventListener('click', collection);
document.getElementById('reset').addEventListener('click', () => { values = { ...DEFAULTS }; store.set('fs-api-values', '{}'); renderVars(); refreshCurls() });
document.getElementById('expand').addEventListener('click', e => { const open = e.target.textContent === 'Expand all'; document.querySelectorAll('details.ep').forEach(d => d.open = open); e.target.textContent = open ? 'Collapse all' : 'Expand all' });
document.getElementById('main').addEventListener('click', e => {
  const b = e.target.closest('button[data-copy]'); if (!b) return;
  const text = b.nextElementSibling.textContent;
  const done = () => { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok') }, 1400) };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done() });
});
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView(), 50);
</script>
</body>
</html>
