<title>FAST Studio API</title>

<style>

          --code:#070a14; --code2:#0d1120; --code-line:#1c2340; --get:#34d399; --get-bg:#0e2a21; --post:#7aa2ff; --post-bg:#132042; --put:#fbbf24; --put-bg:#2c220c; --patch:#c4a5ff; --patch-bg:#24193f; --del:#f87171; --del-bg:#2f1414;

          --code:#070a14; --code2:#0d1120; --code-line:#1c2340; --get:#34d399; --get-bg:#0e2a21; --post:#7aa2ff; --post-bg:#132042; --put:#fbbf24; --put-bg:#2c220c; --patch:#c4a5ff; --patch-bg:#24193f; --del:#f87171; --del-bg:#2f1414;

  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #ec4899); display: grid; place-items: center; color: #fff; font-size: 14px; }

  .PATCH { color: var(--patch); background: var(--patch-bg); } .DELETE { color: var(--del); background: var(--del-bg); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .badge.open { background: var(--get-bg); color: var(--get); } .badge.danger { background: var(--del-bg); color: var(--del); }
  .ep-body { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); border-top: 1px solid var(--line); animation: open .2s ease-out; }
  @keyframes open { from { opacity: 0; } to { opacity: 1; } }
  .doc { padding: 18px 20px; min-width: 0; }
  .doc > p { margin: 0 0 12px; }
  .route { font: 13px ui-monospace, Consolas, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: center; }
  .route i { font-style: normal; color: var(--accent); font-weight: 600; }
  h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
  .fields { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .field { padding: 10px 12px; border-top: 1px solid var(--line); } .field:first-child { border-top: 0; }
  .field .top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; }
  .field .nm { font: 600 13px ui-monospace, Consolas, monospace; }
  .field .ty { font-size: 12px; color: var(--faint); }
  .field .rq { font-size: 10.5px; font-weight: 700; color: var(--req); background: var(--req-bg); padding: 1px 7px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .field .op { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
  .field .help { margin-top: 3px; font-size: 13.5px; color: var(--muted); }
  .field .rules { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }

  .field .ex { font-size: 12px; color: var(--faint); margin-top: 3px; } .field .ex code { font-size: 11.5px; }
  .field.nested { padding-left: 28px; background: var(--panel2); }
  /* code */
  .code { background: var(--code); color: var(--code-ink); padding: 14px; min-width: 0; }
  .pane { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 10px; }
  .tabs { display: flex; gap: 4px; align-items: center; }
  .tabs button { background: transparent; border: 0; color: #8f98b8; padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  .tabs button.on { background: var(--code2); color: #fff; }
  .tabs .st { margin-left: auto; font: 11px ui-monospace, monospace; color: #86efac; }
  .tabs .cp { margin-left: 6px; background: #1c2340; color: #dfe4f5; border: 1px solid #2a3356; font-size: 12px; padding: 4px 10px; }
  .tabs .cp.ok { background: #065f46; border-color: #065f46; }
  pre { margin: 0; background: var(--code2); border: 1px solid var(--code-line); border-radius: 12px; padding: 14px; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 520px; overflow: auto; }
  pre .k { color: var(--k); } pre .s { color: var(--s); } pre .n { color: var(--n); } pre .b { color: var(--b); } pre .c { color: #8f98b8; } pre .v { color: #fde68a; }
  .note { font-size: 12px; color: #8f98b8; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { max-width: 1440px; margin: 0 auto; padding: 0 18px 36px; color: var(--muted); font-size: 13px; }
  @media (max-width: 1100px) { .ep-body { grid-template-columns: 1fr; } }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; gap: 12px; padding-top: 10px; } nav { position: sticky; top: 53px; z-index: 6; max-height: none; display: flex; gap: 6px; overflow-x: auto; background: var(--bg); padding: 8px 0; margin: 0 -18px; padding-left: 18px; scrollbar-width: none; } nav .group > a { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; } nav .group > a .n { display: none; } nav .eps { display: none !important; } #expand, .bar .spacer { display: none; } .search { min-width: 0; } html { scroll-padding-top: 110px; } .brand span:last-child { display: none; } .ep > summary { grid-template-columns: auto minmax(0, 1fr); } .ep > summary .badges { grid-column: 1 / -1; justify-content: flex-start; } .search kbd { display: none; } }

<body>
<header><div class="bar">
  <div class="brand"><div class="logo">▶</div><span>FAST Studio API</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search: schedule, publish, token, campaign…" aria-label="Search endpoints"><kbd>/</kbd></div>
  <div class="spacer"></div>
  <button id="expand">Expand all</button>
  <button id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
</div></header>
<div class="layout">
  <nav id="nav" aria-label="Endpoints"></nav>
  <main>
    <div class="card hero" id="hero"></div>
    <details class="card values" open id="values"><summary>⚙ Your values <span class="hint">filled into every example below · kept only in this browser</span></summary>
      <div class="grid" id="vars"></div>
      <div class="tools">
        <label class="switch"><input type="checkbox" id="postman"> Show Postman variables (<code>{{baseUrl}}</code>) instead of my values</label>
        <span class="spacer"></span>
        <button id="reset">Reset values</button>
        <button class="primary" id="collection">⬇ Download Postman collection</button>
      </div>
      <p class="muted" style="margin:10px 0 0">Postman: <b>Import → Raw text</b> and paste a curl, or import the downloaded collection (your values become its variables). On Windows run the curls in Git Bash, or use <code>curl.exe</code> in PowerShell.</p>
    </details>
    <div id="main"></div>
  </main>
</div>
<footer id="foot"></footer>
<script>
const DATA = /*__API__*/null;
const ICONS = { auth: '🔑', project: '🏢', library: '🎞', rights: '🌍', channels: '📺', schedule: '🗓', programming: '🔁', ads: '💰', distribution: '📡',
  operations: '📈', 'partner-api': '🤝', viewer: '▶', tools: '🛠', 'platform-tenants': '🏛', 'platform-orgs': '🧩', 'platform-email': '✉' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const DEFAULTS = Object.fromEntries(DATA.variables.map(v => [v.key, v.value]));
let values = { ...DEFAULTS };
try { Object.assign(values, JSON.parse(store.get('fs-api-values') || '{}')) } catch {}
const PATH = { org: '{{org}}', orgId: '{{orgId}}', tenant: '{{tenant}}', project: '{{project}}', partner: '{{partner}}', owner: '{{owner}}',
  channelId: '{{channelId}}', destinationId: '{{destinationId}}', linkId: '{{linkId}}', userId: '{{userId}}', session: '{{sessionId}}' };
const EPS = [];
DATA.categories.forEach(c => c.endpoints.forEach(e => { e.cat = c; e.id = 'ep-' + (e.method + e.path).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-$/, ''); e.i = EPS.push(e) - 1 }));

const fill = (t, pm) => String(t).replace(/\{\{(\w+)\}\}/g, (m, k) => pm || !(k in values) ? m : values[k]);
const pathValue = (e, k) => (e.params && e.params[k]) || PATH[k];
function url(e, pm) {
  const p = e.path.replace(/\{(\w+)\}/g, (m, k) => pathValue(e, k) || m);
  const q = Object.entries(e.query || {}).filter(([, v]) => v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return fill('{{baseUrl}}' + p + (q ? '?' + q : ''), pm);
}
const sq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
const bodyText = (e, pm) => e.body ? fill(JSON.stringify(e.body, null, 2), pm) : null;
function curl(e, pm) {
  const l = [`curl -X ${e.method} ${sq(url(e, pm))}`];
  if (e.auth === 'basic') l.push(`-u ${sq('CLIENT_ID:CLIENT_SECRET')}`);
  else if (!e.auth || e.auth === 'bearer') l.push(`-H ${sq('Authorization: Bearer ' + fill('{{token}}', pm))}`);
  if (e.form) for (const [k, v] of Object.entries(e.form)) l.push(`--data-urlencode ${sq(k + '=' + v)}`);
  if (e.multipart) l.push(`-F ${sq('file=@/path/to/video.mp4')}`);
  if (e.body) { l.push(`-H ${sq('Content-Type: application/json')}`); l.push(`--data-raw ${sq(bodyText(e, pm))}`) }
  return l.join(' \\\n  ');
}
// colours for the code panes (the text is escaped first)
function hiJson(t) {
  return esc(t).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)\b|\b(true|false|null)\b/g,
    (m, str, colon, num, lit) => str ? `<span class="${colon ? 'k' : 's'}">${str}</span>${colon || ''}` : num ? `<span class="n">${num}</span>` : `<span class="b">${lit}</span>`);
}
function hiCurl(t) {
  return esc(t).replace(/^(curl)( -X )(\w+)/, '<span class="b">$1</span>$2<span class="n">$3</span>').replace(/( -[A-Za-z]+| --[\w-]+)/g, '<span class="c">$1</span>')
    .replace(/\{\{(\w+)\}\}/g, '<span class="v">{{$1}}</span>');
}
const authBadge = e => e.auth === 'none' ? '<span class="badge open">no token</span>' : e.auth === 'basic' ? '<span class="badge">client id + secret</span>'
  : e.auth === 'webhook' ? '<span class="badge">signed webhook</span>' : '<span class="badge">token</span>';
const authLine = e => ({ none: 'No token needed.', basic: 'HTTP Basic with the API client\'s id and secret.', webhook: 'Signed by the sender; no token.' }[e.auth]
  || 'Needs a token: <code>Authorization: Bearer …</code>');
const pathHtml = p => esc(p).replace(/\{(\w+)\}/g, '<i>{$1}</i>');

function fieldRows(list, nested) {
  return list.map(f => `<div class="field${nested ? ' nested' : ''}"><div class="top"><span class="nm">${esc(f.name)}</span><span class="ty">${esc(f.type)}</span>
    ${f.required ? '<span class="rq">required</span>' : '<span class="op">optional</span>'}</div>
    ${f.help ? `<div class="help">${md(f.help)}</div>` : ''}
    ${(f.rules && f.rules.length) || f.default != null ? `<div class="rules">${(f.rules || []).map(r => `<span>${esc(r)}</span>`).join('')}${f.default != null ? `<span>default ${esc(f.default)}</span>` : ''}</div>` : ''}
    ${f.example != null ? `<div class="ex">Example: <code>${esc(f.example)}</code></div>` : ''}</div>${f.fields ? fieldRows(f.fields, true) : ''}`).join('');
}
function docHtml(e) {
  const pp = e.pathParams.map(p => ({ name: '{' + p.name + '}', type: 'path', required: true, help: p.help, example: p.example || (PATH[p.name] ? 'your ' + PATH[p.name].replace(/[{}]/g, '') : null) }));
  const qp = e.queryParams.map(q => ({ name: q.name, type: 'query', required: q.required, help: q.help, rules: [], default: q.default, example: q.example || null }));
  const body = e.multipart ? [{ name: 'file', type: 'file (multipart/form-data)', required: true, help: 'The video file.', rules: ['MP4, MOV, MKV, WEBM, M4V'] }]
    : e.formFields ? e.formFields.map(f => ({ ...f, type: 'form field' })) : e.bodyFields;
  return `<div class="route"><span class="pill ${e.method}">${e.method}</span><span>${pathHtml(e.path)}</span></div>
    <p>${md(e.description)}</p><p class="muted">${authLine(e)}</p>
    ${pp.length ? `<h4>Path parameters</h4><div class="fields">${fieldRows(pp)}</div>` : ''}
    ${qp.length ? `<h4>Query parameters</h4><div class="fields">${fieldRows(qp)}</div>` : ''}
    ${body && body.length ? `<h4>Request body${e.multipart ? ' (form data)' : e.form ? ' (form, application/x-www-form-urlencoded)' : ' (JSON)'}</h4><div class="fields">${fieldRows(body)}</div>` : ''}
    ${!body?.length && !e.multipart && !e.form && e.method !== 'GET' && e.method !== 'DELETE' ? '<h4>Request body</h4><p class="muted">None.</p>' : ''}`;
}
function codeHtml(e) {
  if (e.noExample) return `<div class="code"><div class="note">No copy-paste example: ${e.auth === 'webhook' ? 'the sender signs each delivery.' : 'these addresses are signed by the server and returned by other endpoints.'}</div></div>`;
  const tabs = [['curl', 'curl']];
  if (e.body) tabs.push(['body', 'Request body']);
  tabs.push(['resp', 'Response']);
  return `<div class="code" data-i="${e.i}"><div class="pane"><div class="tabs">${tabs.map(([k, l], n) => `<button data-tab="${k}" class="${n ? '' : 'on'}">${l}</button>`).join('')}
      <span class="st">${e.response ? 'HTTP ' + e.response.status : ''}</span><button class="cp">Copy</button></div><pre data-view="curl"></pre></div></div>`;
}
function paint(box) {
  const e = EPS[box.dataset.i], tab = box.querySelector('.tabs .on').dataset.tab, pm = document.getElementById('postman').checked, pre = box.querySelector('pre');
  box.querySelector('.st').style.visibility = tab === 'resp' ? 'visible' : 'hidden';
  if (tab === 'curl') { pre.dataset.copy = curl(e, pm); pre.innerHTML = hiCurl(pre.dataset.copy) }
  else if (tab === 'body') { pre.dataset.copy = bodyText(e, pm); pre.innerHTML = hiJson(pre.dataset.copy) }
  else if (e.response) { pre.dataset.copy = typeof e.response.body === 'string' ? e.response.body : JSON.stringify(e.response.body, null, 2); pre.innerHTML = typeof e.response.body === 'string' ? esc(pre.dataset.copy) : hiJson(pre.dataset.copy) }
  else { pre.dataset.copy = ''; pre.innerHTML = `<span class="c">${e.method === 'GET' ? 'No recorded example yet.' : 'A successful call answers 200 (or 204 with no content) with the changed item. Errors: JSON with code and detail.'}</span>` }
}
const paintAll = () => document.querySelectorAll('.code[data-i]').forEach(b => b.closest('details').open && paint(b));

function renderHero() {
  const codes = [['200', 'OK, with the answer'], ['204', 'Done, no content'], ['400 / 422', 'Something in the request is wrong; detail says what'], ['401', 'No token, or it expired'],
    ['403', 'Not allowed for your role or token'], ['404', 'Not found, or not yours'], ['409 / 412', 'Conflict: someone changed it, or a limit is reached'], ['429', 'Too many requests; wait a moment']];
  document.getElementById('hero').innerHTML = `<h1>FAST Studio API</h1><p>${md(DATA.intro)}</p>
    <div class="steps">
      <div class="step"><b><span>1</span> Get a token</b><p class="muted">Profile and Settings → <b>API Tokens</b> → create one for your project. It starts with <code>fsp_</code>.</p></div>
      <div class="step"><b><span>2</span> Fill in your values</b><p class="muted">Paste the token and IDs below once. Every example updates. Find IDs with the List calls (e.g. List channels).</p></div>
      <div class="step"><b><span>3</span> Copy and run</b><p class="muted">Open an endpoint, press Copy, paste into a terminal or Postman. Change the body values and go.</p></div>
    </div>
    <details class="more"><summary>How signing in and errors work</summary><ul>${DATA.auth.map(a => `<li>${md(a)}</li>`).join('')}</ul>
      <div class="codes">${codes.map(([c, t]) => `<div><b>${c}</b>${t}</div>`).join('')}</div></details>`;
}
function renderVars() {
  document.getElementById('vars').innerHTML = DATA.variables.map(v => `<label>${esc(v.label)}<input data-k="${esc(v.key)}" value="${esc(values[v.key])}" ${v.secret ? 'type="password" autocomplete="off"' : ''} spellcheck="false" title="${esc(v.help)}"><span class="muted" style="font-weight:400">${esc(v.help)}</span></label>`).join('');
  const mark = i => i.classList.toggle('unset', /PASTE/.test(i.value));
  document.querySelectorAll('#vars input').forEach(i => { mark(i); i.addEventListener('input', () => { values[i.dataset.k] = i.value; mark(i); store.set('fs-api-values', JSON.stringify(values)); paintAll() }) });
}
function render(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '', nav = '';
  for (const c of DATA.categories) {
    const eps = c.endpoints.filter(e => !f || [e.method, e.path, e.title, e.description, c.title, ...(e.bodyFields || []).map(x => x.name)].join(' ').toLowerCase().includes(f));
    if (!eps.length) continue;
    nav += `<div class="group" data-cat="${c.id}"><a href="#${c.id}"><span class="ic">${ICONS[c.id] || '•'}</span>${esc(c.title)}<span class="n">${eps.length}</span></a>
      <div class="eps">${eps.map(e => `<a href="#${e.id}" data-ep="${e.id}"><span class="pill ${e.method}">${e.method}</span>${esc(e.title)}</a>`).join('')}</div></div>`;
    html += `<section class="cat" id="${c.id}"><div class="cat-head"><div class="ic">${ICONS[c.id] || '•'}</div><div><h2>${esc(c.title)}</h2><p>${md(c.summary)}</p><span class="who">👤 ${md(c.who)}</span></div></div>`;
    for (const e of eps)
      html += `<details class="card ep" id="${e.id}" ${f ? 'open' : ''}><summary><span class="pill ${e.method}">${e.method}</span>
        <span><div class="ttl">${esc(e.title)}</div><div class="pth">${pathHtml(e.path)}</div></span>
        <span class="badges">${e.danger ? '<span class="badge danger">cannot be undone</span>' : ''}${authBadge(e)}<span class="chev">›</span></span></summary>
        <div class="ep-body"><div class="doc">${docHtml(e)}</div>${codeHtml(e)}</div></details>`;
    html += '</section>';
  }
  const navEl = document.getElementById('nav');
  navEl.innerHTML = nav;
  navEl.classList.toggle('filtered', !!f);
  document.getElementById('main').innerHTML = html || '<div class="card empty">No endpoint matches. Try another word.</div>';
  paintAll();
  spy();
}
function collection() {
  const item = e => {
    const raw = url(e, true), [b, qs] = raw.split('?');
    const r = { method: e.method, header: [], description: e.description, url: { raw, host: ['{{baseUrl}}'], path: b.replace('{{baseUrl}}', '').split('/').filter(Boolean),
      query: qs ? qs.split('&').map(p => { const [k, v] = p.split('='); return { key: k, value: decodeURIComponent(v) } }) : [] } };
    if (e.auth === 'none' || e.auth === 'webhook') r.auth = { type: 'noauth' };
    if (e.auth === 'basic') r.auth = { type: 'basic', basic: [{ key: 'username', value: 'CLIENT_ID' }, { key: 'password', value: 'CLIENT_SECRET' }] };
    if (e.body) { r.header.push({ key: 'Content-Type', value: 'application/json' }); r.body = { mode: 'raw', raw: JSON.stringify(e.body, null, 2), options: { raw: { language: 'json' } } } }
    if (e.form) r.body = { mode: 'urlencoded', urlencoded: Object.entries(e.form).map(([key, value]) => ({ key, value })) };
    if (e.multipart) r.body = { mode: 'formdata', formdata: [{ key: 'file', type: 'file', src: [] }] };
    const out = { name: e.title, request: r };
    if (e.response && typeof e.response.body !== 'string') out.response = [{ name: 'Example', originalRequest: r, code: e.response.status, header: [{ key: 'Content-Type', value: 'application/json' }], body: JSON.stringify(e.response.body, null, 2), _postman_previewlanguage: 'json' }];
    return out;
  };
  const out = { info: { name: 'FAST Studio API', schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json', description: DATA.intro },
    auth: { type: 'bearer', bearer: [{ key: 'token', value: '{{token}}', type: 'string' }] },
    variable: DATA.variables.map(v => ({ key: v.key, value: values[v.key] })),
    item: DATA.categories.map(c => ({ name: c.title, description: c.summary, item: c.endpoints.filter(e => !e.noExample).map(item) })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'FAST-Studio.postman_collection.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let observer;
function spy() {
  observer?.disconnect();
  observer = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return;
    document.querySelectorAll('#nav .group').forEach(g => g.classList.toggle('on', g.dataset.cat === x.target.id)) }), { rootMargin: '-72px 0px -75% 0px' });
  document.querySelectorAll('section.cat').forEach(s => observer.observe(s));
}
function openHash() {
  const t = location.hash && document.querySelector(location.hash);
  if (t && t.tagName === 'DETAILS') { t.open = true; paint(t.querySelector('.code[data-i]') || document.createElement('div')); setTimeout(() => t.scrollIntoView({ block: 'start', behavior: 'instant' }), 120) }
}
renderHero();
renderVars();
render();
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from the server's ${DATA.routeCount} routes, docs/api/*.json and ${DATA.responseCount} answers recorded from the demo (shortened; secrets replaced). Every route, field and parameter is documented; the build fails otherwise.`;
document.getElementById('q').addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus() } });
document.getElementById('postman').addEventListener('change', paintAll);
document.getElementById('collection').addEventListener('click', collection);
document.getElementById('reset').addEventListener('click', () => { values = { ...DEFAULTS }; store.set('fs-api-values', '{}'); renderVars(); paintAll() });
document.getElementById('expand').addEventListener('click', e => { const open = e.target.textContent === 'Expand all'; document.querySelectorAll('details.ep').forEach(d => d.open = open); e.target.textContent = open ? 'Collapse all' : 'Expand all'; paintAll() });
document.getElementById('main').addEventListener('toggle', e => { if (e.target.open) { const c = e.target.querySelector('.code[data-i]'); if (c) paint(c) } }, true);
document.getElementById('main').addEventListener('click', e => {
  const tab = e.target.closest('.tabs button[data-tab]');
  if (tab) { tab.parentElement.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab)); paint(tab.closest('.code')); return }
  const cp = e.target.closest('.tabs .cp'); if (!cp) return;
  const text = cp.closest('.code').querySelector('pre').dataset.copy || '';
  const done = () => { cp.textContent = 'Copied ✓'; cp.classList.add('ok'); setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('ok') }, 1400) };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done() });
});
document.getElementById('nav').addEventListener('click', e => { const a = e.target.closest('a[data-ep]'); if (a) { const d = document.getElementById(a.dataset.ep); d.open = true; } });
window.addEventListener('hashchange', openHash);
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
openHash();
</script>
</body>
</html>
