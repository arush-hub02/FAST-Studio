<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Studio Features</title>
<!-- Generated by tools/build-feature-docs.mjs from docs/features/features.json. Edit those, not docs/html/FEATURES.html. -->
<style>
  :root { --bg:#f5f6fa; --panel:#fff; --panel2:#fafbfe; --ink:#141a2e; --muted:#5d6680; --faint:#8a92a8; --line:#e4e7f0; --accent:#4f46e5; --accent-soft:#eef0ff;
          --ok:#047857; --ok-soft:#e3f6ee; --warn:#b45309; --warn-soft:#fff2dc; --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0a0d15; --panel:#11162a; --panel2:#0e1324; --ink:#e8ebf5; --muted:#a0a8bf; --faint:#6e7790; --line:#222a42;
          --accent:#8b8cff; --accent-soft:#1c2042; --ok:#34d399; --ok-soft:#0e2a21; --warn:#fbbf24; --warn-soft:#2c220c; --shadow:none; } }
  :root[data-theme="dark"] { --bg:#0a0d15; --panel:#11162a; --panel2:#0e1324; --ink:#e8ebf5; --muted:#a0a8bf; --faint:#6e7790; --line:#222a42;
          --accent:#8b8cff; --accent-soft:#1c2042; --ok:#34d399; --ok-soft:#0e2a21; --warn:#fbbf24; --warn-soft:#2c220c; --shadow:none; }
  * { box-sizing: border-box; }
  /* stable scrollbar: filtering or opening the zoom never shifts the page sideways */
  html { scroll-behavior: smooth; scroll-padding-top: 76px; scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 13px; transition: border-color .15s, background .15s; }
  button:hover { border-color: var(--accent); }
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1320px; margin: 0 auto; padding: 10px 18px; display: flex; gap: 12px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; white-space: nowrap; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #ec4899); display: grid; place-items: center; color: #fff; font-size: 14px; }
  .search { flex: 1; max-width: 560px; position: relative; min-width: 0; }
  .search input { width: 100%; padding: 9px 12px 9px 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  .search input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
  .search::before { content: "⌕"; position: absolute; left: 12px; top: 6px; color: var(--faint); font-size: 18px; }
  .count { font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 80px; }
  .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; max-width: 1320px; margin: 0 auto; padding: 20px 18px 40px; }
  nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; font-size: 14px; }
  nav .area { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin: 14px 10px 6px; }
  nav .area:first-child { margin-top: 0; }
  nav a { display: block; padding: 7px 10px; border-radius: 9px; color: var(--ink); text-decoration: none; transition: background .15s, color .15s; border-left: 3px solid transparent; }
  nav a:hover { background: var(--panel); }
  nav a.on { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .hidden { display: none !important; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
  .hero { padding: 24px 26px; margin-bottom: 22px; }
  .hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); max-width: 900px; }
  .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px; margin-top: 18px; }
  .overview a { display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel2); text-decoration: none; color: var(--ink); transition: border-color .15s; }
  .overview a:hover { border-color: var(--accent); }
  .overview b { display: block; font-size: 14.5px; } .overview span { font-size: 12.5px; color: var(--muted); }
  article { padding: 24px 26px; margin-bottom: 22px; }
  article h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .summary { font-size: 15.5px; margin: 0 0 16px; }
  .glance { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; margin-bottom: 18px; }
  .box { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel2); overflow-wrap: anywhere; min-width: 0; }
  .box h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
  ul, ol { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
  ol.steps { list-style: none; padding: 0; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding-left: 32px; margin: 8px 0; }
  ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 700; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; margin-bottom: 18px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); }
  /* the image box has its final size before the picture loads (width/height + aspect-ratio), so nothing below it moves */
  figure button { display: block; width: 100%; padding: 0; border: 0; border-radius: 0; background: var(--panel2); cursor: zoom-in; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .missing { padding: 30px 12px; text-align: center; color: var(--warn); background: var(--warn-soft); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { border: 0; border-radius: 9px 9px 0 0; background: transparent; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  /* all panels share one grid cell, so the box is as tall as the longest one: switching tabs never moves the page */
  .panels { display: grid; }
  .panel { grid-area: 1 / 1; visibility: hidden; }
  .panel.on { visibility: visible; }
  .panel.load { border-left: 3px solid var(--accent); padding-left: 14px; }
  .zoom { position: fixed; inset: 0; z-index: 30; background: rgba(5,8,16,.86); display: none; align-items: center; justify-content: center; padding: 56px 64px; }
  .zoom.on { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .zoom .cap { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); color: #e8ebf5; font-size: 14px; max-width: 80%; text-align: center; }
  .zoom .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.12); color: #fff; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; }
  .zoom .prev { left: 12px; } .zoom .next { right: 12px; } .zoom .close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.12); color: #fff; border: 0; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { max-width: 1320px; margin: 0 auto; padding: 0 18px 36px; color: var(--muted); font-size: 13px; }
  @media (max-width: 960px) { .glance { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } nav { display: none; } .count, .brand span { display: none; } .zoom { padding: 50px 8px; } article, .hero { padding: 18px; } }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><div class="logo">★</div><span>FAST Studio features</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search features: token, limits, export…" aria-label="Search features"></div>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <a href="API.html"><button>API reference</button></a>
  <button id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
</div></header>
<div class="layout">
  <nav id="nav" aria-label="Features"></nav>
  <main>
    <div class="card hero"><h1>Features</h1><p id="intro"></p><div class="overview" id="overview"></div></div>
    <div id="main"></div>
    <div class="card empty hidden" id="none">No feature matches. Try another word.</div>
  </main>
</div>
<footer id="foot"></footer>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Screenshot">
  <button class="close" id="zclose">Close ✕</button><button class="nav prev" id="zprev" aria-label="Previous">‹</button>
  <img alt=""><button class="nav next" id="znext" aria-label="Next">›</button><div class="cap" id="zcap"></div>
</div>
<script>
const DATA = /*__FEATURES__*/null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const list = (items, tag = 'ul') => items && items.length ? `<${tag}>${items.map(i => `<li>${md(i)}</li>`).join('')}</${tag.split(' ')[0]}>` : '<p style="color:var(--muted);margin:0">None.</p>';
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const api = a => a.link ? `<a href="${esc(a.link)}" title="Open in the API reference"><code>${esc(a.text)}</code> ↗</a>` : `<code>${esc(a.text)}</code>`;
const TABS = [['howItWorks', 'How it works'], ['optimizations', 'Optimizations'], ['scale', 'Under heavy load'], ['rules', 'Rules and limits'], ['api', 'API'], ['tests', 'Tests'], ['docs', 'More detail']];

document.getElementById('intro').innerHTML = md(DATA.intro);
const SHOTS = [];   // every picture, for the zoom's previous/next
let nav = '', main = '', area = '';
for (const f of DATA.features) {
  if (f.area !== area) { area = f.area; nav += `<div class="area" data-area="${esc(area)}">${esc(area)}</div>` }
  nav += `<a href="#${esc(f.id)}" data-id="${esc(f.id)}">${esc(f.title)}</a>`;
  const tabs = TABS.filter(([k]) => f[k] && f[k].length);
  const text = [f.title, f.summary, f.area, ...f.who, ...f.steps, ...f.howItWorks, ...f.optimizations, ...f.scale, ...f.rules, ...f.api.map(a => a.text)].join(' ').toLowerCase();
  main += `<article class="card" id="${esc(f.id)}" data-area="${esc(f.area)}" data-text="${esc(text)}">
    <h2>${esc(f.title)}</h2>
    <div class="meta"><span class="chip ok">${esc(f.status)}</span><span class="chip">${esc(f.area)}</span><span class="chip">Completed ${esc(f.completed)}</span></div>
    <p class="summary">${md(f.summary)}</p>
    <div class="glance"><div class="box"><h3>Who can use it</h3>${list(f.who)}</div><div class="box"><h3>How to use it</h3>${list(f.steps, 'ol class="steps"')}</div></div>
    ${f.screenshots.length ? `<div class="shots">${f.screenshots.map(s => {
      if (!s.exists) return `<figure><div class="missing">Screenshot not taken yet: run npm run docs:shots</div><figcaption>${md(s.caption)}</figcaption></figure>`;
      const i = SHOTS.push(s) - 1;
      return `<figure><button data-shot="${i}" aria-label="Enlarge: ${esc(s.caption)}"><img src="${esc(s.src)}" width="${s.width}" height="${s.height}" alt="${esc(s.caption)}" loading="lazy" decoding="async" style="aspect-ratio:${s.width}/${s.height}"></button><figcaption>${md(s.caption)}</figcaption></figure>`;
    }).join('')}</div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l], n) => `<button role="tab" data-tab="${k}" class="${n ? '' : 'on'}">${l}</button>`).join('')}</div>
    <div class="panels">${tabs.map(([k], n) => `<div class="panel${k === 'scale' ? ' load' : ''}${n ? '' : ' on'}" data-panel="${k}">${k === 'api' ? `<ul>${f.api.map(a => `<li>${api(a)}</li>`).join('')}</ul>` : list(f[k])}</div>`).join('')}</div>
  </article>`;
}
document.getElementById('nav').innerHTML = nav;
document.getElementById('main').innerHTML = main;
document.getElementById('overview').innerHTML = DATA.features.map(f => `<a href="#${esc(f.id)}" data-id="${esc(f.id)}"><b>${esc(f.title)}</b><span>${esc(f.area)}</span></a>`).join('');
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from docs/features/features.json. ${DATA.features.length} features.`;

// search hides non-matching features instead of rebuilding the page, so nothing flickers or jumps
const articles = [...document.querySelectorAll('article')];
function filter(text) {
  const f = text.trim().toLowerCase();
  let shown = 0;
  for (const a of articles) {
    const hit = !f || a.dataset.text.includes(f);
    a.classList.toggle('hidden', !hit);
    document.querySelectorAll(`[data-id="${a.id}"]`).forEach(x => x.classList.toggle('hidden', !hit));
    shown += hit;
  }
  document.querySelectorAll('nav .area').forEach(h => h.classList.toggle('hidden', !articles.some(a => a.dataset.area === h.dataset.area && !a.classList.contains('hidden'))));
  document.getElementById('none').classList.toggle('hidden', shown > 0);
  document.getElementById('count').textContent = f ? `${shown} of ${articles.length}` : `${articles.length} features`;
}
filter('');
document.getElementById('q').addEventListener('input', e => filter(e.target.value));
document.getElementById('main').addEventListener('click', e => {
  const t = e.target.closest('.tabs button');
  if (t) {
    const art = t.closest('article');
    art.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === t));
    art.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.panel === t.dataset.tab));
    return;
  }
  const s = e.target.closest('button[data-shot]');
  if (s) show(+s.dataset.shot);
});
// the menu follows the reading position
const links = [...document.querySelectorAll('nav a')];
const obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.id === x.target.id)) }),
  { rootMargin: '-76px 0px -70% 0px' });
articles.forEach(a => obs.observe(a));
// zoom with previous/next and keyboard
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img');
let cur = 0;
function show(i) {
  cur = (i + SHOTS.length) % SHOTS.length;
  zimg.src = SHOTS[cur].src; zimg.alt = SHOTS[cur].caption;
  document.getElementById('zcap').textContent = SHOTS[cur].caption;
  zoom.classList.add('on');
  document.getElementById('zprev').classList.toggle('hidden', SHOTS.length < 2);
  document.getElementById('znext').classList.toggle('hidden', SHOTS.length < 2);
}
const close = () => zoom.classList.remove('on');
document.getElementById('zclose').onclick = close;
document.getElementById('zprev').onclick = e => { e.stopPropagation(); show(cur - 1) };
document.getElementById('znext').onclick = e => { e.stopPropagation(); show(cur + 1) };
zoom.addEventListener('click', e => { if (e.target === zoom) close() });
document.addEventListener('keydown', e => {
  if (zoom.classList.contains('on')) { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); return }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus() }
});
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
</script>
</body>
</html>
