<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAST Studio Features</title>
<!-- Generated by tools/build-feature-docs.mjs from docs/features/features.json. Edit those, not docs/FEATURES.html. -->
<style>
  :root { --bg:#f6f7fb; --panel:#fff; --ink:#151a2d; --muted:#5b6478; --line:#e3e6ef; --accent:#4f46e5; --accent-soft:#eef0ff; --ok:#047857; --ok-soft:#e7f7f0; --warn:#b45309; --warn-soft:#fff6e5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b0e16; --panel:#121726; --ink:#e7eaf3; --muted:#9aa3b8; --line:#232a3d; --accent:#8b8cff; --accent-soft:#1d2140; --ok:#34d399; --ok-soft:#0f2a22; --warn:#fbbf24; --warn-soft:#2b220e; } }
  :root[data-theme="dark"] { --bg:#0b0e16; --panel:#121726; --ink:#e7eaf3; --muted:#9aa3b8; --line:#232a3d; --accent:#8b8cff; --accent-soft:#1d2140; --ok:#34d399; --ok-soft:#0f2a22; --warn:#fbbf24; --warn-soft:#2b220e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  .intro { color: var(--muted); max-width: 820px; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 24px; max-width: 1180px; margin: 0 auto; padding: 16px; }
  nav { position: sticky; top: 12px; align-self: start; }
  nav input { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; margin-bottom: 12px; }
  nav .area { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  nav a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
  nav a:hover, nav a.on { background: var(--accent-soft); color: var(--accent); }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  article h2 { margin: 0 0 4px; font-size: 21px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  h3 { font-size: 15px; margin: 20px 0 6px; }
  ol, ul { margin: 0; padding-left: 22px; }
  li { margin: 3px 0; }
  code { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; overflow-wrap: anywhere; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .load { border-left: 3px solid var(--accent); padding-left: 12px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  figcaption { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .missing { padding: 30px 12px; text-align: center; color: var(--warn); background: var(--warn-soft); }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .zoom.on { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
</style>
</head>
<body>
<header><h1>FAST Studio features</h1><div class="intro" id="intro"></div></header>
<div class="layout"><nav id="nav"><input id="q" type="search" placeholder="Search features…" aria-label="Search features"></nav><main id="main"></main></div>
<footer id="foot"></footer>
<div class="zoom" id="zoom" role="dialog" aria-label="Screenshot"><img alt=""></div>
<script>
const DATA = {"product":"FAST Studio","intro":"What each finished feature does, who can use it and how, with screenshots of the real screens. Screenshots are re-taken from the running demo by `npm run docs:shots` (frontend), so they follow the UI; the page is rebuilt by `node tools/build-feature-docs.mjs`. See .claude/skills/feature-docs/SKILL.md.","accounts":{"owner":"Asha Rao","operator":"Ravi Menon","analyst":"Lena Fischer","partner":"Sam Lee","platform":"Platform Admin"},"features":[{"id":"personal-access-tokens","title":"Personal access tokens (API tokens for scripts and MCP)","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Anyone can create long-lived tokens on their profile so a script or an AI assistant (an MCP client) can work as them without their password. Each token works in one place, as at most the role chosen for it, and never more than its owner may do now. Expiry is chosen per token: 7, 30, 90 or 365 days, a custom number of days, or none.","who":["Every signed-in person, in every role","Customer roles: Owner to Read-only","Partner roles: Partner admin, Partner viewer","Platform administrators: platform-scope tokens"],"steps":["Open your profile (your name, top right) and choose the API Tokens tab.","Give the token a name that says what uses it, e.g. \"Claude desktop (read-only)\".","Choose where it works: one of your organizations, or Platform administration (platform administrators only).","Choose the most it may do. Only your own role and lower ones are offered; Read-only is the default.","Choose when it expires, or No expiry.","Create it and copy the token straight away: it starts with fsp_ and is shown only once.","Use it as the header Authorization: Bearer fsp_… in the script or MCP client. Revoke it on the same tab when it is no longer needed."],"rules":["Only a SHA-256 fingerprint of the token is stored; the token itself is shown once.","Every call is checked again: a revoked or expired token, a removed membership or a lowered role takes effect at once.","A token never does more than the role chosen for it or the owner's current role (the permissions are the intersection).","Organization tokens reach only that organization's API (/api/orgs/{org}/…; partners also /api/partners/{partner}/…). Platform tokens reach only /api/platform/…. All can read GET /api/auth/me.","Tokens can't change passwords or create, list or revoke tokens.","Tokens are 256-bit random values, so they can't be guessed. Bad tokens are logged per client address for monitoring, but never block valid tokens (one old script retrying a revoked token must not lock out a whole office).","Creating and revoking tokens is recorded in the organization's (or platform's) audit trail.","There is no FAST Studio MCP server yet: MCP clients need a server that calls this API with the token."],"api":["GET /api/auth/personal-tokens","POST /api/auth/personal-tokens {name, org (id, slug or \"platform\"), role, expiresInDays (null = no expiry)}","DELETE /api/auth/personal-tokens/{id}","Any allowed API call with Authorization: Bearer fsp_…"],"tests":["backend: PersonalTokenTest","frontend: e2e/tokens.spec.ts"],"docs":["docs/PARTNER_ACCESS_AND_TOKENS.md","docs/SECURITY_AND_RIGHTS.md"],"screenshots":[{"id":"pat-tab","account":"owner","path":"/aurora","caption":"The API Tokens tab: name, where it works, the most it may do (your role or lower) and the expiry.","src":"features/img/personal-access-tokens--pat-tab.png","exists":true},{"id":"pat-created","account":"owner","path":"/aurora","caption":"Right after creating: the token is shown once to copy (hidden in this picture). Here it was made with No expiry.","src":"features/img/personal-access-tokens--pat-created.png","exists":true},{"id":"pat-platform","account":"platform","path":"/platform","caption":"A platform administrator can make platform-scope tokens for /api/platform/….","src":"features/img/personal-access-tokens--pat-platform.png","exists":true},{"id":"pat-partner","account":"partner","path":"/","caption":"Partner members choose partner roles (Partner admin or Read-only partner viewer) for the partner API.","src":"features/img/personal-access-tokens--pat-partner.png","exists":true}],"howItWorks":["Creating: 32 random bytes become the token (fsp_ + Base64). Only its SHA-256 fingerprint, the scope (organization, or none for platform), the role ceiling and the expiry are saved; the token itself is returned once.","Using: when a request carries Authorization: Bearer fsp_…, the security filter fingerprints it, finds the row, checks it is neither revoked nor expired and that the owner still belongs to that organization (or is still a platform administrator).","It then mints an ordinary 10-minute signed sign-in token (JWT) in memory, with only that organization and the narrowed role, and the request continues exactly like a normal signed-in call: organization-in-path check, database membership check and row-level security all apply.","Narrowing: permissions = what the chosen role allows AND what the owner's current role (including custom roles) allows; the role is the lower of the two. A demotion or removal therefore applies to the very next call.","Fencing: a web rule lets organization tokens reach only /api/orgs/… (partners also /api/partners/…), platform tokens only /api/platform/…, and every token GET /api/auth/me. Account endpoints (password, tokens) are never reachable with a token.","Revoking sets revoked_at; the server forgets its cached \"still valid\" answer at once."],"optimizations":["Lookup is one probe on a unique index (token_hash); the secret is never compared character by character, so there is no timing leak.","last_used_at is written at most once a minute per token, so a busy script doesn't turn every read into a database write.","The \"is this token still valid\" check on the minted sign-in token is cached for 30 seconds per server, like the existing sign-in version check.","Nothing is stored per call: no sessions, no saved access tokens. Servers stay stateless and interchangeable.","The profile tab loads one list request only when it is opened (the screen code itself is downloaded on demand).","Each person may keep at most 25 active tokens, which keeps the table and the list small."],"scale":["Per call the exchange costs about four small indexed queries and one ES256 signature (well under a millisecond of CPU). That is comfortable for scripts and AI assistants making tens to hundreds of calls a second per server.","Any number of servers can serve tokens: all state is in PostgreSQL and nothing is tied to one server.","Bad tokens cost one indexed lookup and are logged per client address in the shared database; a 256-bit token can't be guessed, so valid tokens are never blocked by an address's failures.","Known ceiling: a single token driving thousands of calls a second pays the exchange on every call. Upgrade path: cache the minted sign-in token per token fingerprint for its 10-minute life, keyed on the owner's token version and cleared on revoke.","Revocation is immediate on the server that handled it and within 30 seconds on other servers (the shared validity cache). Use \"sign out everywhere\" or a role change for an instant stop everywhere."]},{"id":"sign-in-protection","title":"Sign-in protection and security headers","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Limits on guessing passwords, reset emails and partner credentials, shared by every server; outbound address checks on ad servers and remote media including redirects; ad-tag URLs encrypted at rest; browser security headers. Nothing to click: it works in the background.","who":["Everyone, automatically"],"steps":["After 5 wrong passwords for one account within 5 minutes, that account waits a few minutes (\"Too many attempts\").","After 20 failed sign-ins from one address within 15 minutes (many accounts), that address waits.","One address can request at most 10 password-reset emails an hour; each account gets at most 3 an hour.","Partner client-credential guessing is limited per address the same way (20 failures per 15 minutes). Bad personal tokens are logged per address but never block valid ones."],"rules":["Limits are stored in the database (auth_attempt), so they hold across restarts and several servers; emails are stored only as hashes.","Behind a proxy the visitor's address is taken from X-Forwarded-For only when the proxy is on a private network.","Ad-server and remote media addresses must be public http(s) hosts; every redirect hop is checked too.","Ad-tag URLs are encrypted (AES-GCM) in the database; older plaintext rows are encrypted at start-up.","Pages send Content-Security-Policy (only the app's own scripts, no framing), Referrer-Policy and Permissions-Policy."],"api":["429 RATE_LIMITED on POST /api/auth/login, /api/auth/token, /api/auth/forgot and /oauth/token"],"tests":["backend: SecurityHardeningTest, PublicUrlTest"],"docs":["docs/SECURITY_AND_RIGHTS.md"],"screenshots":[],"howItWorks":["Each counted event (a wrong password, a reset-email request, a bad partner secret or personal token) adds one row to auth_attempt with a bucket such as login-email:<hash> or login-ip:<address>.","Before the check runs, the server counts that bucket's rows in its time window; at the limit it answers 429 \"Too many attempts\" without checking the password. A successful sign-in clears the account's bucket.","Outbound addresses (ad servers, VAST wrappers, creative and remote video files) are resolved and refused when they point at a private, loopback, link-local, carrier-grade-NAT or other non-public network. Redirects are followed one hop at a time and each hop is checked again; for remote video the final address is resolved before ffmpeg starts.","Ad-tag URLs are sealed with AES-256-GCM before saving and opened only when an ad waterfall is built; rows saved before encryption are sealed automatically at start-up.","Every page carries a Content-Security-Policy that allows only the app's own scripts and forbids framing, plus Referrer-Policy and Permissions-Policy."],"optimizations":["One composite index (bucket, created_at) makes every limit check a short index range scan.","Only failures are counted for sign-in, so normal users add no rows; emails are stored as SHA-256 hashes (no personal data in the table).","An hourly job deletes rows older than a day, so the table stays small however long the system runs.","Inside the security filter the token limit uses a non-throwing check, so an over-limit request is a clean 401 instead of an error page.","Redirect checking reuses one HTTP client per source (connection pooling) and stops after 5 hops.","AES-GCM decryption of an ad tag takes microseconds and happens only when the waterfall is read."],"scale":["A sign-in adds two indexed counts (and two inserts only when it fails). That is tiny next to the deliberate cost of checking a password hash (bcrypt, tens of milliseconds), so the limiter is never the bottleneck.","Limits are shared by every server through PostgreSQL and survive restarts, so scaling out doesn't loosen them.","Behind a load balancer the real visitor address is used (X-Forwarded-For from private-network proxies only), so one busy proxy doesn't lock everyone out and visitors can't fake their address.","Known ceiling: a very large credential-stuffing attack (millions of attempts an hour) would still reach the application and the database. Block such floods earlier with Cloudflare rate limiting or WAF rules in front; this database limiter is the second line.","DNS rebinding between the address check and the actual connection is not yet prevented; the upgrade is an HTTP client that connects only to the checked address."]}],"generatedAt":"2026-10-31"};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const list = (items, tag = 'ul') => items && items.length ? `<${tag}>${items.map(i => `<li>${md(i)}</li>`).join('')}</${tag}>` : '';
document.getElementById('intro').innerHTML = md(DATA.intro);
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from docs/features/features.json. ${DATA.features.length} features.`;

function render(filter = '') {
  const f = filter.toLowerCase();
  const shown = DATA.features.filter(x => !f || JSON.stringify(x).toLowerCase().includes(f));
  const nav = document.getElementById('nav');
  nav.querySelectorAll('.area, a').forEach(e => e.remove());
  let area = '';
  for (const x of shown) {
    if (x.area !== area) { area = x.area; nav.insertAdjacentHTML('beforeend', `<div class="area">${esc(area)}</div>`); }
    nav.insertAdjacentHTML('beforeend', `<a href="#${esc(x.id)}">${esc(x.title)}</a>`);
  }
  document.getElementById('main').innerHTML = shown.map(x => `
    <article id="${esc(x.id)}">
      <h2>${esc(x.title)}</h2>
      <div class="meta"><span class="chip ok">${esc(x.status)}</span><span class="chip">${esc(x.area)}</span><span class="chip">Completed ${esc(x.completed)}</span></div>
      <p>${md(x.summary)}</p>
      <h3>Who can use it</h3>${list(x.who)}
      <h3>How to use it</h3>${list(x.steps, 'ol')}
      ${x.screenshots.length ? `<h3>Screens</h3><div class="shots">${x.screenshots.map(s => `
        <figure>${s.exists ? `<img loading="lazy" src="${esc(s.src)}" alt="${esc(s.caption)}">` : `<div class="missing">Screenshot not taken yet: run npm run docs:shots</div>`}
        <figcaption>${md(s.caption)}</figcaption></figure>`).join('')}</div>` : ''}
      <h3>How it works</h3>${list(x.howItWorks)}
      <h3>Optimizations</h3>${list(x.optimizations)}
      <h3>Under heavy load</h3><div class="load">${list(x.scale)}</div>
      <h3>Rules and limits</h3>${list(x.rules)}
      ${x.api && x.api.length ? `<h3>API</h3>${list(x.api.map(a => '`' + a + '`'))}` : ''}
      ${x.tests && x.tests.length ? `<h3>Tests</h3>${list(x.tests)}` : ''}
      ${x.docs && x.docs.length ? `<h3>More detail</h3>${list(x.docs)}` : ''}
    </article>`).join('') || '<p>No feature matches.</p>';
}
render();
document.getElementById('q').addEventListener('input', e => render(e.target.value));
const zoom = document.getElementById('zoom');
document.addEventListener('click', e => {
  if (e.target.matches('figure img')) { zoom.querySelector('img').src = e.target.src; zoom.classList.add('on'); }
  else if (e.target.closest('#zoom')) zoom.classList.remove('on');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('on'); });
</script>
</body>
</html>
