 types the name wrong."},{"at":"suspend","state":"refused: 409","say":"Refused: an active tenant can't be deleted, and a wrong name gets 400. Customers get 403 for both actions."}]},{"name":"Shared people","steps":[{"at":"people","state":"in 2 tenants","say":"A consultant belongs to this tenant and another one."},{"at":"others","state":"kept","say":"Their account stays for the other tenant; only this tenant's memberships go."}]}]},"steps":["Export: call GET /api/platform/tenants/{tenant}/export (a platform personal access token works). The answer is a JSON file with the tenant, its projects, members and every table's rows.","Delete: first suspend the tenant (Platform administration → Tenants → Suspend).","Then call POST /api/platform/tenants/{tenant}/delete with {\"confirm\": \"<the tenant's exact name>\"}. The answer lists how many rows were deleted per table.","There is no screen for these two actions yet; they are API only."],"howItWorks":["The tables to export and delete are found from the database catalog: every table with an org_id, owner_org_id, partner_org_id or tenant_id column. New tables are covered without code changes.","Export leaves out credentials, hashes and unredacted mail (token ids and secrets, webhook secrets, ad-tag URLs, password and token hashes, queued email text).","Deletion runs in one transaction: channels are taken off the edge (a final ARCHIVED snapshot, so open players show the standby slate), references between the tenant's own tables are cleared, rows are deleted children-first using the foreign keys, projects and the tenant are removed.","People who belonged only to this tenant are anonymized (email, name and password replaced; sign-in tokens and personal tokens removed), not deleted, because audit records elsewhere may name them. People who also belong to another tenant keep their account.","Local video and upload folders of the deleted projects are removed; both actions are recorded in the platform audit log."],"optimizations":["One query per table, filtered by the tenant's organizations with = any(array), so each table is read or deleted with one index-assisted statement.","No hand-kept table list to fall out of date."],"scale":["Export builds the whole answer in memory: fine for a pilot tenant; for very large tenants (millions of playback events) stream it to a file instead. Not measured.","Deletion of a large tenant is one long transaction holding row locks only on that tenant's rows; other tenants are not blocked. Not measured at volume.","Known gaps: video copies already on the edge storage (R2) are not deleted yet, and there is no waiting period between deletion request and purge."],"rules":["Platform administrators only; customers get 403.","Deletion requires the tenant to be suspended and its exact name typed; otherwise 409 or 400.","Video files are not part of the export."],"api":[{"text":"GET /api/platform/tenants/{tenant}/export","link":"API.html#ep-get-api-platform-tenants-tenant-export"},{"text":"POST /api/platform/tenants/{tenant}/delete","link":"API.html#ep-post-api-platform-tenants-tenant-delete"}],"tests":["TenantDataTest (export, then delete one tenant; the other stays untouched)"],"docs":["docs/MULTITENANCY.md §4"],"screenshots":[]},{"id":"platform-people","title":"People across organizations","area":"Multi-tenancy","status":"Built (P2, 2026-11-03)","completed":"2026-11-03","summary":"Platform administrators see everyone with an account and every organization they belong to, add people to any organization with a role, change or remove roles, and switch an account off or on. The tenant page has the same list for one tenant's projects.","who":["Platform administrators"],"flow":{"title":"From the People page to a person's sign-in","intro":"The boxes are the parts involved; the pill is the request moving through. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"People page","sub":"/platform/people"},{"id":"svc","col":2,"row":1,"icon":"⚖️","label":"People rules","sub":"PlatformPeopleServiceV1"},{"id":"db","col":3,"row":1,"icon":"🗄️","label":"app_user + membership","sub":"one query per page"},{"id":"tokens","col":2,"row":2,"icon":"🔑","label":"Tokens","sub":"version per person"},{"id":"person","col":3,"row":2,"icon":"👤","label":"The person","sub":"their next request"}],"scenarios":[{"name":"Add someone to an organization","steps":[{"at":"admin","state":"Add person","say":"Enter an email, name, organization and role.","tech":"`POST /api/platform/people`"},{"at":"svc","state":"role fits","say":"The role must fit the organization kind; a new email gets an account with a one-time password."},{"at":"db","state":"membership","say":"The membership row is added."},{"at":"tokens","state":"bumped","say":"Their tokens are bumped so the new organization appears on their next refresh."}]},{"name":"Switch an account off","steps":[{"at":"admin","state":"Switch off","say":"Confirm switching the account off.","tech":"`PUT /api/platform/people/{userId}/status`"},{"at":"db","state":"disabled_at","say":"disabled_at is set and every sign-in (refresh token) is revoked."},{"at":"tokens","state":"-1","say":"The token version reads -1 for a switched-off account."},{"at":"person","state":"401","say":"Their next request is refused; sign-in fails until the account is switched back on."}]}]},"steps":["Platform administration → People.","Or open a tenant → People for the people in that tenant's projects only; new memberships there go to its projects.","Search by name or email.","Add person: email, name, organization, role (built-in or one of that organization’s custom roles). New accounts get a one-time password, shown once and emailed.","Click an organization chip to change the role, or × to remove the person from it.","Switch off signs the person out everywhere; Switch on restores everything. Reset password creates a one-time link."],"howItWorks":["One query returns a page of people with their memberships (json_agg) and the total count (window function).","Role changes, removals and switching off bump the person's token version, so their access changes at once; switching off also revokes refresh tokens, and Tokens.mint refuses switched-off accounts (ACCOUNT_DISABLED).","The last plain owner of an organization can't be demoted or removed (409 LAST_OWNER)."],"optimizations":["One query per page of people, memberships included.","Index membership_user (V29) for per-person membership lookups at sign-in."],"scale":["Paged by 50 (up to 200)."],"rules":["Platform administrators only.","Customer roles only in customer organizations, partner roles only in partner organizations.","You can't switch off your own account.","Memberships and history are kept when an account is switched off."],"api":[{"text":"GET /api/platform/people","link":"API.html#ep-get-api-platform-people"},{"text":"POST /api/platform/people","link":"API.html#ep-post-api-platform-people"},{"text":"GET /api/platform/people/roles","link":"API.html#ep-get-api-platform-people-roles"},{"text":"GET /api/platform/people/{userId}","link":"API.html#ep-get-api-platform-people-userid"},{"text":"PUT /api/platform/people/{userId}/memberships/{orgId}","link":"API.html#ep-put-api-platform-people-userid-memberships-orgid"},{"text":"DELETE /api/platform/people/{userId}/memberships/{orgId}","link":"API.html#ep-delete-api-platform-people-userid-memberships-orgid"},{"text":"PUT /api/platform/people/{userId}/status","link":"API.html#ep-put-api-platform-people-userid-status"}],"tests":["PlatformAdminStagesTest (people, last owner, switched-off accounts stop at once)","frontend/e2e/admin-stages.spec.ts (platform manages people across organizations)"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"people","account":"platform","path":"/platform/people","caption":"Everyone, their organizations and roles, and account status.","src":"../features/img/platform-people--people.png","exists":true,"width":1440,"height":900},{"id":"tenant-people","account":"platform","path":"/platform","caption":"One tenant's people: only its projects' members, and only its projects to add them to.","src":"../features/img/platform-people--tenant-people.png","exists":true,"width":1440,"height":900}]},{"id":"project-media-types","title":"Project media types","area":"Media library","status":"Built (P4, 2026-11-03)","completed":"2026-11-03","summary":"Besides the platform's media types it is entitled to, a project creates its own types (for example Trailer) with the scheduling behaviour of an existing kind.","who":["Project owners and administrators (create, edit, delete)","Every project member (use the types)","Platform administrators (see them on the tenant page)"],"flow":{"title":"From a new type to a video","intro":"The boxes are the parts involved; the pill is the request moving through.","nodes":[{"id":"owner","col":1,"row":1,"icon":"👤","label":"Settings → Media types","sub":"project owner"},{"id":"svc","col":2,"row":1,"icon":"⚖️","label":"Media settings","sub":"MediaSettingsServiceV1"},{"id":"own","col":3,"row":1,"icon":"🗄️","label":"project_media_type","sub":"RLS by org_id"},{"id":"lib","col":2,"row":2,"icon":"🎬","label":"Library","sub":"AssetRules"}],"scenarios":[{"name":"Create and use a type","steps":[{"at":"owner","state":"Trailer","say":"New type: name Trailer, behaves like Short.","tech":"`POST /api/orgs/{org}/settings/media-types`"},{"at":"svc","state":"checked","say":"The key may not be a platform type's; kind is fixed from now on."},{"at":"own","state":"saved","say":"The row is stored for this project only."},{"at":"lib","state":"TRAILER","say":"Videos can now use Trailer; saving checks the type against what the project may use."}]}]},"steps":["Settings → Media types.","New type: name, identifier, behaves like (movie, episode, short, ad).","Switch it off to stop new use; delete it once no video uses it.","Turn types on and pick the default under Settings → General."],"howItWorks":["The project's types are the platform types it is entitled to plus its own enabled ones (MediaSettingsServiceV1.view).","asset.media_type no longer has a foreign key to the platform catalogue (V29); every save checks the type through MediaSettingsServiceV1.require.","Keys never collide: a project can't take a platform key and the platform can't take a key a project uses."],"optimizations":["The type lists come from project details already in the browser, not a separate request per screen."],"scale":["Tens of types per project."],"rules":["Owners and administrators only (Manage team).","Kind never changes after creation.","Deleting is refused while videos use the type (409 IN_USE)."],"api":[{"text":"POST /api/orgs/{org}/settings/media-types","link":"API.html#ep-post-api-orgs-org-settings-media-types"},{"text":"DELETE /api/orgs/{org}/settings/media-types/{key}","link":"API.html#ep-delete-api-orgs-org-settings-media-types-key"},{"text":"GET /api/platform/orgs/{orgId}/project-media-types","link":"API.html#ep-get-api-platform-orgs-orgid-project-media-types"}],"tests":["PlatformAdminStagesTest (projects keep their own media types)","frontend/e2e/admin-stages.spec.ts"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"project-media-types","account":"owner","path":"/aurora/settings?tab=media-types","caption":"The platform's types and the project's own.","src":"../features/img/project-media-types--project-media-types.png","exists":true,"width":1440,"height":900}]},{"id":"project-email-templates","title":"Project email wording","area":"Email","status":"Built (P5, 2026-11-03)","completed":"2026-11-03","summary":"A project words the emails sent about it (invitations, password reset and change, alerts, partner sharing, footer) its own way, with a live preview; without its own version the platform's wording is used.","who":["Project owners and administrators (edit)","Every project member (read and preview)"],"flow":{"title":"From the project's wording to a sent email","intro":"The boxes are the parts involved; the pill is the email moving through.","nodes":[{"id":"owner","col":1,"row":1,"icon":"👤","label":"Settings → Emails","sub":"project owner"},{"id":"tpl","col":2,"row":1,"icon":"🧩","label":"EmailTemplates","sub":"project → platform → built-in"},{"id":"own","col":3,"row":1,"icon":"🗄️","label":"project_email_template","sub":"RLS by org_id"},{"id":"mail","col":2,"row":2,"icon":"✉️","label":"MailServiceV1","sub":"renders on send"}],"scenarios":[{"name":"Reword and send","steps":[{"at":"owner","state":"Subject","say":"Change the password reset subject; the preview updates as you type.","tech":"`PUT /api/orgs/{org}/email-templates/password_reset`"},{"at":"own","state":"saved","say":"The project's own version is stored."},{"at":"mail","state":"send","say":"A reset for someone in this project renders with the project's wording."},{"at":"tpl","state":"fallback","say":"Other projects keep the platform's wording."}]}]},"steps":["Settings → Emails.","Pick an email, change the subject or message; required placeholders must stay.","Save template; Back to the platform's wording removes your version."],"howItWorks":["EmailTemplates.list(org) lays the project's rows over the platform's; a send renders the real and the redacted copy from one lookup.","Organization welcome and the test email stay the platform's."],"optimizations":["One template lookup per sent email (was four)."],"scale":["A handful of templates per project."],"rules":["Owners and administrators edit (Manage team); everyone in the project may read and preview.","The same checks as the platform editor: allowed placeholders, required ones, subject length."],"api":[{"text":"GET /api/orgs/{org}/email-templates","link":"API.html#ep-get-api-orgs-org-email-templates"},{"text":"POST /api/orgs/{org}/email-templates/{key}/preview","link":"API.html#ep-post-api-orgs-org-email-templates-key-preview"},{"text":"PUT /api/orgs/{org}/email-templates/{key}","link":"API.html#ep-put-api-orgs-org-email-templates-key"},{"text":"DELETE /api/orgs/{org}/email-templates/{key}","link":"API.html#ep-delete-api-orgs-org-email-templates-key"}],"tests":["PlatformAdminStagesTest (projects word their own emails)","frontend/e2e/admin-stages.spec.ts"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"project-emails","account":"owner","path":"/aurora/settings?tab=emails","caption":"Editing an email with a live preview and the platform's wording to fall back to.","src":"../features/img/project-email-templates--project-emails.png","exists":true,"width":1440,"height":900}]},{"id":"project-details-cache","title":"Fast project loading","area":"Multi-tenancy","status":"Built (2026-11-03)","completed":"2026-11-03","summary":"Project details are fetched after sign-in and kept in the browser, so screens and new tabs open at once from the last copy while a fresh one loads in the background; it refreshes after changes and when you come back to the tab.","who":["Everyone signed in to a project"],"flow":{"title":"From sign-in to an instant screen","intro":"The boxes are the parts involved; the pill is the project details moving through.","nodes":[{"id":"signin","col":1,"row":1,"icon":"🔑","label":"Sign-in","sub":"POST /api/auth/login"},{"id":"boot","col":2,"row":1,"icon":"🧭","label":"Project bootstrap","sub":"App.tsx"},{"id":"store","col":3,"row":1,"icon":"💾","label":"Browser copy","sub":"fs.project.<person>.<project>"},{"id":"api","col":2,"row":2,"icon":"🌐","label":"Project details","sub":"/api/orgs/{org}/project-details"}],"scenarios":[{"name":"Open a screen","steps":[{"at":"signin","state":"signed in","say":"After sign-in the project opens."},{"at":"store","state":"copy","say":"If a copy is stored for this person and project, the screen renders from it at once."},{"at":"api","state":"fresh","say":"A fresh copy loads in the background and replaces it.","tech":"`GET /api/orgs/{org}/project-details`"},{"at":"boot","state":"refused","say":"If the project refuses (403/404), the copy is dropped and the error shown."}]}]},"steps":["Nothing to do: it happens on sign-in.","Changes made in Settings refresh it at once.","Signing out clears every stored copy."],"howItWorks":["shared/projectCache.ts stores the response by person and project; it holds names, switches and permissions, never credentials.","ProjectBootstrap renders from the copy, re-fetches on open, after changes (reloadProject) and when the tab is shown again after 60 s.","Screens that only need media types read them from project details (shared/projectMedia.ts) instead of /settings."],"optimizations":["Project details: about 60 database queries per call down to about 17 (configuration values and connector switches read once per scope).","Channel list: one read-only transaction, the library loaded once instead of once per channel, schedule entries mapped by hand: about 250 ms down to 47 ms on the demo data (local, 2026-11-03)."],"scale":["Measured on the local demo data only."],"rules":["Cleared at sign-out and when the sign-in expires.","The API still checks every permission; the copy is only a display hint."],"api":[{"text":"GET /api/orgs/{org}/project-details","link":"API.html#ep-get-api-orgs-org-project-details"}],"tests":["frontend/e2e/smoke.spec.ts (every main screen)","Browser check 2026-11-03: copy stored without secret fields, screens request data before project details returns, cleared at sign-out."],"docs":["docs/PROJECT_BOOTSTRAP_SECURITY.md"],"screenshots":[]},{"id":"tenant-wide-roles","title":"Tenant-wide roles","area":"Multi-tenancy","status":"Built (2026-11-08)","completed":"2026-11-08","summary":"Platform administrators give a person one role in every project (organization) of a tenant, including projects added later. A role the person has directly in a project stays as it is there.","who":["Platform administrators (give, change, remove)","Project owners and administrators (see it on the Team page; can not change it there)"],"flow":{"title":"From one tenant role to every project","intro":"The boxes are the parts involved; the pill is the role moving through. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Tenant → People","sub":"platform administrator"},{"id":"svc","col":2,"row":1,"icon":"⚖️","label":"Tenant roles","sub":"TenantRoleServiceV1"},{"id":"tm","col":3,"row":1,"icon":"🗄️","label":"tenant_membership","sub":"one row per person"},{"id":"mem","col":3,"row":2,"icon":"🗄️","label":"membership","sub":"via_tenant rows"},{"id":"team","col":1,"row":2,"icon":"👥","label":"Project Team page","sub":"shows it, read-only"}],"scenarios":[{"name":"Give a tenant-wide role","steps":[{"at":"admin","state":"Admin","say":"Add tenant-wide role: email, name, Administrator.","tech":"`POST /api/platform/tenants/{tenant}/members`"},{"at":"tm","state":"saved","say":"The tenant-wide role is stored once."},{"at":"mem","state":"every project","say":"A membership marked via_tenant is written in each project where the person has no role of their own."},{"at":"team","state":"Tenant-wide role","say":"Each Team page shows it; Remove and the role picker are not offered there."}]},{"name":"A project is added later","steps":[{"at":"admin","state":"new project","say":"The platform adds a project to the tenant.","tech":"`POST /api/platform/tenants/{tenant}/projects`"},{"at":"mem","state":"copied","say":"Every tenant-wide role is written into the new project at once."}]}]},"steps":["Platform administration → Tenants → Manage a tenant → People.","Add tenant-wide role: email, name and the role for every project. New accounts get a one-time password.","Change the role in the list, or Remove it; roles people have directly in a project stay."],"howItWorks":["tenant_membership keeps the role; membership rows with via_tenant = true carry it into each project, so sign-in, tokens and permission checks are unchanged.","Writing the role never overwrites a membership the person has directly; changing it updates only via_tenant rows.","Adding a project to the tenant copies every tenant-wide role into it (TenantConfigurationServiceV1.createProject).","The Team page and the platform People page refuse to change or remove a via_tenant row (409 TENANT_WIDE)."],"optimizations":["One statement writes or removes the role in all projects of the tenant."],"scale":["Fine for tenants with tens of projects."],"rules":["Platform administrators only.","Built-in customer roles only.","A role the person has directly in a project wins there.","Every project keeps at least one owner (409 LAST_OWNER)."],"api":[{"text":"GET /api/platform/tenants/{tenant}/members","link":"API.html#ep-get-api-platform-tenants-tenant-members"},{"text":"POST /api/platform/tenants/{tenant}/members","link":"API.html#ep-post-api-platform-tenants-tenant-members"},{"text":"PUT /api/platform/tenants/{tenant}/members/{userId}","link":"API.html#ep-put-api-platform-tenants-tenant-members-userid"},{"text":"DELETE /api/platform/tenants/{tenant}/members/{userId}","link":"API.html#ep-delete-api-platform-tenants-tenant-members-userid"}],"tests":["PlatformAdminStagesTest (tenant-wide roles reach every project, new projects, own roles win, project edits refused, last owner)","frontend/e2e/admin-stages.spec.ts (platform gives a tenant-wide role)"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"tenant-roles","account":"platform","path":"/platform","caption":"Tenant-wide roles above the tenant's people list.","src":"../features/img/tenant-wide-roles--tenant-roles.png","exists":true,"width":1440,"height":900}]},{"id":"library-streaming","title":"Programmes stream from the video library","area":"Media library","status":"Built (2026-11-08), tested against a stand-in for Mux; not yet run against a real Mux account","completed":"2026-11-08","summary":"Library videos (Mux today) play straight from the library at their own segment lengths. FAST Studio splices its own ads (fetched live from your ad servers and converted once into R2) and slate into the live playlist at the breaks. Nothing is copied, and if the library or an ad server can't be reached, slate plays.","who":["Platform administrators (connect the library, optional signing key)","Content managers and owners (sync, get videos ready to stream)","Viewers (one continuous channel)"],"flow":{"title":"One live playlist from two sources","intro":"The boxes are the parts involved; the pill is the video moving through. Pick a situation.","nodes":[{"id":"lib","col":1,"row":1,"icon":"📚","label":"Video library","sub":"Mux"},{"id":"cp","col":2,"row":1,"icon":"⚙️","label":"Control plane","sub":"StreamingServiceV1, EdgePublisher"},{"id":"kv","col":3,"row":1,"icon":"🗂️","label":"Snapshot","sub":"KV: layout + numbering"},{"id":"edge","col":3,"row":2,"icon":"🌐","label":"Edge Worker","sub":"playout.ts, ovp.ts"},{"id":"r2","col":2,"row":2,"icon":"🪣","label":"R2 + CDN","sub":"ads and slate"},{"id":"player","col":1,"row":2,"icon":"📺","label":"Player","sub":"web, iOS, TV"}],"scenarios":[{"name":"Get a library video ready","steps":[{"at":"lib","state":"ready in library","say":"Sync brings the video in as a draft.","tech":"`POST /api/orgs/{org}/library/sync`"},{"at":"cp","state":"reading","say":"\"Get ready to stream\" reads its quality levels and the real length of every segment. Nothing is downloaded.","tech":"`POST /api/orgs/{org}/library/prepare`"},{"at":"cp","state":"Ready","say":"The video is Ready and takes whole 5 s slots in the schedule."}]},{"name":"A viewer watches","steps":[{"at":"kv","state":"published","say":"The channel snapshot lists the programme's segment layout, its sequence numbers and the library's playlist URL."},{"at":"edge","state":"reads once","say":"The edge reads the library's playlist once per location and quality level and reuses it for every viewer."},{"at":"player","state":"programme","say":"Watch aims to play 2.5 segments behind the available edge. Automatic quality adapts to the player size and can step down when frames drop."},{"at":"r2","state":"ad break","say":"The same player switches to ads or slate from R2 at the break, with a discontinuity in between."}]},{"name":"Something is down","steps":[{"at":"lib","state":"unreachable","say":"If the library can't be read, the programme plays slate for the same lengths; numbering doesn't change."},{"at":"r2","state":"slate","say":"If an ad server times out, fails or has no eligible creative by the break, the player sees slate."},{"at":"player","state":"keeps playing","say":"The channel never stops."}]}]},"steps":["Platform administration → the company → Connectors → Mux: access token, webhook secret and, for signed playback IDs, a signing key.","Library → Sync library: library videos arrive as drafts.","Library → Get N ready to stream. The video drawer's Delivery card shows its segments, quality levels and format.","Schedule it like any video; ads and slate are spliced in at its breaks."],"howItWorks":["StreamingServiceV1.resolve reads the library's HLS playlists through the provider's IPlayback adapter and stores the real segment lengths (asset_playback). All quality levels must share segment boundaries; MPEG-TS and fMP4 (CMAF) streams are both accepted.","EdgePublisher lays each programme part out in its 5 s slots (util/cloudflare/Timeline): the library's segments, then slate for the rest of the slot, so listed lengths always add up to the clock.","Segment numbers come from a per-channel anchor (channel_timeline) and stay identical across snapshots and Worker locations.","The Worker (ovp.ts) reads the library's master and rendition playlists, picks the rendition nearest each of our quality levels, caches them per location (memory, then the Cache API) and keeps serving the last good copy when a read fails.","Signed playback: the control plane signs a token per video (RS256, the connection's signing key) valid until 6 hours after the snapshot window.","fMP4 channels: every video, ad and slate FAST Studio packages also gets an fMP4 copy (repackaged, not re-encoded). A channel whose library programmes stream as fMP4 plays all our media from those copies, announcing each source with EXT-X-MAP; media without a matching copy plays slate. The edge can still read older muxed fMP4 packages during an upgrade."],"optimizations":["Library playlists are read once per location, video and quality level and shared by every viewer; viewers fetch video segments from the library's CDN directly.","Watch targets 2.5 HLS segments behind the available edge and moves back toward its target after falling more than five segments behind. Actual delay varies with segment availability, the connection and player buffering. External players use their own buffers.","A viewer's playlist waits for a library read only the first time. Ad decisions are prefetched up to 60 seconds before an SSAI break. An empty decision waiting for a creative can retry before the break.","Snapshots only load the streaming details of videos in their window; the numbering anchor is written once an hour per channel."],"scale":["Edge work per viewer stays a pure function of the snapshot and clock, so any number of Worker locations agree without coordinating.","Library video traffic is billed by the library (per viewer minute); ads and slate come from R2 with no egress fee."],"rules":["Our quality levels are 360p, 540p and 720p; each gets the library rendition nearest in height (1080p from the library needs a 1080p rung for ads and slate first).","A programme part starts at the library segment boundary before its offset and ends at the one before its end, so mid-roll breaks never repeat or skip content (a part can lose up to one segment).","Videos stored by FAST Studio (uploads) keep playing from R2 as before."],"api":[{"text":"POST /api/orgs/{org}/library/prepare","link":"API.html#ep-post-api-orgs-org-library-prepare"},{"text":"GET /api/orgs/{org}/library","link":"API.html#ep-get-api-orgs-org-library"},{"text":"GET /api/orgs/{org}/assets/{id}","link":"API.html#ep-get-api-orgs-org-assets-id"},{"text":"PUT /api/platform/orgs/{orgId}/connectors/mux","link":"API.html#ep-put-api-platform-orgs-orgid-connectors-mux"}],"tests":["MuxTest (prepare → asset_playback → library view → channel snapshot with layout, numbering and URL)","TimelineTest (layouts and numbering)","MuxSignerTest (signed playback tokens)","worker/src/ovp.test.ts (real lengths, numbering across reloads, rendition choice, library unreachable, geo)"],"docs":["docs/OVP_DELIVERY_PLAN.md"],"screenshots":[{"id":"watch-buffer","account":"owner","path":"/aurora/watch","caption":"Watch shows its live buffer target. An external HLS player chooses its own buffer.","src":"../features/img/library-streaming--watch-buffer.png","exists":false}]},{"id":"quality-levels","title":"Quality levels per tenant (360p to 4K)","area":"Media library","status":"Built (2026-11-09)","completed":"2026-11-09","summary":"Platform administrators choose, per tenant, which quality levels its videos, ads and channels use: any of 360p, 540p, 720p, 1080p, 1440p (2K) and 2160p (4K). Every player has a Quality menu (⚙ Settings) to pick a level or Auto, and the video detail page shows which level is playing.","who":["Platform administrators (choose the levels of a tenant)","Everyone who opens a video in the Library (quality menu)"],"flow":{"title":"From a tenant setting to the viewer","intro":"The boxes are the parts involved; the pill is a video moving through.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Tenant → Configuration","sub":"platform administrator"},{"id":"enc","col":2,"row":1,"icon":"🎞️","label":"FFmpeg","sub":"QualityLevels + MediaServiceV1"},{"id":"r2","col":3,"row":1,"icon":"🪣","label":"R2","sub":"one folder per level"},{"id":"edge","col":3,"row":2,"icon":"🌐","label":"Edge Worker","sub":"channel levels"},{"id":"player","col":1,"row":2,"icon":"📺","label":"Player","sub":"picks a level"}],"scenarios":[{"name":"Turn on 1080p","steps":[{"at":"admin","state":"720p + 1080p","say":"Tick the levels and Save quality levels.","tech":"`PUT /api/platform/tenants/{tenant}/properties/media.quality_levels`"},{"at":"enc","state":"encoding","say":"New uploads and ads are converted to exactly those levels."},{"at":"r2","state":"folders 2, 3","say":"Each level has its own folder (0 = 360p … 5 = 2160p)."},{"at":"edge","state":"offers 720p, 1080p","say":"The tenant's channels offer those levels; older media without 1080p plays its 720p there."},{"at":"player","state":"Auto / 1080p","say":"Players pick a level by connection speed, or you pick one in the Library player."}]}]},"steps":["Platform administration → Tenants → the tenant → Configuration → Quality levels.","Tick the levels and Save. New conversions use them within 30 seconds.","Library → open a video → ⚙ Settings → Quality on the player lists its levels (Auto or one); the badge under the player says which one is playing."],"howItWorks":["services/media/QualityLevels holds the six levels and reads the tenant property media.quality_levels (default 360p, 540p, 720p; platform administrators only).","MediaServiceV1 encodes the project's levels in one FFmpeg pass into folders named by level (0 … 5), plus fMP4 copies; slates carry all six.","EdgePublisher puts the tenant's levels in each channel snapshot and, for every piece of media, the levels it has; the Worker plays the nearest lower level when one is missing.","Direct uploads to Mux ask for the 1440p or 2160p resolution tier when the tenant uses those levels."],"optimizations":["One decode, split into all levels in a single FFmpeg run.","Levels per project cached for 30 s, so snapshots don't read settings every 5 s."],"scale":["Higher levels multiply encoding time and storage (about 8 GB per hour of video at 4K); choose them per tenant."],"rules":["Platform administrators only (403 PLATFORM_ONLY for tenant owners).","Changes apply to new conversions; existing media is not re-encoded.","A small source is scaled up to every chosen level."],"api":[{"text":"PUT /api/platform/tenants/{tenant}/properties/media.quality_levels","link":"API.html#ep-put-api-platform-tenants-tenant-properties-key"},{"text":"GET /api/platform/tenants/{tenant}/settings","link":"API.html#ep-get-api-platform-tenants-tenant-settings"}],"tests":["PlatformAdminStagesTest.qualityLevelsArePerTenantAndPlatformOnly","worker/src/playout.test.ts (quality levels)"],"docs":["docs/OVP_DELIVERY_PLAN.md","docs/html/FAQ.html"],"screenshots":[]},{"id":"video-player","title":"Video player (Video.js 10)","area":"Playback","status":"Built (2026-11-09)","completed":"2026-11-09","summary":"Every video in FAST Studio plays in one Video.js 10 player with the title on the video, a quality menu, playback speed, picture-in-picture, fullscreen, casting and keyboard shortcuts.","who":["Everyone who plays a video: Library video detail, Watch live, Partner \"Try it as a viewer\""],"flow":{"title":"From a page to a playing video","intro":"The boxes are the parts involved; the pill is a viewer pressing play.","nodes":[{"id":"page","col":1,"row":1,"icon":"🖥️","label":"Page","sub":"Library / Watch / Partner"},{"id":"player","col":2,"row":1,"icon":"📺","label":"Video.js player","sub":"shared/Player.tsx"},{"id":"hls","col":3,"row":1,"icon":"🧩","label":"hls.js","sub":"inside the player"},{"id":"edge","col":3,"row":2,"icon":"🌐","label":"Edge or library","sub":"HLS playlists"},{"id":"menu","col":1,"row":2,"icon":"⚙️","label":"Settings menu","sub":"Quality, Speed"}],"scenarios":[{"name":"Pick 360p","steps":[{"at":"page","state":"title","say":"The page passes the stream address and the title.","tech":"`<VideoPlayer src title live onEvent />`"},{"at":"player","state":"loading","say":"The player is downloaded the first time a video is shown."},{"at":"hls","state":"Auto (720p)","say":"hls.js reads the playlist and picks a level by connection speed."},{"at":"edge","state":"segments","say":"Segments come from the edge (channels) or the library preview."},{"at":"menu","state":"360p","say":"Settings → Quality → 360p pins that level; the badge shows \"Playing 3 function flowPlayer(el, fl) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tok = el.querySelector('.token'), btn = el.querySelector('[data-act="play"]');
  let scen = 0, step = 0, timer = null, started = false;
  const steps = () => fl.scenarios[scen].steps;
  function draw() {
    const s = steps()[step], node = el.querySelector(`[data-node="${s.at}"]`);
    el.querySelectorAll('.node').forEach(n => { n.classList.toggle('hot', n === node); n.classList.toggle('down', (s.down || []).includes(n.dataset.node)) });
    tok.style.left = node.offsetLeft + node.offsetWidth / 2 + 'px';
    tok.style.top = node.offsetTop + 'px';   // sits on the box's top edge, so the box stays readable
    tok.textContent = '🎬 ' + s.state;
    tok.className = 'token' + (/SUCCEEDED|CANCELLED/.test(s.state) ? ' done' : /FAILED|refused/i.test(s.state) ? ' bad' : '');
    el.querySelector('.say p').innerHTML = md(s.say);
    const tech = el.querySelector('.tech'); tech.innerHTML = md(s.tech || ''); tech.classList.toggle('hidden', !s.tech);
    el.querySelector('.dots').innerHTML = steps().map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
  }
  function play(on) {
    clearInterval(timer); timer = null;
    if (on) timer = setInterval(() => { if (step < steps().length - 1) { step++; draw() } else play(false) }, 3200);
    btn.textContent = timer ? '⏸ Pause' : step === steps().length - 1 ? '↻ Replay' : '▶ Play';
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.scen) { scen = +b.dataset.scen; step = 0; el.querySelectorAll('.scen button').forEach(x => x.classList.toggle('on', x === b)); draw(); play(!reduced); return }
    if (b.dataset.act === 'prev') { step = Math.max(0, step - 1); draw(); play(false) }
    if (b.dataset.act === 'next') { step = Math.min(steps().length - 1, step + 1); draw(); play(false) }
    if (b.dataset.act === 'play') { if (timer) play(false); else { if (step === steps().length - 1) { step = 0; draw() } play(true) } }
  });
  addEventListener('resize', draw);
  draw(); play(false);
  // starts by itself the first time it comes into view (not with reduced motion)
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting && !started) { started = true; o.disconnect(); if (!reduced) play(true) } }, { threshold: .4 }).observe(el);
}

    }).join('')}</div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l], n) => `<button role="tab" data-tab="${k}" class="${n ? '' : 'on'}">${l}</button>`).join('')}</div>
    <div class="panels">${tabs.map(([k], n) => `<div class="panel${k === 'scale' ? ' load' : ''}${n ? '' : ' on'}" data-panel="${k}">${k === 'api' ? `<ul>${f.api.map(a => `<li>${api(a)}</li>`).join('')}</ul>` : list(f[k])}</div>`).join('')}</div>
  </article>`;
}
document.getElementById('nav').innerHTML = nav;
document.getElementById('main').innerHTML = main;
document.querySelectorAll('[data-flow]').forEach(el => flowPlayer(el, DATA.features.find(f => f.id === el.dataset.flow).flow));
document.getElementById('overview').innerHTML = DATA.features.map(f => `<a href="#${esc(f.id)}" data-id="${esc(f.id)}"><b>${esc(f.title)}</b><span>${esc(f.area)}</span></a>`).join('');
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from docs/features/features.json. ${DATA.features.length} features.`;

// search hides non-matching features instead of rebuilding the page, so nothing flickers or jumps
const articles = [...document.querySelectorAll('article')];
function filter(text) {
  const f = text.trim().toLowerCase();
  let shown = 0;
  for (const a of articles) {
    const hit = !f || a.dataset.text.includes(f);
    a.classList.toggle('hidden', !hit);
    document.querySelectorAll(`[data-id="${a.id}"]`).forEach(x => x.classList.toggle('hidden', !hit));
    shown += hit;
  }
  document.querySelectorAll('nav .area').forEach(h => h.classList.toggle('hidden', !articles.some(a => a.dataset.area === h.dataset.area && !a.classList.contains('hidden'))));
  document.getElementById('none').classList.toggle('hidden', shown > 0);
  document.getElementById('count').textContent = f ? `${shown} of ${articles.length}` : `${articles.length} features`;
  dispatchEvent(new Event('resize'));   // flows that were hidden re-place their token
}
filter('');
document.getElementById('q').addEventListener('input', e => filter(e.target.value));
document.getElementById('main').addEventListener('click', e => {
  const t = e.target.closest('.tabs button');
  if (t) {
    const art = t.closest('article');
    art.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === t));
    art.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.panel === t.dataset.tab));
    return;
  }
  const s = e.target.closest('button[data-shot]');
  if (s) show(+s.dataset.shot);
});
// the menu follows the reading position
const links = [...document.querySelectorAll('nav a')];
const obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.id === x.target.id)) }),
  { rootMargin: '-76px 0px -70% 0px' });
articles.forEach(a => obs.observe(a));
// zoom with previous/next and keyboard
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img');
let cur = 0;
function show(i) {
  cur = (i + SHOTS.length) % SHOTS.length;
  zimg.src = SHOTS[cur].src; zimg.alt = SHOTS[cur].caption;
  document.getElementById('zcap').textContent = SHOTS[cur].caption;
  zoom.classList.add('on');
  document.getElementById('zprev').classList.toggle('hidden', SHOTS.length < 2);
  document.getElementById('znext').classList.toggle('hidden', SHOTS.length < 2);
}
const close = () => zoom.classList.remove('on');
document.getElementById('zclose').onclick = close;
document.getElementById('zprev').onclick = e => { e.stopPropagation(); show(cur - 1) };
document.getElementById('znext').onclick = e => { e.stopPropagation(); show(cur + 1) };
zoom.addEventListener('click', e => { if (e.target === zoom) close() });
document.addEventListener('keydown', e => {
  if (zoom.classList.contains('on')) { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); return }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus() }
});
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
</script>
</body>
</html>
