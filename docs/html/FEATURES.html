and permissions now"},{"id":"api","col":3,"row":2,"icon":"🔌","label":"Project API","sub":"/api/orgs/{org}/…"},{"id":"data","col":4,"row":2,"icon":"📦","label":"Project's data","sub":"Row-level security still applies"}],"scenarios":[{"name":"Create a token","steps":[{"at":"you","state":"new token","say":"You name the token, choose where it works, the most it may do, and when it expires."},{"at":"server","state":"fsp_…","say":"The server makes a random token and shows it to you once. Copy it now.","tech":"32 random bytes, Base64, prefixed `fsp_`."},{"at":"db","state":"fingerprint saved","say":"Only a fingerprint is saved, never the token itself. Even a database leak gives nobody a usable token.","tech":"SHA-256 of the token, plus scope, role ceiling and expiry."}]},{"name":"A script calls the API","steps":[{"at":"script","state":"Bearer fsp_…","say":"Your script sends the token with its request."},{"at":"db","state":"checking","say":"The filter fingerprints the token and finds its row: not revoked, not expired.","tech":"One indexed lookup by fingerprint."},{"at":"roles","state":"checking","say":"It checks that you still belong to that organization, and what your role allows today.","tech":"Permissions = token role AND your current role."},{"at":"jwt","state":"10-min token","say":"It makes a short sign-in token for this call only, with that organization and the narrowed role.","tech":"ES256-signed JWT, kept in memory."},{"at":"api","state":"signed in","say":"The call continues like any signed-in call: the organization in the path must match."},{"at":"data","state":"SUCCEEDED","say":"The database itself only shows this project's rows."}]},{"name":"Role lowered","steps":[{"at":"roles","state":"Admin → Analyst","say":"An owner lowers your role from Admin to Analyst."},{"at":"script","state":"Bearer fsp_…","say":"Your script calls again with a token made as Admin."},{"at":"roles","state":"narrowed","say":"The next call already uses the lower role: a token never does more than you may do now.","tech":"The narrowing is computed on every call, not when the token was made."},{"at":"api","state":"refused: 403","say":"Editing is refused; reading still works."}]},{"name":"Revoked token","steps":[{"at":"you","state":"revoke","say":"You revoke the token on the API Tokens tab."},{"at":"db","state":"revoked","say":"The row is marked revoked and this server forgets its cached answer at once.","tech":"`revoked_at` set; other servers follow within 30 seconds."},{"at":"script","state":"Bearer fsp_…","say":"The script tries again with the old token."},{"at":"server","state":"refused: 401","say":"Refused. The failure is logged by address, but never blocks other, valid tokens."}]},{"name":"Wrong place","steps":[{"at":"script","state":"org token","say":"A token made for one organization is sent to the platform API or to the password endpoint."},{"at":"server","state":"refused: 403","say":"Refused: organization tokens only reach /api/orgs/…, platform tokens only /api/platform/…, and no token can change passwords or tokens.","tech":"A web rule per token scope."}]}]},"steps":["Open your profile (your name, top right) and choose the API Tokens tab.","Give the token a name that says what uses it, e.g. \"Claude desktop (read-only)\".","Choose where it works: one of your organizations, or Platform administration (platform administrators only).","Choose the most it may do. Only your own role and lower ones are offered; Read-only is the default.","Choose when it expires, or No expiry.","Create it and copy the token straight away: it starts with fsp_ and is shown only once.","Use it as the header Authorization: Bearer fsp_… in the script or MCP client. Revoke it on the same tab when it is no longer needed."],"rules":["Only a SHA-256 fingerprint of the token is stored; the token itself is shown once.","Every call is checked again: a revoked or expired token, a removed membership or a lowered role takes effect at once.","A token never does more than the role chosen for it or the owner's current role (the permissions are the intersection).","Organization tokens reach only that organization's API (/api/orgs/{org}/…; partners also /api/partners/{partner}/…). Platform tokens reach only /api/platform/…. All can read GET /api/auth/me.","Tokens can't change passwords or create, list or revoke tokens.","Tokens are 256-bit random values, so they can't be guessed. Bad tokens are logged per client address for monitoring, but never block valid tokens (one old script retrying a revoked token must not lock out a whole office).","Creating and revoking tokens is recorded in the organization's (or platform's) audit trail.","There is no FAST Studio MCP server yet: MCP clients need a server that calls this API with the token."],"api":[{"text":"GET /api/auth/personal-tokens","link":"API.html#ep-get-api-auth-personal-tokens"},{"text":"POST /api/auth/personal-tokens {name, org (id, slug or \"platform\"), role, expiresInDays (null = no expiry)}","link":"API.html#ep-post-api-auth-personal-tokens"},{"text":"DELETE /api/auth/personal-tokens/{id}","link":"API.html#ep-delete-api-auth-personal-tokens-id"},{"text":"Any allowed API call with Authorization: Bearer fsp_…","link":null}],"tests":["backend: PersonalTokenTest","frontend: e2e/tokens.spec.ts"],"docs":["docs/PARTNER_ACCESS_AND_TOKENS.md","docs/SECURITY_AND_RIGHTS.md"],"screenshots":[{"id":"pat-tab","account":"owner","path":"/aurora","caption":"The API Tokens tab: name, where it works, the most it may do (your role or lower) and the expiry.","src":"../features/img/personal-access-tokens--pat-tab.png","exists":true,"width":920,"height":860},{"id":"pat-created","account":"owner","path":"/aurora","caption":"Right after creating: the token is shown once to copy (hidden in this picture). Here it was made with No expiry.","src":"../features/img/personal-access-tokens--pat-created.png","exists":true,"width":920,"height":860},{"id":"pat-platform","account":"platform","path":"/platform","caption":"A platform administrator can make platform-scope tokens for /api/platform/….","src":"../features/img/personal-access-tokens--pat-platform.png","exists":true,"width":920,"height":844},{"id":"pat-partner","account":"partner","path":"/","caption":"Partner members choose partner roles (Partner admin or Read-only partner viewer) for the partner API.","src":"../features/img/personal-access-tokens--pat-partner.png","exists":true,"width":920,"height":860}],"howItWorks":["Creating: 32 random bytes become the token (fsp_ + Base64). Only its SHA-256 fingerprint, the scope (organization, or none for platform), the role ceiling and the expiry are saved; the token itself is returned once.","Using: when a request carries Authorization: Bearer fsp_…, the security filter fingerprints it, finds the row, checks it is neither revoked nor expired and that the owner still belongs to that organization (or is still a platform administrator).","It then mints an ordinary 10-minute signed sign-in token (JWT) in memory, with only that organization and the narrowed role, and the request continues exactly like a normal signed-in call: organization-in-path check, database membership check and row-level security all apply.","Narrowing: permissions = what the chosen role allows AND what the owner's current role (including custom roles) allows; the role is the lower of the two. A demotion or removal therefore applies to the very next call.","Fencing: a web rule lets organization tokens reach only /api/orgs/… (partners also /api/partners/…), platform tokens only /api/platform/…, and every token GET /api/auth/me. Account endpoints (password, tokens) are never reachable with a token.","Revoking sets revoked_at; the server forgets its cached \"still valid\" answer at once."],"optimizations":["Lookup is one probe on a unique index (token_hash); the secret is never compared character by character, so there is no timing leak.","last_used_at is written at most once a minute per token, so a busy script doesn't turn every read into a database write.","The \"is this token still valid\" check on the minted sign-in token is cached for 30 seconds per server, like the existing sign-in version check.","Nothing is stored per call: no sessions, no saved access tokens. Servers stay stateless and interchangeable.","The profile tab loads one list request only when it is opened (the screen code itself is downloaded on demand).","Each person may keep at most 25 active tokens, which keeps the table and the list small."],"scale":["Per call the exchange costs about four small indexed queries and one ES256 signature (well under a millisecond of CPU). That is comfortable for scripts and AI assistants making tens to hundreds of calls a second per server.","Any number of servers can serve tokens: all state is in PostgreSQL and nothing is tied to one server.","Bad tokens cost one indexed lookup and are logged per client address in the shared database; a 256-bit token can't be guessed, so valid tokens are never blocked by an address's failures.","Known ceiling: a single token driving thousands of calls a second pays the exchange on every call. Upgrade path: cache the minted sign-in token per token fingerprint for its 10-minute life, keyed on the owner's token version and cleared on revoke.","Revocation is immediate on the server that handled it and within 30 seconds on other servers (the shared validity cache). Use \"sign out everywhere\" or a role change for an instant stop everywhere."]},{"id":"sign-in-protection","title":"Sign-in protection and security headers","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Limits on guessing passwords, reset emails and partner credentials, shared by every server; outbound address checks on ad servers and remote media including redirects; ad-tag URLs encrypted at rest; browser security headers. Nothing to click: it works in the background.","who":["Everyone, automatically"],"flow":{"title":"See how guessing and bad addresses are stopped","intro":"The boxes are the parts that protect sign-in and outbound calls; the pill is one attempt or request. Pick a situation.","nodes":[{"id":"visitor","col":1,"row":1,"icon":"👤","label":"Visitor","sub":"Signs in or asks for a reset"},{"id":"server","col":2,"row":1,"icon":"🖥️","label":"Any server","sub":"Every server shares the same limits"},{"id":"attempts","col":3,"row":1,"icon":"🗄️","label":"Attempt log (auth_attempt)","sub":"Counts per account and per address"},{"id":"password","col":4,"row":1,"icon":"🔑","label":"Password check","sub":"bcrypt: slow on purpose"},{"id":"waterfall","col":1,"row":2,"icon":"📣","label":"Ad waterfall","sub":"Needs an ad server address"},{"id":"guard","col":2,"row":2,"icon":"🧭","label":"Address guard","sub":"Public addresses only, every redirect"},{"id":"vault","col":3,"row":2,"icon":"🔐","label":"Encrypted ad tags","sub":"AES-GCM at rest"},{"id":"outside","col":4,"row":2,"icon":"🌐","label":"Ad server or video host","sub":"Outside the platform"}],"scenarios":[{"name":"Normal sign-in","steps":[{"at":"visitor","state":"sign in","say":"Someone signs in with an email and password."},{"at":"attempts","state":"under limit","say":"The server counts recent failures for that account and that address. Both are under the limit.","tech":"Two indexed counts in the shared database."},{"at":"password","state":"checking","say":"Only then is the password checked."},{"at":"attempts","state":"SUCCEEDED","say":"Correct: the account's failure count is cleared and the person is in."}]},{"name":"Password guessing","steps":[{"at":"visitor","state":"wrong password ×5","say":"Someone tries wrong passwords for one account."},{"at":"attempts","state":"5 in 5 min","say":"Each failure adds a row for that account (stored as a hash, not the email).","tech":"Bucket `login-email:<hash>`."},{"at":"server","state":"refused: 429","say":"The sixth try is refused with \"Too many attempts\" before the password is even checked. It waits a few minutes."}]},{"name":"Many servers","steps":[{"at":"visitor","state":"try on server 1","say":"An attacker spreads guesses across several servers behind the load balancer."},{"at":"attempts","state":"shared count","say":"All servers count in the same database table, so spreading out doesn't help.","tech":"Limits survive restarts too."},{"at":"server","state":"refused: 429","say":"From one address, 20 failures in 15 minutes and the address waits, whichever server it reaches."}]},{"name":"Address check","steps":[{"at":"waterfall","state":"ad tag","say":"An ad break needs ads from an external ad server."},{"at":"vault","state":"decrypting","say":"The ad tag address is stored encrypted; it is opened only now.","tech":"AES-256-GCM."},{"at":"guard","state":"checking","say":"The address is resolved: it must be a public internet host, not the platform's own network.","tech":"Private, loopback, link-local and carrier-grade NAT ranges are refused."},{"at":"outside","state":"SUCCEEDED","say":"Public, so the call is made. Each redirect hop is checked the same way."}]},{"name":"Sneaky redirect","steps":[{"at":"outside","state":"redirect →","say":"An ad server answers with a redirect pointing at an internal address."},{"at":"guard","state":"refused","say":"The guard checks the new hop before following it and refuses: no request reaches the internal network.","tech":"Redirects are followed one hop at a time by hand. Not yet covered: DNS rebinding between check and connect."}]}]},"steps":["After 5 wrong passwords for one account within 5 minutes, that account waits a few minutes (\"Too many attempts\").","After 20 failed sign-ins from one address within 15 minutes (many accounts), that address waits.","One address can request at most 10 password-reset emails an hour; each account gets at most 3 an hour.","Partner client-credential guessing is limited per address the same way (20 failures per 15 minutes). Bad personal tokens are logged per address but never block valid ones."],"rules":["Limits are stored in the database (auth_attempt), so they hold across restarts and several servers; emails are stored only as hashes.","Behind a proxy the visitor's address is taken from X-Forwarded-For only when the proxy is on a private network.","Ad-server and remote media addresses must be public http(s) hosts; every redirect hop is checked too.","Ad-tag URLs are encrypted (AES-GCM) in the database; older plaintext rows are encrypted at start-up.","Pages send Content-Security-Policy (only the app's own scripts, no framing), Referrer-Policy and Permissions-Policy."],"api":[{"text":"429 RATE_LIMITED on POST /api/auth/login, /api/auth/token, /api/auth/forgot and /oauth/token","link":null}],"tests":["backend: SecurityHardeningTest, PublicUrlTest"],"docs":["docs/SECURITY_AND_RIGHTS.md"],"screenshots":[],"howItWorks":["Each counted event (a wrong password, a reset-email request, a bad partner secret or personal token) adds one row to auth_attempt with a bucket such as login-email:<hash> or login-ip:<address>.","Before the check runs, the server counts that bucket's rows in its time window; at the limit it answers 429 \"Too many attempts\" without checking the password. A successful sign-in clears the account's bucket.","Outbound addresses (ad servers, VAST wrappers, creative and remote video files) are resolved and refused when they point at a private, loopback, link-local, carrier-grade-NAT or other non-public network. Redirects are followed one hop at a time and each hop is checked again; for remote video the final address is resolved before ffmpeg starts.","Ad-tag URLs are sealed with AES-256-GCM before saving and opened only when an ad waterfall is built; rows saved before encryption are sealed automatically at start-up.","Every page carries a Content-Security-Policy that allows only the app's own scripts and forbids framing, plus Referrer-Policy and Permissions-Policy."],"optimizations":["One composite index (bucket, created_at) makes every limit check a short index range scan.","Only failures are counted for sign-in, so normal users add no rows; emails are stored as SHA-256 hashes (no personal data in the table).","An hourly job deletes rows older than a day, so the table stays small however long the system runs.","Inside the security filter the token limit uses a non-throwing check, so an over-limit request is a clean 401 instead of an error page.","Redirect checking reuses one HTTP client per source (connection pooling) and stops after 5 hops.","AES-GCM decryption of an ad tag takes microseconds and happens only when the waterfall is read."],"scale":["A sign-in adds two indexed counts (and two inserts only when it fails). That is tiny next to the deliberate cost of checking a password hash (bcrypt, tens of milliseconds), so the limiter is never the bottleneck.","Limits are shared by every server through PostgreSQL and survive restarts, so scaling out doesn't loosen them.","Behind a load balancer the real visitor address is used (X-Forwarded-For from private-network proxies only), so one busy proxy doesn't lock everyone out and visitors can't fake their address.","Known ceiling: a very large credential-stuffing attack (millions of attempts an hour) would still reach the application and the database. Block such floods earlier with Cloudflare rate limiting or WAF rules in front; this database limiter is the second line.","DNS rebinding between the address check and the actual connection is not yet prevented; the upgrade is an HTTP client that connects only to the checked address."]},{"id":"tenant-isolation","title":"Tenant isolation in the database","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Each customer only ever sees its own data, and the database itself enforces it: even a bug in the application can't read or change another customer's rows. Work that must span customers (background jobs, platform administration) runs through a separate, tightly held database login. Nothing to click: it applies to every screen and API.","who":["Everyone, automatically"],"flow":{"title":"See how the database keeps customers apart","intro":"The boxes are the layers every request passes through; the pill is one request or one database row. Pick a situation.","nodes":[{"id":"user","col":1,"row":1,"icon":"👤","label":"Person at Aurora","sub":"Signed in to project Aurora"},{"id":"path","col":2,"row":1,"icon":"🧭","label":"Path and token check","sub":"/api/orgs/{org} must be yours"},{"id":"pool","col":3,"row":1,"icon":"🔌","label":"Request connection","sub":"Restricted login, stamped with Aurora"},{"id":"rls","col":4,"row":1,"icon":"🛡️","label":"Row-level security","sub":"Every row compared with the stamp"},{"id":"jobs","col":1,"row":2,"icon":"⚙️","label":"System work","sub":"Jobs, platform admin, alert scans"},{"id":"system","col":2,"row":2,"icon":"🔑","label":"System connection","sub":"Separate login the rules trust"},{"id":"aurora","col":3,"row":2,"icon":"📦","label":"Aurora's rows","sub":"Visible to Aurora"},{"id":"other","col":4,"row":2,"icon":"🚫","label":"Northwind's rows","sub":"Invisible to Aurora"}],"scenarios":[{"name":"Normal request","steps":[{"at":"user","state":"GET /api/orgs/aurora/…","say":"Someone at Aurora opens the Library."},{"at":"path","state":"checked","say":"The organization in the path must be in their sign-in token, and they must still be a member."},{"at":"pool","state":"org = Aurora","say":"A database connection is borrowed and stamped with Aurora.","tech":"`set_config('app.org_id', …)` on every checkout."},{"at":"rls","state":"filtering","say":"The database compares every row with the stamp, on top of the app's own organization filter."},{"at":"aurora","state":"SUCCEEDED","say":"Only Aurora's videos come back."}]},{"name":"A bug forgets the filter","steps":[{"at":"pool","state":"select * from asset","say":"Imagine a coding mistake: a query without any organization filter."},{"at":"rls","state":"filtering","say":"Row-level security still applies, because the database does it, not the code."},{"at":"other","state":"hidden","down":["other"],"say":"Northwind's rows are simply not there for this connection."},{"at":"aurora","state":"SUCCEEDED","say":"The mistake returns only Aurora's rows. A CI check also catches the missing filter before it ships.","tech":"`tools/check-tenant-filters.mjs`."}]},{"name":"Someone tries another project","steps":[{"at":"user","state":"GET /api/orgs/northwind/…","say":"An Aurora user types Northwind's project into the address."},{"at":"path","state":"refused: 404","say":"Refused before any data is read: they are not a member. The answer is \"not found\", so it doesn't even confirm the project exists."}]},{"name":"Writing into another project","steps":[{"at":"pool","state":"insert org = Northwind","say":"A request stamped with Aurora tries to write a row that belongs to Northwind."},{"at":"rls","state":"refused","say":"PostgreSQL rejects the row: new rows must match the stamp too.","tech":"Policy `with check (fs_tenant_ok(org_id))`."}]},{"name":"Background work","steps":[{"at":"jobs","state":"all tenants","say":"A background job needs to look across projects, such as picking the next video to convert."},{"at":"system","state":"system login","say":"It uses its own connection pool with a separate login that the rules trust. A request connection can't switch to it.","tech":"Trust is based on `session_user`, which `set role` cannot change."},{"at":"aurora","state":"org = Aurora","say":"Once it knows which project a job belongs to, it does the actual work as that project only."}]}]},"steps":["Every project API path names the organization (/api/orgs/{organization}/…); platform tenant routes name the tenant (/api/platform/tenants/{tenant}/…).","The sign-in token carries the organization (org) and its tenant (tid); the organization in the path must be one the token lists and the person belongs to, otherwise the answer is 404.","Every database query of a project names that organization, and the database adds its own check on top."],"howItWorks":["Requests use a database login (faststudio_app_login) that may only see rows of the organization stamped on its connection. It is not the table owner and cannot switch to any other role.","Each borrowed connection is stamped with the current organization (app.org_id); PostgreSQL row-level security policies compare every row's organization with it. An unfiltered \"select * from asset\" returns only that project's videos, and inserting a row for another organization fails.","Cross-tenant system work (platform administration, media jobs, alert scans, edge publishing, partner client sign-in) gets its connection from a separate pool that logs in as faststudio_system_login. The policies trust that login, identified by session_user, which a request connection cannot become.","Both logins are created and kept up to date after every database migration; their passwords are derived from the server's secrets key, so every server sharing the key uses the same ones and nothing extra is configured.","Every table that carries an organization has a policy; organization and membership (they establish the tenant), personal tokens (they belong to a person) and the platform email outbox are deliberately outside, and a test fails if any other table is missing one.","In the code, every SQL statement on a tenant table also names the organization explicitly (or is marked as deliberate cross-tenant system work); a CI check enforces this."],"optimizations":["The organization is stamped once per connection checkout with one tiny statement; no per-query overhead in the application.","Policies are simple equality checks on org_id, which the tenant-first indexes serve directly, so row-level security adds no extra table reads.","System work and requests use separate connection pools (10 each per server; the system pool also serves viewer session lookups and platform administration), so a burst of background work can't take every request connection."],"scale":["All projects share one database, so adding a customer costs one row, not a database. Isolation does not weaken with more customers: every query is filtered by organization in the database itself.","Indexes on large tables lead with org_id, so one project's queries read only its own slice however large other projects grow.","Known ceiling: one PostgreSQL server for all tenants. Upgrade path, in order: connection pooling (PgBouncer), read replicas for reports, then sharding by tenant (e.g. Citus) without changing the application. A dedicated database for one tenant is possible when a contract requires it.","Not measured: behaviour under sustained multi-tenant load."],"rules":["A request connection that tries \"set role\" to the system role is refused; \"reset role\" leaves it as the same restricted login.","The old app.bypass session switch no longer exists; setting it changes nothing.","The configured database user only migrates and must be allowed to create roles (CREATEROLE)."],"api":[],"tests":["RowLevelSecurityTest (7, production logins)","CrossTenantMatrixTest","tools/check-tenant-filters.mjs (CI)"],"docs":["docs/MULTITENANCY.md","migration V18__system_login_and_rls_coverage.sql"],"screenshots":[]},{"id":"durable-media-jobs","title":"Durable media processing","area":"Media library","status":"Built","completed":"2026-11-01","summary":"Converting a video into 5-second segments is a job stored in the database, so it survives restarts and crashes, runs exactly once even with several servers, retries by itself when the problem is temporary, can be cancelled, and one busy project can't hold up the others. Nothing new to click yet: the Library shows the same statuses; the job history is available through the API.","who":["Everyone who adds videos (automatic)","Owners, admins and operators (cancel; needs asset editing)"],"flow":{"title":"Watch a job move through the system","intro":"Each box is one part of the system; the moving pill is one video's job and its current state. Pick a situation to see how it behaves, step by step.","nodes":[{"id":"you","col":1,"row":1,"icon":"👤","label":"You","sub":"Upload, sample, retry or library sync"},{"id":"db","col":2,"row":1,"icon":"🗄️","label":"Job table (media_job)","sub":"The one place that decides who does what"},{"id":"a","col":3,"row":1,"icon":"🖥️","label":"Worker A","sub":"A thread on server 1"},{"id":"ffmpeg","col":4,"row":1,"icon":"🎞️","label":"ffmpeg","sub":"5-second segments in 3 qualities"},{"id":"reaper","col":1,"row":2,"icon":"⏱️","label":"Reaper","sub":"Checks expired leases every minute"},{"id":"asset","col":2,"row":2,"icon":"📺","label":"Video on air","sub":"The media viewers get"},{"id":"b","col":3,"row":2,"icon":"🖥️","label":"Worker B","sub":"A thread on server 2"},{"id":"folder","col":4,"row":2,"icon":"📁","label":"New folder","sub":"Fresh output; airing media untouched"}],"scenarios":[{"name":"Normal run","steps":[{"at":"you","state":"QUEUED","say":"You upload a video. In the same save, a job is written for it.","tech":"`insert into media_job` in the same database transaction as the asset change: no change without a job, no job without its change."},{"at":"db","state":"QUEUED","say":"The job waits in the table. Clicking twice or a repeated webhook adds nothing.","tech":"A partial unique index allows one active job per video; a second insert is `on conflict do nothing`."},{"at":"a","state":"RUNNING","say":"A free worker on any server takes it. Only one worker can get it.","tech":"`update … where id = (select … for update skip locked limit 1)`. The claim gets fence 1 and a 2-minute lease."},{"at":"ffmpeg","state":"RUNNING","say":"ffmpeg converts the video. Every 30 seconds the worker tells the table it is still alive.","tech":"Heartbeat: `lease_until = now() + 2 min where id = … and fence = 1`."},{"at":"folder","state":"RUNNING","say":"The result goes into a brand-new folder, so what is on air is never touched halfway.","tech":"Folder name `{project}/{video}.{time}`: every run is a new revision."},{"at":"asset","state":"SUCCEEDED","say":"Published in one step: the video switches to the new media and the job is marked done.","tech":"One SQL statement updates job and video together, only while the fence is still 1."}]},{"name":"Server crashes","steps":[{"at":"db","state":"QUEUED","say":"A video is waiting in the queue."},{"at":"a","state":"RUNNING","say":"Worker A on server 1 takes it.","tech":"Fence 1, lease until now + 2 minutes."},{"at":"a","state":"RUNNING","down":["a"],"say":"Server 1 dies in the middle of the job. Its heartbeats stop.","tech":"Nobody extends `lease_until` any more."},{"at":"reaper","state":"QUEUED","down":["a"],"say":"Once the lease has run out, the reaper puts the job back in the queue.","tech":"`state = 'RUNNING' and lease_until < now()` becomes QUEUED, to try again after 1 minute."},{"at":"b","state":"RUNNING","down":["a"],"say":"Worker B on server 2 takes it over.","tech":"Claiming again raises the fence to 2."},{"at":"asset","state":"SUCCEEDED","down":["a"],"say":"Published. Nothing was lost, and the job never ran twice at the same time."}]},{"name":"Frozen worker wakes up","steps":[{"at":"a","state":"RUNNING · fence 1","say":"Worker A is converting the video."},{"at":"a","state":"RUNNING · fence 1","down":["a"],"say":"Worker A freezes for a long time (for example, a stuck machine). Its lease runs out."},{"at":"b","state":"RUNNING · fence 2","down":["a"],"say":"The reaper re-queues the job and Worker B takes it, with fence 2."},{"at":"asset","state":"SUCCEEDED · fence 2","say":"Worker B publishes its result. The video now plays B's media."},{"at":"a","state":"fence 1 refused","say":"Worker A wakes up and tries to publish its older result.","tech":"`… where fence = 1` matches 0 rows: the table holds fence 2."},{"at":"folder","state":"fence 1 refused","say":"Worker A deletes its own output and stops. The newer media stays on air."}]},{"name":"You cancel","steps":[{"at":"ffmpeg","state":"RUNNING","say":"A video is being converted."},{"at":"you","state":"CANCEL_REQUESTED","say":"You cancel it.","tech":"`POST /api/orgs/{org}/assets/{id}/jobs/cancel`. A job still waiting in the queue would be cancelled right away."},{"at":"a","state":"CANCEL_REQUESTED","say":"At its next heartbeat (within 30 seconds) the worker sees the cancel.","tech":"The heartbeat returns the job's state."},{"at":"ffmpeg","state":"CANCEL_REQUESTED","down":["ffmpeg"],"say":"The worker kills ffmpeg."},{"at":"folder","state":"CANCEL_REQUESTED","down":["ffmpeg"],"say":"The half-made output is deleted."},{"at":"asset","state":"CANCELLED","say":"The old media keeps airing. A video that never had media goes back to Draft."}]},{"name":"Temporary problem","steps":[{"at":"a","state":"RUNNING · try 1","say":"A worker starts a video from the connected library."},{"at":"a","state":"RUNNING · try 1","say":"The library isn't ready to hand over the original file yet: a temporary problem.","tech":"The content source throws `Retryable`; unexpected errors count as temporary too."},{"at":"db","state":"QUEUED · wait 1 min","say":"The job goes back to the queue and waits. The video still shows Processing.","tech":"Waits of 1, 5, 25 and 125 minutes between tries."},{"at":"b","state":"RUNNING · try 2","say":"Next time, any free worker takes it again."},{"at":"asset","state":"SUCCEEDED","say":"This time it works and is published. After 5 failed tries the video shows Failed with the reason. A broken file fails at once, without retrying."}]},{"name":"Fair sharing","steps":[{"at":"db","state":"6 from A, 1 from B","say":"Project A queues 6 videos, then project B queues 1."},{"at":"a","state":"A: 1st video","say":"Project A's first video starts."},{"at":"b","state":"A: 2nd video","say":"Project A's second video starts. A now runs its maximum of 2 at once."},{"at":"db","state":"B goes next","say":"The next free worker skips project A's waiting videos and takes B's.","tech":"The claim skips projects already running `faststudio.media.jobs-per-project` (2) programme jobs. Ads have their own lane."},{"at":"asset","state":"SUCCEEDED","say":"One project's big import can't hold up everyone else."}]}]},"steps":["Create a sample, upload a file, retry a failed video or sync the library: the video shows PROCESSING and a job is queued with that change.","To see what is happening, call GET /api/orgs/{organization}/assets/{video}/jobs: state, attempt, last error and, while waiting for a retry, when it runs next.","To stop it, call POST /api/orgs/{organization}/assets/{video}/jobs/cancel. A video that was already ready keeps its old media on air; a new one goes back to DRAFT."],"howItWorks":["The job row is written in the same database transaction as the change that needs it, so there is never a change without a job or a job without its change. A second request for the same video does nothing while one is active.","Worker threads on every server ask the database for the next due job; FOR UPDATE SKIP LOCKED hands each job to exactly one of them.","A running job holds a 2-minute lease that its worker renews every 30 seconds. If the server dies, the lease runs out and the job goes back to the queue within about a minute.","Every claim gets a new fence number. The finished video is published (asset and job in one statement) only if the fence still matches, so a worker that lost its job can never replace newer media; the currently airing media is untouched until then.","Temporary failures (library not ready, address unreachable, unexpected errors) retry after 1, 5, 25 and 125 minutes, then fail; a bad file fails at once.","Cancelling a running job is seen at the next heartbeat; the worker kills its ffmpeg and throws its half-made output away."],"optimizations":["Claims, heartbeats and results are single short statements; no database lock is held while a video converts.","Ad creatives have their own lane, so they never wait behind a film."],"scale":["A project runs at most 2 programme jobs at once across all servers, so one project's 500-video sync can't starve the others; the rest wait their turn.","Add servers to add workers (2 programme + 1 ad thread each, configurable); the table coordinates them.","Known limits: an interrupted conversion restarts from the beginning; an idle worker picks a new job up within about 2 seconds; two servers claiming at the same instant can put a project one job over its share.","Not measured: behaviour with many servers or thousands of queued jobs."],"rules":["Jobs belong to a project and are protected by row-level security like videos; another project's user gets 404.","Cancel needs the asset editing permission; with nothing queued or running the answer is 409 NOT_PROCESSING.","Finished jobs are kept for 30 days."],"api":[{"text":"GET /api/orgs/{org}/assets/{id}/jobs","link":"API.html#ep-get-api-orgs-org-assets-id-jobs"},{"text":"POST /api/orgs/{org}/assets/{id}/jobs/cancel","link":"API.html#ep-post-api-orgs-org-assets-id-jobs-cancel"}],"tests":["MediaJobTest (10: duplicate enqueue, two workers, crash, stale worker, cancel queued and running, retries, permanent failure, fairness, isolation)","MediaStopTest (a real ffmpeg is killed)","MediaJobMigrationTest (converting videos survive the upgrade)"],"docs":["docs/MEDIA_JOBS_DESIGN.md","migration V22__media_jobs.sql"],"screenshots":[]},{"id":"project-limits","title":"Per-project limits","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Every project has a fair share: a cap on API requests per minute, on stored video hours and on videos converting at once, so one busy project can't slow everyone else down. Platform administrators set the limits per plan, tenant or project.","who":["Platform administrators set the limits","Every project is held to them"],"flow":{"title":"See how a busy project is kept to its share","intro":"The boxes are the checks a request or a conversion passes; the pill is one request. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Sets limits per plan, tenant or project"},{"id":"config","col":2,"row":1,"icon":"⚙️","label":"Settings","sub":"Global → tenant → project"},{"id":"user","col":3,"row":1,"icon":"👤","label":"Project user or script","sub":"Calls the API"},{"id":"counter","col":4,"row":1,"icon":"⏱️","label":"Request counter","sub":"Per project, per minute"},{"id":"storage","col":1,"row":2,"icon":"💾","label":"Stored hours check","sub":"Before uploads and syncs"},{"id":"converting","col":2,"row":2,"icon":"🎞️","label":"Converting check","sub":"Before a conversion starts"},{"id":"api","col":3,"row":2,"icon":"🔌","label":"Project API","sub":"Does the work"},{"id":"other","col":4,"row":2,"icon":"👥","label":"Other projects","sub":"Unaffected"}],"scenarios":[{"name":"Setting a limit","steps":[{"at":"admin","state":"1000 / min","say":"A platform admin sets \"API requests per minute\" for one tenant, or overrides it for one project."},{"at":"config","state":"saved","say":"The most specific value wins: project, then tenant, then the global default. 0 means unlimited.","tech":"Every server applies a change within a minute (cache lifetime)."}]},{"name":"Too many requests","steps":[{"at":"user","state":"request 6001","say":"A script in one project calls the API very fast."},{"at":"counter","state":"over limit","say":"Requests are counted per project in one-minute windows."},{"at":"user","state":"refused: 429","say":"Over the limit, the answer is \"made more than N requests in a minute\". It works again in the next minute."},{"at":"other","state":"SUCCEEDED","say":"Other projects keep their own allowance and notice nothing.","tech":"Known ceiling: counted per server, so N servers allow up to N times the limit."}]},{"name":"Storage full","steps":[{"at":"user","state":"upload","say":"Someone uploads a video."},{"at":"storage","state":"over 500 h","say":"The project's stored hours (archived videos excluded) are compared with its limit first."},{"at":"user","state":"refused: 409","say" ","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"When a customer asks for its data or leaves, a platform administrator can export everything the tenant owns as one file, and then delete the tenant permanently, without touching any other customer.","who":["Platform administrators"],"flow":{"title":"See what export and deletion touch","intro":"The boxes are the steps of an export or deletion; the pill is the request. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Calls the API (no screen yet)"},{"id":"catalog","col":2,"row":1,"icon":"📚","label":"Table catalog","sub":"Finds every table with an organization"},{"id":"rows","col":3,"row":1,"icon":"🗄️","label":"Tenant's rows","sub":"Projects, videos, schedules, events…"},{"id":"file","col":4,"row":1,"icon":"📄","label":"Export file","sub":"JSON, secrets left out"},{"id":"suspend","col":1,"row":2,"icon":"⏸️","label":"Suspended tenant","sub":"Required before deletion"},{"id":"edge","col":2,"row":2,"icon":"📡","label":"Edge","sub":"Channels taken off air"},{"id":"people","col":3,"row":2,"icon":"👤","label":"People","sub":"Anonymized if only in this tenant"},{"id":"others","col":4,"row":2,"icon":"🏢","label":"Other tenants","sub":"Untouched"}],"scenarios":[{"name":"Export","steps":[{"at":"admin","state":"GET …/export","say":"A platform admin asks for the tenant's data."},{"at":"catalog","state":"finding tables","say":"The database catalog lists every table that carries an organization or tenant, so new tables are included automatically."},{"at":"rows","state":"reading","say":"All rows of the tenant's projects are read."},{"at":"file","state":"SUCCEEDED","say":"One JSON file. Credentials, hashes, webhook secrets, ad-tag URLs and queued email text are left out. Video files are not included."}]},{"name":"Delete","steps":[{"at":"suspend","state":"suspended","say":"The tenant is suspended first; then the admin types its exact name to confirm."},{"at":"e // an animated flow (optional per feature): parts as boxes, scenarios as steps a job token walks through
function flowHtml(f) {
  const fl = f.flow, cols = Math.max(...fl.nodes.map(n => n.col));
  return `<section class="flow" data-flow="${esc(f.id)}"><h3>${esc(fl.title)}</h3><p class="fintro">${md(fl.intro)}</p>
    <div class="scen" role="tablist">${fl.scenarios.map((s, i) => `<button data-scen="${i}" class="${i ? '' : 'on'}">${esc(s.name)}</button>`).join('')}</div>
    <div class="stage" style="--cols:${cols}">${fl.nodes.map(n => `<div class="node" data-node="${esc(n.id)}" style="grid-column:${n.col};grid-row:${n.row}"><i class="ic" aria-hidden="true">${esc(n.icon)}</i><b>${esc(n.label)}</b><span>${md(n.sub)}</span></div>`).join('')}
      <div class="token" aria-hidden="true"></div></div>
    <div class="say" aria-live="polite"><p></p><div class="tech"></div></div>
    <div class="fctl"><button data-act="prev" aria-label="Previous step">‹ Back</button><button data-act="play">⏸ Pause</button><button data-act="next" aria-label="Next step">Next ›</button><span class="dots"></span></div>
  </section>`;
}
function flowPlayer(el, fl) {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tok = el.querySelector('.token'), btn = el.querySelector('[data-act="play"]');
  let scen = 0, step = 0, timer = null, started = false;
  const steps = () => fl.scenarios[scen].steps;
  function draw() {
    const s = steps()[step], node = el.querySelector(`[data-node="${s.at}"]`);
    el.querySelectorAll('.node').forEach(n => { n.classList.toggle('hot', n === node); n.classList.toggle('down', (s.down || []).includes(n.dataset.node)) });
    tok.style.left = node.offsetLeft + node.offsetWidth / 2 + 'px';
    tok.style.top = node.offsetTop + 'px';   // sits on the box's top edge, so the box stays readable
    tok.textContent = '🎬 ' + s.state;
    tok.className = 'token' + (/SUCCEEDED|CANCELLED/.test(s.state) ? ' done' : /FAILED|refused/i.test(s.state) ? ' bad' : '');
    el.querySelector('.say p').innerHTML = md(s.say);
    const tech = el.querySelector('.tech'); tech.innerHTML = md(s.tech || ''); tech.classList.toggle('hidden', !s.tech);
    el.querySelector('.dots').innerHTML = steps().map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
  }
  function play(on) {
    clearInterval(timer); timer = null;
    if (on) timer = setInterval(() => { if (step < steps().length - 1) { step++; draw() } else play(false) }, 3200);
    btn.textContent = timer ? '⏸ Pause' : step === steps().length - 1 ? '↻ Replay' : '▶ Play';
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.scen) { scen = +b.dataset.scen; step = 0; el.querySelectorAll('.scen button').forEach(x => x.classList.toggle('on', x === b)); draw(); play(!reduced); return }
    if (b.dataset.act === 'prev') { step = Math.max(0, step - 1); draw(); play(false) }
    if (b.dataset.act === 'next') { step = Math.min(steps().length - 1, step + 1); draw(); play(false) }
    if (b.dataset.act === 'play') { if (timer) play(false); else { if (step === steps().length - 1) { step = 0; draw() } play(true) } }
  });
  addEventListener('resize', draw);
  draw(); play(false);
  // starts by itself the first time it comes into view (not with reduced motion)
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting && !started) { started = true; o.disconnect(); if (!reduced) play(true) } }, { threshold: .4 }).observe(el);
}

    }).join('')}</div>` : ''}

}

const articles = [...document.querySelectorAll('article')];
function filter(text) {
  const f = text.trim().toLowerCase();
  let shown = 0;
  for (const a of articles) {
    const hit = !f || a.dataset.text.includes(f);
    a.classList.toggle('hidden', !hit);
    document.querySelectorAll(`[data-id="${a.id}"]`).forEach(x => x.classList.toggle('hidden', !hit));
    shown += hit;
  }
  document.querySelectorAll('nav .area').forEach(h => h.classList.toggle('hidden', !articles.some(a => a.dataset.area === h.dataset.area && !a.classList.contains('hidden'))));
  document.getElementById('none').classList.toggle('hidden', shown > 0);
  document.getElementById('count').textContent = f ? `${shown} of ${articles.length}` : `${articles.length} features`;
  dispatchEvent(new Event('resize'));   // flows that were hidden re-place their token
}
filter('');

const obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.id === x.target.id)) }),

const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img');

function show(i) {

const close = () => zoom.classList.remove('on');
