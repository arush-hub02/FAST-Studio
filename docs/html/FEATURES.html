and permissions now"},{"id":"api","col":3,"row":2,"icon":"🔌","label":"Project API","sub":"/api/orgs/{org}/…"},{"id":"data","col":4,"row":2,"icon":"📦","label":"Project's data","sub":"Row-level security still applies"}],"scenarios":[{"name":"Create a token","steps":[{"at":"you","state":"new token","say":"You name the token, choose where it works, the most it may do, and when it expires."},{"at":"server","state":"fsp_…","say":"The server makes a random token and shows it to you once. Copy it now.","tech":"32 random bytes, Base64, prefixed `fsp_`."},{"at":"db","state":"fingerprint saved","say":"Only a fingerprint is saved, never the token itself. Even a database leak gives nobody a usable token.","tech":"SHA-256 of the token, plus scope, role ceiling and expiry."}]},{"name":"A script calls the API","steps":[{"at":"script","state":"Bearer fsp_…","say":"Your script sends the token with its request."},{"at":"db","state":"checking","say":"The filter fingerprints the token and finds its row: not revoked, not expired.","tech":"One indexed lookup by fingerprint."},{"at":"roles","state":"checking","say":"It checks that you still belong to that organization, and what your role allows today.","tech":"Permissions = token role AND your current role."},{"at":"jwt","state":"10-min token","say":"It makes a short sign-in token for this call only, with that organization and the narrowed role.","tech":"ES256-signed JWT, kept in memory."},{"at":"api","state":"signed in","say":"The call continues like any signed-in call: the organization in the path must match."},{"at":"data","state":"SUCCEEDED","say":"The database itself only shows this project's rows."}]},{"name":"Role lowered","steps":[{"at":"roles","state":"Admin → Analyst","say":"An owner lowers your role from Admin to Analyst."},{"at":"script","state":"Bearer fsp_…","say":"Your script calls again with a token made as Admin."},{"at":"roles","state":"narrowed","say":"The next call already uses the lower role: a token never does more than you may do now.","tech":"The narrowing is computed on every call, not when the token was made."},{"at":"api","state":"refused: 403","say":"Editing is refused; reading still works."}]},{"name":"Revoked token","steps":[{"at":"you","state":"revoke","say":"You revoke the token on the API Tokens tab."},{"at":"db","state":"revoked","say":"The row is marked revoked and this server forgets its cached answer at once.","tech":"`revoked_at` set; other servers follow within 30 seconds."},{"at":"script","state":"Bearer fsp_…","say":"The script tries again with the old token."},{"at":"server","state":"refused: 401","say":"Refused. The failure is logged by address, but never blocks other, valid tokens."}]},{"name":"Wrong place","steps":[{"at":"script","state":"org token","say":"A token made for one organization is sent to the platform API or to the password endpoint."},{"at":"server","state":"refused: 403","say":"Refused: organization tokens only reach /api/orgs/…, platform tokens only /api/platform/…, and no token can change passwords or tokens.","tech":"A web rule per token scope."}]}]},"steps":["Open your profile (your name, top right) and choose the API Tokens tab.","Give the token a name that says what uses it, e.g. \"Claude desktop (read-only)\".","Choose where it works: one of your organizations, or Platform administration (platform administrators only).","Choose the most it may do. Only your own role and lower ones are offered; Read-only is the default.","Choose when it expires, or No expiry.","Create it and copy the token straight away: it starts with fsp_ and is shown only once.","Use it as the header Authorization: Bearer fsp_… in the script or MCP client. Revoke it on the same tab when it is no longer needed."],"rules":["Only a SHA-256 fingerprint of the token is stored; the token itself is shown once.","Every call is checked again: a revoked or expired token, a removed membership or a lowered role takes effect at once.","A token never does more than the role chosen for it or the owner's current role (the permissions are the intersection).","Organization tokens reach only that organization's API (/api/orgs/{org}/…; partners also /api/partners/{partner}/…). Platform tokens reach only /api/platform/…. All can read GET /api/auth/me.","Tokens can't change passwords or create, list or revoke tokens.","Tokens are 256-bit random values, so they can't be guessed. Bad tokens are logged per client address for monitoring, but never block valid tokens (one old script retrying a revoked token must not lock out a whole office).","Creating and revoking tokens is recorded in the organization's (or platform's) audit trail.","There is no FAST Studio MCP server yet: MCP clients need a server that calls this API with the token."],"api":[{"text":"GET /api/auth/personal-tokens","link":"API.html#ep-get-api-auth-personal-tokens"},{"text":"POST /api/auth/personal-tokens {name, org (id, slug or \"platform\"), role, expiresInDays (null = no expiry)}","link":"API.html#ep-post-api-auth-personal-tokens"},{"text":"DELETE /api/auth/personal-tokens/{id}","link":"API.html#ep-delete-api-auth-personal-tokens-id"},{"text":"Any allowed API call with Authorization: Bearer fsp_…","link":null}],"tests":["backend: PersonalTokenTest","frontend: e2e/tokens.spec.ts"],"docs":["docs/PARTNER_ACCESS_AND_TOKENS.md","docs/SECURITY_AND_RIGHTS.md"],"screenshots":[{"id":"pat-tab","account":"owner","path":"/aurora","caption":"The API Tokens tab: name, where it works, the most it may do (your role or lower) and the expiry.","src":"../features/img/personal-access-tokens--pat-tab.png","exists":true,"width":920,"height":860},{"id":"pat-created","account":"owner","path":"/aurora","caption":"Right after creating: the token is shown once to copy (hidden in this picture). Here it was made with No expiry.","src":"../features/img/personal-access-tokens--pat-created.png","exists":true,"width":920,"height":860},{"id":"pat-platform","account":"platform","path":"/platform","caption":"A platform administrator can make platform-scope tokens for /api/platform/….","src":"../features/img/personal-access-tokens--pat-platform.png","exists":true,"width":920,"height":844},{"id":"pat-partner","account":"partner","path":"/","caption":"Partner members choose partner roles (Partner admin or Read-only partner viewer) for the partner API.","src":"../features/img/personal-access-tokens--pat-partner.png","exists":true,"width":920,"height":860}],"howItWorks":["Creating: 32 random bytes become the token (fsp_ + Base64). Only its SHA-256 fingerprint, the scope (organization, or none for platform), the role ceiling and the expiry are saved; the token itself is returned once.","Using: when a request carries Authorization: Bearer fsp_…, the security filter fingerprints it, finds the row, checks it is neither revoked nor expired and that the owner still belongs to that organization (or is still a platform administrator).","It then mints an ordinary 10-minute signed sign-in token (JWT) in memory, with only that organization and the narrowed role, and the request continues exactly like a normal signed-in call: organization-in-path check, database membership check and row-level security all apply.","Narrowing: permissions = what the chosen role allows AND what the owner's current role (including custom roles) allows; the role is the lower of the two. A demotion or removal therefore applies to the very next call.","Fencing: a web rule lets organization tokens reach only /api/orgs/… (partners also /api/partners/…), platform tokens only /api/platform/…, and every token GET /api/auth/me. Account endpoints (password, tokens) are never reachable with a token.","Revoking sets revoked_at; the server forgets its cached \"still valid\" answer at once."],"optimizations":["Lookup is one probe on a unique index (token_hash); the secret is never compared character by character, so there is no timing leak.","last_used_at is written at most once a minute per token, so a busy script doesn't turn every read into a database write.","The \"is this token still valid\" check on the minted sign-in token is cached for 30 seconds per server, like the existing sign-in version check.","Nothing is stored per call: no sessions, no saved access tokens. Servers stay stateless and interchangeable.","The profile tab loads one list request only when it is opened (the screen code itself is downloaded on demand).","Each person may keep at most 25 active tokens, which keeps the table and the list small."],"scale":["Per call the exchange costs about four small indexed queries and one ES256 signature (well under a millisecond of CPU). That is comfortable for scripts and AI assistants making tens to hundreds of calls a second per server.","Any number of servers can serve tokens: all state is in PostgreSQL and nothing is tied to one server.","Bad tokens cost one indexed lookup and are logged per client address in the shared database; a 256-bit token can't be guessed, so valid tokens are never blocked by an address's failures.","Known ceiling: a single token driving thousands of calls a second pays the exchange on every call. Upgrade path: cache the minted sign-in token per token fingerprint for its 10-minute life, keyed on the owner's token version and cleared on revoke.","Revocation is immediate on the server that handled it and within 30 seconds on other servers (the shared validity cache). Use \"sign out everywhere\" or a role change for an instant stop everywhere."]},{"id":"sign-in-protection","title":"Sign-in protection and security headers","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Limits on guessing passwords, reset emails and partner credentials, shared by every server; outbound address checks on ad servers and remote media including redirects; ad-tag URLs encrypted at rest; browser security headers. Nothing to click: it works in the background.","who":["Everyone, automatically"],"flow":{"title":"See how guessing and bad addresses are stopped","intro":"The boxes are the parts that protect sign-in and outbound calls; the pill is one attempt or request. Pick a situation.","nodes":[{"id":"visitor","col":1,"row":1,"icon":"👤","label":"Visitor","sub":"Signs in or asks for a reset"},{"id":"server","col":2,"row":1,"icon":"🖥️","label":"Any server","sub":"Every server shares the same limits"},{"id":"attempts","col":3,"row":1,"icon":"🗄️","label":"Attempt log (auth_attempt)","sub":"Counts per account and per address"},{"id":"password","col":4,"row":1,"icon":"🔑","label":"Password check","sub":"bcrypt: slow on purpose"},{"id":"waterfall","col":1,"row":2,"icon":"📣","label":"Ad waterfall","sub":"Needs an ad server address"},{"id":"guard","col":2,"row":2,"icon":"🧭","label":"Address guard","sub":"Public addresses only, every redirect"},{"id":"vault","col":3,"row":2,"icon":"🔐","label":"Encrypted ad tags","sub":"AES-GCM at rest"},{"id":"outside","col":4,"row":2,"icon":"🌐","label":"Ad server or video host","sub":"Outside the platform"}],"scenarios":[{"name":"Normal sign-in","steps":[{"at":"visitor","state":"sign in","say":"Someone signs in with an email and password."},{"at":"attempts","state":"under limit","say":"The server counts recent failures for that account and that address. Both are under the limit.","tech":"Two indexed counts in the shared database."},{"at":"password","state":"checking","say":"Only then is the password checked."},{"at":"attempts","state":"SUCCEEDED","say":"Correct: the account's failure count is cleared and the person is in."}]},{"name":"Password guessing","steps":[{"at":"visitor","state":"wrong password ×5","say":"Someone tries wrong passwords for one account."},{"at":"attempts","state":"5 in 5 min","say":"Each failure adds a row for that account (stored as a hash, not the email).","tech":"Bucket `login-email:<hash>`."},{"at":"server","state":"refused: 429","say":"The sixth try is refused with \"Too many attempts\" before the password is even checked. It waits a few minutes."}]},{"name":"Many servers","steps":[{"at":"visitor","state":"try on server 1","say":"An attacker spreads guesses across several servers behind the load balancer."},{"at":"attempts","state":"shared count","say":"All servers count in the same database table, so spreading out doesn't help.","tech":"Limits survive restarts too."},{"at":"server","state":"refused: 429","say":"From one address, 20 failures in 15 minutes and the address waits, whichever server it reaches."}]},{"name":"Address check","steps":[{"at":"waterfall","state":"ad tag","say":"An ad break needs ads from an external ad server."},{"at":"vault","state":"decrypting","say":"The ad tag address is stored encrypted; it is opened only now.","tech":"AES-256-GCM."},{"at":"guard","state":"checking","say":"The address is resolved: it must be a public internet host, not the platform's own network.","tech":"Private, loopback, link-local and carrier-grade NAT ranges are refused."},{"at":"outside","state":"SUCCEEDED","say":"Public, so the call is made. Each redirect hop is checked the same way."}]},{"name":"Sneaky redirect","steps":[{"at":"outside","state":"redirect →","say":"An ad server answers with a redirect pointing at an internal address."},{"at":"guard","state":"refused","say":"The guard checks the new hop before following it and refuses: no request reaches the internal network.","tech":"Redirects are followed one hop at a time by hand. Not yet covered: DNS rebinding between check and connect."}]}]},"steps":["After 5 wrong passwords for one account within 5 minutes, that account waits a few minutes (\"Too many attempts\").","After 20 failed sign-ins from one address within 15 minutes (many accounts), that address waits.","One address can request at most 10 password-reset emails an hour; each account gets at most 3 an hour.","Partner client-credential guessing is limited per address the same way (20 failures per 15 minutes). Bad personal tokens are logged per address but never block valid ones."],"rules":["Limits are stored in the database (auth_attempt), so they hold across restarts and several servers; emails are stored only as hashes.","Behind a proxy the visitor's address is taken from X-Forwarded-For only when the proxy is on a private network.","Ad-server and remote media addresses must be public http(s) hosts; every redirect hop is checked too.","Ad-tag URLs are encrypted (AES-GCM) in the database; older plaintext rows are encrypted at start-up.","Pages send Content-Security-Policy (only the app's own scripts, no framing), Referrer-Policy and Permissions-Policy."],"api":[{"text":"429 RATE_LIMITED on POST /api/auth/login, /api/auth/token, /api/auth/forgot and /oauth/token","link":null}],"tests":["backend: SecurityHardeningTest, PublicUrlTest"],"docs":["docs/SECURITY_AND_RIGHTS.md"],"screenshots":[],"howItWorks":["Each counted event (a wrong password, a reset-email request, a bad partner secret or personal token) adds one row to auth_attempt with a bucket such as login-email:<hash> or login-ip:<address>.","Before the check runs, the server counts that bucket's rows in its time window; at the limit it answers 429 \"Too many attempts\" without checking the password. A successful sign-in clears the account's bucket.","Outbound addresses (ad servers, VAST wrappers, creative and remote video files) are resolved and refused when they point at a private, loopback, link-local, carrier-grade-NAT or other non-public network. Redirects are followed one hop at a time and each hop is checked again; for remote video the final address is resolved before ffmpeg starts.","Ad-tag URLs are sealed with AES-256-GCM before saving and opened only when an ad waterfall is built; rows saved before encryption are sealed automatically at start-up.","Every page carries a Content-Security-Policy that allows only the app's own scripts and forbids framing, plus Referrer-Policy and Permissions-Policy."],"optimizations":["One composite index (bucket, created_at) makes every limit check a short index range scan.","Only failures are counted for sign-in, so normal users add no rows; emails are stored as SHA-256 hashes (no personal data in the table).","An hourly job deletes rows older than a day, so the table stays small however long the system runs.","Inside the security filter the token limit uses a non-throwing check, so an over-limit request is a clean 401 instead of an error page.","Redirect checking reuses one HTTP client per source (connection pooling) and stops after 5 hops.","AES-GCM decryption of an ad tag takes microseconds and happens only when the waterfall is read."],"scale":["A sign-in adds two indexed counts (and two inserts only when it fails). That is tiny next to the deliberate cost of checking a password hash (bcrypt, tens of milliseconds), so the limiter is never the bottleneck.","Limits are shared by every server through PostgreSQL and survive restarts, so scaling out doesn't loosen them.","Behind a load balancer the real visitor address is used (X-Forwarded-For from private-network proxies only), so one busy proxy doesn't lock everyone out and visitors can't fake their address.","Known ceiling: a very large credential-stuffing attack (millions of attempts an hour) would still reach the application and the database. Block such floods earlier with Cloudflare rate limiting or WAF rules in front; this database limiter is the second line.","DNS rebinding between the address check and the actual connection is not yet prevented; the upgrade is an HTTP client that connects only to the checked address."]},{"id":"tenant-isolation","title":"Tenant isolation in the database","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Each customer only ever sees its own data, and the database itself enforces it: even a bug in the application can't read or change another customer's rows. Work that must span customers (background jobs, platform administration) runs through a separate, tightly held database login. Nothing to click: it applies to every screen and API.","who":["Everyone, automatically"],"flow":{"title":"See how the database keeps customers apart","intro":"The boxes are the layers every request passes through; the pill is one request or one database row. Pick a situation.","nodes":[{"id":"user","col":1,"row":1,"icon":"👤","label":"Person at Aurora","sub":"Signed in to project Aurora"},{"id":"path","col":2,"row":1,"icon":"🧭","label":"Path and token check","sub":"/api/orgs/{org} must be yours"},{"id":"pool","col":3,"row":1,"icon":"🔌","label":"Request connection","sub":"Restricted login, stamped with Aurora"},{"id":"rls","col":4,"row":1,"icon":"🛡️","label":"Row-level security","sub":"Every row compared with the stamp"},{"id":"jobs","col":1,"row":2,"icon":"⚙️","label":"System work","sub":"Jobs, platform admin, alert scans"},{"id":"system","col":2,"row":2,"icon":"🔑","label":"System connection","sub":"Separate login the rules trust"},{"id":"aurora","col":3,"row":2,"icon":"📦","label":"Aurora's rows","sub":"Visible to Aurora"},{"id":"other","col":4,"row":2,"icon":"🚫","label":"Northwind's rows","sub":"Invisible to Aurora"}],"scenarios":[{"name":"Normal request","steps":[{"at":"user","state":"GET /api/orgs/aurora/…","say":"Someone at Aurora opens the Library."},{"at":"path","state":"checked","say":"The organization in the path must be in their sign-in token, and they must still be a member."},{"at":"pool","state":"org = Aurora","say":"A database connection is borrowed and stamped with Aurora.","tech":"`set_config('app.org_id', …)` on every checkout."},{"at":"rls","state":"filtering","say":"The database compares every row with the stamp, on top of the app's own organization filter."},{"at":"aurora","state":"SUCCEEDED","say":"Only Aurora's videos come back."}]},{"name":"A bug forgets the filter","steps":[{"at":"pool","state":"select * from asset","say":"Imagine a coding mistake: a query without any organization filter."},{"at":"rls","state":"filtering","say":"Row-level security still applies, because the database does it, not the code."},{"at":"other","state":"hidden","down":["other"],"say":"Northwind's rows are simply not there for this connection."},{"at":"aurora","state":"SUCCEEDED","say":"The mistake returns only Aurora's rows. A CI check also catches the missing filter before it ships.","tech":"`tools/check-tenant-filters.mjs`."}]},{"name":"Someone tries another project","steps":[{"at":"user","state":"GET /api/orgs/northwind/…","say":"An Aurora user types Northwind's project into the address."},{"at":"path","state":"refused: 404","say":"Refused before any data is read: they are not a member. The answer is \"not found\", so it doesn't even confirm the project exists."}]},{"name":"Writing into another project","steps":[{"at":"pool","state":"insert org = Northwind","say":"A request stamped with Aurora tries to write a row that belongs to Northwind."},{"at":"rls","state":"refused","say":"PostgreSQL rejects the row: new rows must match the stamp too.","tech":"Policy `with check (fs_tenant_ok(org_id))`."}]},{"name":"Background work","steps":[{"at":"jobs","state":"all tenants","say":"A background job needs to look across projects, such as picking the next video to convert."},{"at":"system","state":"system login","say":"It uses its own connection pool with a separate login that the rules trust. A request connection can't switch to it.","tech":"Trust is based on `session_user`, which `set role` cannot change."},{"at":"aurora","state":"org = Aurora","say":"Once it knows which project a job belongs to, it does the actual work as that project only."}]}]},"steps":["Every project API path names the organization (/api/orgs/{organization}/…); platform tenant routes name the tenant (/api/platform/tenants/{tenant}/…).","The sign-in token carries the organization (org) and its tenant (tid); the organization in the path must be one the token lists and the person belongs to, otherwise the answer is 404.","Every database query of a project names that organization, and the database adds its own check on top."],"howItWorks":["Requests use a database login (faststudio_app_login) that may only see rows of the organization stamped on its connection. It is not the table owner and cannot switch to any other role.","Each borrowed connection is stamped with the current organization (app.org_id); PostgreSQL row-level security policies compare every row's organization with it. An unfiltered \"select * from asset\" returns only that project's videos, and inserting a row for another organization fails.","Cross-tenant system work (platform administration, media jobs, alert scans, edge publishing, partner client sign-in) gets its connection from a separate pool that logs in as faststudio_system_login. The policies trust that login, identified by session_user, which a request connection cannot become.","Both logins are created and kept up to date after every database migration; their passwords are derived from the server's secrets key, so every server sharing the key uses the same ones and nothing extra is configured.","Every table that carries an organization has a policy; organization and membership (they establish the tenant), personal tokens (they belong to a person) and the platform email outbox are deliberately outside, and a test fails if any other table is missing one.","In the code, every SQL statement on a tenant table also names the organization explicitly (or is marked as deliberate cross-tenant system work); a CI check enforces this."],"optimizations":["The organization is stamped once per connection checkout with one tiny statement; no per-query overhead in the application.","Policies are simple equality checks on org_id, which the tenant-first indexes serve directly, so row-level security adds no extra table reads.","System work and requests use separate connection pools (10 each per server; the system pool also serves viewer session lookups and platform administration), so a burst of background work can't take every request connection."],"scale":["All projects share one database, so adding a customer costs one row, not a database. Isolation does not weaken with more customers: every query is filtered by organization in the database itself.","Indexes on large tables lead with org_id, so one project's queries read only its own slice however large other projects grow.","Known ceiling: one PostgreSQL server for all tenants. Upgrade path, in order: connection pooling (PgBouncer), read replicas for reports, then sharding by tenant (e.g. Citus) without changing the application. A dedicated database for one tenant is possible when a contract requires it.","Not measured: behaviour under sustained multi-tenant load."],"rules":["A request connection that tries \"set role\" to the system role is refused; \"reset role\" leaves it as the same restricted login.","The old app.bypass session switch no longer exists; setting it changes nothing.","The configured database user only migrates and must be allowed to create roles (CREATEROLE)."],"api":[],"tests":["RowLevelSecurityTest (7, production logins)","CrossTenantMatrixTest","tools/check-tenant-filters.mjs (CI)"],"docs":["docs/MULTITENANCY.md","migration V18__system_login_and_rls_coverage.sql"],"screenshots":[]},{"id":"features-permissions-catalogue","title":"Features, permissions and roles","area":"Multi-tenancy","status":"Built","completed":"2026-11-02","summary":"One platform catalogue, organised like the v2 CMS: modules contain feature groups, feature groups contain features, and each feature lists the permissions it uses. Projects switch features on from that catalogue; roles (from the platform or a project's own) give people permissions, picked module by module and group by group. Screens hide parts whose feature is off, and can require a feature and a permission together.","who":["Platform administrators: modules, feature groups, features, permissions and global roles (Global configuration)","Project owners and administrators (TEAM_MANAGE): switch features on for their project (Settings) and make project roles (Team)","Everyone: sees which features and permissions apply to them (Settings)"],"flow":{"title":"From the catalogue to a button on screen","intro":"The boxes are the parts involved; the pill is one feature or permission on its way to a screen. Pick a situation.","nodes":[{"id":"platform","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Global configuration"},{"id":"catalogue","col":2,"row":1,"icon":"📚","label":"Catalogue","sub":"Module › group › feature › permissions"},{"id":"project","col":3,"row":1,"icon":"🏢","label":"Project","sub":"Features switched on"},{"id":"padmin","col":4,"row":1,"icon":"👤","label":"Project admin","sub":"Settings and Team"},{"id":"role","col":1,"row":2,"icon":"🎭","label":"Role","sub":"Platform or project role"},{"id":"login","col":2,"row":2,"icon":"🔑","label":"Sign-in","sub":"Project details answer"},{"id":"screen","col":3,"row":2,"icon":"🖥️","label":"Screen","sub":"org.has(…) && org.can(…)"},{"id":"server","col":4,"row":2,"icon":"🛡️","label":"Server","sub":"Enforces system permissions"}],"scenarios":[{"name":"New feature","steps":[{"at":"platform","state":"CLIPS","say":"A platform admin adds the feature Clips to the group \"Clips tools\" of the module Studio, and lists the permissions it uses.","tech":"`POST /api/platform/features` with groupKey and permissions."},{"at":"catalogue","state":"CLIPS · uses CLIPS_EXPORT","say":"It is in the catalogue for every project, switched on nowhere yet."},{"at":"padmin","state":"switch on","say":"A project admin finds it by module and group in Settings and switches it on.","tech":"`PUT /api/orgs/{org}/features/CLIPS`."},{"at":"project","state":"CLIPS on","say":"The project now has the feature."},{"at":"login","state":"features: CLIPS","say":"After sign-in, project details list it."},{"at":"screen","state":"shown","say":"The clips screens appear in this project, and stay hidden everywhere else.","tech":"`org.has('CLIPS')`"}]},{"name":"Role by feature group","steps":[{"at":"padmin","state":"new role","say":"A project admin creates a role \"Clip reviewer\" with the Analyst ceiling."},{"at":"catalogue","state":"Studio › Clips","say":"The role editor shows a tab per module and per group; under the feature Clips it offers the permissions Clips uses."},{"at":"role","state":"VIEW + CLIPS_EXPORT","say":"They tick Export clips. Permissions above the ceiling are greyed out.","tech":"Built-in permissions stay within the ceiling; custom ones can always be added."},{"at":"login","state":"permissions: CLIPS_EXPORT","say":"Someone given that role on the Team page now has the permission."},{"at":"screen","state":"Export shown","say":"The Export button needs both: the feature on and the permission.","tech":"`org.has('CLIPS') && org.can('CLIPS_EXPORT')`"}]},{"name":"Subscription features","steps":[{"at":"catalogue","state":"LIBRARY_SYNC","say":"Built-in features belong to the subscription."},{"at":"padmin","state":"switch on?","say":"A project admin tries to switch one on."},{"at":"project","state":"refused: 409","say":"Refused: the platform administrator switches these on, and only if the tenant's plan includes them."}]},{"name":"Isolation","steps":[{"at":"padmin","state":"clip-reviewer","say":"Aurora creates a project role."},{"at":"role","state":"Aurora only","say":"Northwind never sees it, even with a direct query.","tech":"Row-level security on `access_role.org_id`."},{"at":"server","state":"enforced","say":"System permissions are still checked by the server on every request; custom ones only drive what screens show."}]}]},"steps":["Platform: Global configuration → Features & permissions. Four lists: Features, Permissions, Feature groups and Modules, each with Add, Edit and Remove.","Add a feature with its group and the permissions it uses; mark it Default, Hidden or Beta if needed.","Project: Settings → Project features. Search by module and group, switch features on or off, or \"Add default features\". Subscription features are switched on by the platform.","Project: Team → Roles. Add a role with a ceiling, then tick permissions module by module and group by group. Give it to people in the member list.","Platform roles: Global configuration → Organization roles uses the same grouped editor.","In screens, hide by feature with org.has('KEY'), and use org.has(feature) && org.can(permission) when both apply."],"howItWorks":["Modules and feature groups are their own tables; features and permissions are rows of the catalogue table, global only, with a list of the permissions each feature uses.","A project's features are the global features it has switched on; built-in ones also need the tenant's plan.","A person's permissions are their role's built-in permissions plus custom ones: all for owners and administrators, the listed ones for a custom role (platform or project).","Project roles are rows with the project's organization; row-level security keeps them inside the project. Role keys are unique across the platform.","Project details after sign-in carry both lists; GET /api/orgs/{org}/features shows them with the catalogue."],"optimizations":["The catalogue comes back in one answer for the configuration screens and the role editor.","Checks in screens are plain identifier lookups; no extra request."],"scale":["New features, permissions, groups and roles need no code or deployment.","Known limit: custom permissions only control what screens show; protecting a new endpoint needs a server check of its identifier.","Not measured: catalogues with thousands of entries."],"rules":["Identifiers are unique and never change.","Built-in features and permissions can be renamed and regrouped, not switched off or removed.","Modules and groups that still contain something can't be removed.","A role can't reach above its creator's own role, and owner stays a built-in role.","A project role can't be removed while someone has it."],"api":[{"text":"GET /api/platform/catalogue","link":"API.html#ep-get-api-platform-catalogue"},{"text":"POST /api/platform/modules","link":"API.html#ep-post-api-platform-modules"},{"text":"POST /api/platform/feature-groups","link":"API.html#ep-post-api-platform-feature-groups"},{"text":"POST /api/platform/features","link":"API.html#ep-post-api-platform-features"},{"text":"POST /api/platform/permissions","link":"API.html#ep-post-api-platform-permissions"},{"text":"GET /api/orgs/{org}/features","link":"API.html#ep-get-api-orgs-org-features"},{"text":"PUT /api/orgs/{org}/features/{key}","link":"API.html#ep-put-api-orgs-org-features-key"},{"text":"POST /api/orgs/{org}/features/defaults","link":"API.html#ep-post-api-orgs-org-features-defaults"},{"text":"GET /api/orgs/{org}/roles","link":"API.html#ep-get-api-orgs-org-roles"},{"text":"PUT /api/orgs/{org}/roles","link":"API.html#ep-put-api-orgs-org-roles"},{"text":"DELETE /api/orgs/{org}/roles/{key}","link":"API.html#ep-delete-api-orgs-org-roles-key"}],"tests":["CatalogueTest (3: catalogue rules and built-in protection; project linking incl. hidden, subscription and defaults; project roles, isolation, assignment and in-use protection)","frontend/e2e/global-config.spec.ts (permission and feature added through the screens, grouped role editor)"],"docs":["docs/PLATFORM_ADMIN_PLAN.md","migration V25__modules_feature_groups_roles.sql"],"screenshots":[]},{"id":"tenant-detail-page","title":"Tenant detail page","area":"Multi-tenancy","status":"Built","completed":"2026-11-02","summary":"Clicking a customer tenant on the Tenants page opens its own page. Side tabs hold everything the platform manages for it: subscription and projects, configuration, and for the project picked at the top of the side bar, its features, roles, connectors and media types. The address remembers the tab and project, so a link or a reload opens the same place.","who":["Platform administrators"],"flow":{"title":"From the Tenants list to one project's settings","intro":"The boxes are the parts of the page; the pill is where you are. Pick a situation.","nodes":[{"id":"list","col":1,"row":1,"icon":"📋","label":"Tenants list","sub":"Every customer tenant"},{"id":"page","col":2,"row":1,"icon":"🏢","label":"Tenant page","sub":"/platform/tenants/{id}"},{"id":"tenantTabs","col":3,"row":1,"icon":"🧾","label":"Tenant tabs","sub":"Overview, Configuration"},{"id":"picker","col":4,"row":1,"icon":"🎯","label":"Project picker","sub":"Top of the side bar"},{"id":"features","col":1,"row":2,"icon":"🧩","label":"Features","sub":"Switch features on"},{"id":"roles","col":2,"row":2,"icon":"🎭","label":"Roles","sub":"The project's own roles"},{"id":"connectors","col":3,"row":2,"icon":"🔌","label":"Connectors","sub":"Mux, ad servers, R2"},{"id":"media","col":4,"row":2,"icon":"🎞️","label":"Media types","sub":"Permitted types"}],"scenarios":[{"name":"Open a tenant","steps":[{"at":"list","state":"Aurora","say":"On the Tenants page you click a tenant (or its Manage button)."},{"at":"page","state":"Overview","say":"Its page opens on Overview: subscription plan and status, suspend, and the list of projects with Add project."},{"at":"tenantTabs","state":"Configuration","say":"The Configuration tab edits tenant defaults, or one project's overrides, with the scope picker."}]},{"name":"Work on a project","steps":[{"at":"picker","state":"Aurora Media","say":"Pick a project at the top of the side bar, or click Open on a project in Overview."},{"at":"features","state":"features","say":"Features: switch catalogue features on for this project, including subscription features its plan includes.","tech":"`/api/platform/orgs/{orgId}/project-features`"},{"at":"roles","state":"roles","say":"Roles: add or edit the project's own roles with the grouped permission editor.","tech":"`/api/platform/orgs/{orgId}/roles`"},{"at":"connectors","state":"connectors","say":"Connectors: the video library, ad demand waterfall and storage for this project."},{"at":"media","state":"media types","say":"Media types: which types this project may use."}]},{"name":"Share a link","steps":[{"at":"page","state":"?tab=roles&project=…","say":"The address holds the tab and the project."},{"at":"roles","state":"same place","say":"Opening the link or reloading shows the same tab for the same project."}]}]},"steps":["Platform administration → Tenants: click a tenant's name or Manage.","Overview: change the subscription plan or status, suspend the tenant, add a project, suspend a project, or click Open on a project.","Configuration: choose Tenant defaults or one project, then edit its properties.","Pick a project at the top of the side bar, then use Features, Roles, Connectors or Media types for it."],"howItWorks":["The page is /platform/tenants/{tenant}; the side tab and the project are kept in the address (?tab=…&project=…).","Overview and Configuration use the existing tenant settings routes; Connectors and Media types reuse the per-project parts of the Connectors and Media types screens.","Features and Roles use new platform routes for one customer project, because platform administrators aren't project members; they follow the same rules as the project's own Settings and Team pages, plus subscription features when the plan includes them."],"optimizations":["Each tab loads only its own data when opened.","The side bar stays in view while scrolling (sticky), and stacks above the content on narrow screens."],"scale":["Known limit: the project picker is a simple list; a tenant with hundreds of projects would want search there.","Not measured: tenants with many projects."],"rules":["Platform administrators only.","Project tabs work on customer projects; partner organizations get 404.","Project roles made here belong to that project only."],"api":[{"text":"GET /api/platform/orgs/{orgId}/project-features","link":"API.html#ep-get-api-platform-orgs-orgid-project-features"},{"text":"PUT /api/platform/orgs/{orgId}/project-features/{key}","link":"API.html#ep-put-api-platform-orgs-orgid-project-features-key"},{"text":"GET /api/platform/orgs/{orgId}/roles","link":"API.html#ep-get-api-platform-orgs-orgid-roles"},{"text":"PUT /api/platform/orgs/{orgId}/roles","link":"API.html#ep-put-api-platform-orgs-orgid-roles"},{"text":"DELETE /api/platform/orgs/{orgId}/roles/{key}","link":"API.html#ep-delete-api-platform-orgs-orgid-roles-key"}],"tests":["CatalogueTest (platform manages a project's features and roles)","frontend/e2e/tenant-detail.spec.ts (opens a tenant and every side tab, reload keeps the tab)"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"tenant-tabs","account":"platform","path":"/platform","caption":"A tenant's page: side tabs for the tenant (Overview, Configuration) and, for the project picked at the top, its Features, Roles, Connectors and Media types. Here the project's roles.","src":"../features/img/tenant-detail-page--tenant-tabs.png","exists":true,"width":1440,"height":900}]},{"id":"connector-marketplace","title":"Connector marketplace: fields, rules and connections","area":"Multi-tenancy","status":"Built: fields, rules, connection screens; Mux, R2 and the ad waterfall read their connections (P3a–P3d)","completed":"2026-11-03","summary":"Platform administrators define each connector's fields in the database: key, type, required, encrypted, and whether tenants see it (external) or only the platform (internal). They group connectors in categories and set, per connector, its status (available, coming soon, unpublished), who connects it (tenants, the platform, or contact your account manager) and the permission someone needs to see it. Connections store values by field key; encrypted values are sealed and never shown again. Projects connect from Settings → Connectors; the platform connects for any project on the tenant page, and keeps platform-wide connections (R2) in Global configuration.","who":["Platform administrators (fields, categories, rules, any connection)","Project members with Manage team (connect connectors whose rule allows it)"],"flow":{"title":"From a field definition to a stored value","intro":"The boxes are the parts involved; the pill is the request moving through. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Global configuration","sub":"Fields, categories, rules"},{"id":"props","col":2,"row":1,"icon":"🧾","label":"connector_property","sub":"Field rows"},{"id":"def","col":3,"row":1,"icon":"🔌","label":"connector_definition","sub":"Status, rule, permission"},{"id":"tenant","col":1,"row":2,"icon":"👤","label":"Project member","sub":"/api/orgs/{org}/connectors"},{"id":"service","col":2,"row":2,"icon":"⚖️","label":"Marketplace rules","sub":"ConnectorCatalogueServiceV1"},{"id":"secrets","col":3,"row":2,"icon":"🔐","label":"Secrets","sub":"Seal encrypted values"},{"id":"values","col":4,"row":2,"icon":"🗄️","label":"connector_value","sub":"RLS by org_id"}],"scenarios":[{"name":"Add a field","steps":[{"at":"admin","state":"token_secret","say":"On a connector card, Fields → Add field: key token_secret, required, encrypted, platform only."},{"at":"props","state":"saved","say":"The field is a row; nothing in the code lists it.","tech":"`PUT /api/platform/connector-definitions/mux/properties/token_secret`"}]},{"name":"A tenant connects an ad server","steps":[{"at":"tenant","state":"VAST","say":"A member with Manage team connects VAST with a tag address.","tech":"`POST /api/orgs/{org}/connectors/vast`"},{"at":"def","state":"ALLOWED","say":"The rule says tenants may connect it, it is available, and they may see it."},{"at":"service","state":"checked","say":"Only known external fields; the address must be http(s), the timeout a number; the default fills the timeout."},{"at":"secrets","state":"sealed","say":"The tag address is an encrypted field, so it is sealed before storing."},{"at":"values","state":"stored","say":"Values are stored under the project; another project can't read or change them."}]},{"name":"A tenant tries Mux","steps":[{"at":"tenant","state":"Mux","say":"The member opens Mux: they see only external fields, and a note that the platform connects it."},{"at":"service","state":"403","say":"Saving is refused: Mux's rule is NOT_ALLOWED. The platform connects it from the tenant page."}]},{"name":"Mux syncs the library","steps":[{"at":"values","state":"mux","say":"A library sync needs the project's Mux credentials: they are the project's mux connection values.","tech":"`ConnectorCatalogueServiceV1.connection(org, \"mux\")`"},{"at":"secrets","state":"opened","say":"Encrypted values are opened on the server only, for the call to Mux; they never go into an answer."},{"at":"service","state":"connected","say":"No token id or secret = 409 LIBRARY_NOT_CONNECTED; otherwise the sync runs as before."}]}]},"steps":["Platform administration → Global configuration → Connector definitions.","Categories: add, rename, reorder or delete marketplace groups.","On a connector card click Fields: set status, who connects it, the permission needed to see it, level and whether a project can add several; save.","Add field: key, label, type (text, number, yes/no, list, web address), required, encrypted, and who sees it.","Project Settings → Connectors: click Connect (or Add another for ad servers), fill the fields, save. Connectors the platform connects show a note instead.","Tenant page → pick a project → Connectors: the platform sees internal fields too and can connect any available connector.","Platform connections (Global configuration → Connector definitions, bottom): connections for the whole platform, such as R2."],"howItWorks":["V26 adds connector_category, connector_property, connector_instance and connector_value, and marketplace columns on connector_definition. Mux, R2 and VAST fields are seeded as rows.","A project sees a connector when it is published, enabled for its tenant and project, project-level, and the person holds its required permission; tenants get external fields only.","Saving a connection type-checks values, seals encrypted ones with the server key, and keeps a stored secret when the field is left blank.","Adapters read a connection's values by field key with defaults filled in (ConnectorCatalogueServiceV1.values).","One screen (shared/configuration/ConnectorPanel.tsx) serves all three places; it builds each form from the fields the server sends, so a new field needs no code. Encrypted fields are password boxes that stay empty; leaving one blank keeps the stored secret.","Mux reads its credentials from the project's mux connection (V27 moved existing ones over with the same ciphertext); the old Mux form and the marketplace edit the same values, and the health check is stored on the connection.","The edge client (R2 uploads, live playback signing) reads the platform's r2 connection, cached 30 seconds, and falls back to faststudio.edge.* for fields not stored there.","The ad waterfall is the project's instances of connectors with driver DIRECT or VAST, in position order (V28 moved ad_source over with the same ids and sealed tag URLs, then dropped it). All multi-instance connections of a project share one numbering, so a new ad server goes to the end. The Ads page and the platform Connectors page keep their ad-source screens and edit the same connections.","Google Ad Manager is its own connector (key gam, V28) on the VAST adapter with the same field keys (tag_url sealed, timeout_ms), so its connections join the waterfall with no code. Its creatives are conditioned into R2 and delivered by Cloudflare like every ad.","When the first external ad server is added to a project still on the implicit default waterfall, direct-sold campaigns are saved first, so they stay at the top instead of dropping out."],"optimizations":["One query each for connectors, fields, connections and values per view."],"scale":["Not measured: projects with many ad servers.","Known limit: the field list of a connector is read whole; fine for tens of fields."],"rules":["Platform administrators only for fields, categories and rules.","Tenants connect a connector only when it is available and its rule is ALLOWED, and only with Manage team; ad servers (direct, vast) instead need Edit ads and the project's AD_OWN_TAGS feature, as on the Ads page.","Encrypted values are never returned, only whether one is stored.","Changing a field's encryption or deleting it removes its stored values everywhere.","The Worker must hold the same edge secret as the r2 connection; the page security policy still reads faststudio.edge.public-url at start-up.","Tenant exports never include values of encrypted fields.","Connections the platform administrator sets up (managed by the platform) are read-only for the project: shown as \"Managed by the platform\", and changing or removing them is refused (403 PLATFORM_MANAGED)."],"api":[{"text":"GET /api/platform/connector-catalogue","link":"API.html#ep-get-api-platform-connector-catalogue"},{"text":"PUT /api/platform/connector-definitions/{key}/details","link":"API.html#ep-put-api-platform-connector-definitions-key-details"},{"text":"PUT /api/platform/connector-definitions/{key}/properties/{prop}","link":"API.html#ep-put-api-platform-connector-definitions-key-properties-prop"},{"text":"DELETE /api/platform/connector-definitions/{key}/properties/{prop}","link":"API.html#ep-delete-api-platform-connector-definitions-key-properties-prop"},{"text":"POST /api/platform/connector-categories","link":"API.html#ep-post-api-platform-connector-categories"},{"text":"GET /api/orgs/{org}/connectors","link":"API.html#ep-get-api-orgs-org-connectors"},{"text":"POST /api/orgs/{org}/connectors/{key}","link":"API.html#ep-post-api-orgs-org-connectors-key"},{"text":"GET /api/platform/orgs/{orgId}/connector-instances","link":"API.html#ep-get-api-platform-orgs-orgid-connector-instances"},{"text":"GET /api/platform/connector-instances","link":"API.html#ep-get-api-platform-connector-instances"}],"tests":["ConnectorCatalogueTest (fields as rows, sealed secrets, tenant rules, status, project isolation, ad-server rules, Google Ad Manager in the waterfall, direct-sold kept first)","frontend/e2e/project-connectors.spec.ts (platform adds an ad server to Aurora; the owner sees it read-only and can't add one without AD_OWN_TAGS; platform removes it)","MuxConnectorMigrationTest (V27 moves credentials unchanged)","MuxTest, LibrarySyncTest, ProjectDetailsTest (Mux through the connection)","TenantDataTest (encrypted connector values not exported)","AdServerMigrationTest (V28 moves the ad waterfall: ids, order, sealed tags, owner)","ConnectorsTest, SecurityHardeningTest, CrossTenantMatrixTest (ad sources through the connections)"],"docs":["docs/PLATFORM_ADMIN_PLAN.md"],"screenshots":[{"id":"connector-fields","account":"platform","path":"/platform/configuration?tab=connectors","caption":"A connector's marketplace details (status, who connects it, permission, level) and its fields: key, type, required, encrypted, and who sees each one.","src":"../features/img/connector-marketplace--connector-fields.png","exists":true,"width":1440,"height":900},{"id":"project-connectors","account":"owner","path":"/aurora/settings?tab=connectors","caption":"Project Settings → Connectors: the owner connects ad servers themselves; Mux shows that the platform connects it.","src":"../features/img/connector-marketplace--project-connectors.png","exists":true,"width":1440,"height":900}]},{"id":"durable-media-jobs","title":"Durable media processing","area":"Media library","status":"Built","completed":"2026-11-01","summary":"Converting a video into 5-second segments is a job stored in the database, so it survives restarts and crashes, runs exactly once even with several servers, retries by itself when the problem is temporary, can be cancelled, and one busy project can't hold up the others. Nothing new to click yet: the Library shows the same statuses; the job history is available through the API.","who":["Everyone who adds videos (automatic)","Owners, admins and operators (cancel; needs asset editing)"],"flow":{"title":"Watch a job move through the system","intro":"Each box is one part of the system; the moving pill is one video's job and its current state. Pick a situation to see how it behaves, step by step.","nodes":[{"id":"you","col":1,"row":1,"icon":"👤","label":"You","sub":"Upload, sample, retry or library sync"},{"id":"db","col":2,"row":1,"icon":"🗄️","label":"Job table (media_job)","sub":"The one place that decides who does what"},{"id":"a","col":3,"row":1,"icon":"🖥️","label":"Worker A","sub":"A thread on server 1"},{"id":"ffmpeg","col":4,"row":1,"icon":"🎞️","label":"ffmpeg","sub":"5-second segments in 3 qualities"},{"id":"reaper","col":1,"row":2,"icon":"⏱️","label":"Reaper","sub":"Checks expired leases every minute"},{"id":"asset","col":2,"row":2,"icon":"📺","label":"Video on air","sub":"The media viewers get"},{"id":"b","col":3,"row":2,"icon":"🖥️","label":"Worker B","sub":"A thread on server 2"},{"id":"folder","col":4,"row":2,"icon":"📁","label":"New folder","sub":"Fresh output; airing media untouched"}],"scenarios":[{"name":"Normal run","steps":[{"at":"you","state":"QUEUED","say":"You upload a video. In the same save, a job is written for it.","tech":"`insert into media_job` in the same database transaction as the asset change: no change without a job, no job without its change."},{"at":"db","state":"QUEUED","say":"The job waits in the table. Clicking twice or a repeated webhook adds nothing.","tech":"A partial unique index allows one active job per video; a second insert is `on conflict do nothing`."},{"at":"a","state":"RUNNING","say":"A free worker on any server takes it. Only one worker can get it.","tech":"`update … where id = (select … for update skip locked limit 1)`. The claim gets fence 1 and a 2-minute lease."},{"at":"ffmpeg","state":"RUNNING","say":"ffmpeg converts the video. Every 30 seconds the worker tells the table it is still alive.","tech":"Heartbeat: `lease_until = now() + 2 min where id = … and fence = 1`."},{"at":"folder","state":"RUNNING","say":"The result goes into a brand-new folder, so what is on air is never touched halfway.","tech":"Folder name `{project}/{video}.{time}`: every run is a new revision."},{"at":"asset","state":"SUCCEEDED","say":"Published in one step: the video switches to the new media and the job is marked done.","tech":"One SQL statement updates job and video together, only while the fence is still 1."}]},{"name":"Server crashes","steps":[{"at":"db","state":"QUEUED","say":"A video is waiting in the queue."},{"at":"a","state":"RUNNING","say":"Worker A on server 1 takes it.","tech":"Fence 1, lease until now + 2 minutes."},{"at":"a","state":"RUNNING","down":["a"],"say":"Server 1 dies in the middle of the job. Its heartbeats stop.","tech":"Nobody extends `lease_until` any more."},{"at":"reaper","state":"QUEUED","down":["a"],"say":"Once the lease has run out, the reaper puts the job back in the queue.","tech":"`state = 'RUNNING' and lease_until < now()` becomes QUEUED, to try again after 1 minute."},{"at":"b","state":"RUNNING","down":["a"],"say":"Worker B on server 2 takes it over.","tech":"Claiming again raises the fence to 2."},{"at":"asset","state":"SUCCEEDED","down":["a"],"say":"Published. Nothing was lost, and the job never ran twice at the same time."}]},{"name":"Frozen worker wakes up","steps":[{"at":"a","state":"RUNNING · fence 1","say":"Worker A is converting the video."},{"at":"a","state":"RUNNING · fence 1","down":["a"],"say":"Worker A freezes for a long time (for example, a stuck machine). Its lease runs out."},{"at":"b","state":"RUNNING · fence 2","down":["a"],"say":"The reaper re-queues the job and Worker B takes it, with fence 2."},{"at":"asset","state":"SUCCEEDED · fence 2","say":"Worker B publishes its result. The video now plays B's media."},{"at":"a","state":"fence 1 refused","say":"Worker A wakes up and tries to publish its older result.","tech":"`… where fence = 1` matches 0 rows: the table holds fence 2."},{"at":"folder","state":"fence 1 refused","say":"Worker A deletes its own output and stops. The newer media stays on air."}]},{"name":"You cancel","steps":[{"at":"ffmpeg","state":"RUNNING","say":"A video is being converted."},{"at":"you","state":"CANCEL_REQUESTED","say":"You cancel it.","tech":"`POST /api/orgs/{org}/assets/{id}/jobs/cancel`. A job still waiting in the queue would be cancelled right away."},{"at":"a","state":"CANCEL_REQUESTED","say":"At its next heartbeat (within 30 seconds) the worker sees the cancel.","tech":"The heartbeat returns the job's state."},{"at":"ffmpeg","state":"CANCEL_REQUESTED","down":["ffmpeg"],"say":"The worker kills ffmpeg."},{"at":"folder","state":"CANCEL_REQUESTED","down":["ffmpeg"],"say":"The half-made output is deleted."},{"at":"asset","state":"CANCELLED","say":"The old media keeps airing. A video that never had media goes back to Draft."}]},{"name":"Temporary problem","steps":[{"at":"a","state":"RUNNING · try 1","say":"A worker starts a video from the connected library."},{"at":"a","state":"RUNNING · try 1","say":"The library isn't ready to hand over the original file yet: a temporary problem.","tech":"The content source throws `Retryable`; unexpected errors count as temporary too."},{"at":"db","state":"QUEUED · wait 1 min","say":"The job goes back to the queue and waits. The video still shows Processing.","tech":"Waits of 1, 5, 25 and 125 minutes between tries."},{"at":"b","state":"RUNNING · try 2","say":"Next time, any free worker takes it again."},{"at":"asset","state":"SUCCEEDED","say":"This time it works and is published. After 5 failed tries the video shows Failed with the reason. A broken file fails at once, without retrying."}]},{"name":"Fair sharing","steps":[{"at":"db","state":"6 from A, 1 from B","say":"Project A queues 6 videos, then project B queues 1."},{"at":"a","state":"A: 1st video","say":"Project A's first video starts."},{"at":"b","state":"A: 2nd video","say":"Project A's second video starts. A now runs its maximum of 2 at once."},{"at":"db","state":"B goes next","say":"The next free worker skips project A's waiting videos and takes B's.","tech":"The claim skips projects already running `faststudio.media.jobs-per-project` (2) programme jobs. Ads have their own lane."},{"at":"asset","state":"SUCCEEDED","say":"One project's big import can't hold up everyone else."}]}]},"steps":["Create a sample, upload a file, retry a failed video or sync the library: the video shows PROCESSING and a job is queued with that change.","To see what is happening, call GET /api/orgs/{organization}/assets/{video}/jobs: state, attempt, last error and, while waiting for a retry, when it runs next.","To stop it, call POST /api/orgs/{organization}/assets/{video}/jobs/cancel. A video that was already ready keeps its old media on air; a new one goes back to DRAFT."],"howItWorks":["The job row is written in the same database transaction as the change that needs it, so there is never a change without a job or a job without its change. A second request for the same video does nothing while one is active.","Worker threads on every server ask the database for the next due job; FOR UPDATE SKIP LOCKED hands each job to exactly one of them.","A running job holds a 2-minute lease that its worker renews every 30 seconds. If the server dies, the lease runs out and the job goes back to the queue within about a minute.","Every claim gets a new fence number. The finished video is published (asset and job in one statement) only if the fence still matches, so a worker that lost its job can never replace newer media; the currently airing media is untouched until then.","Temporary failures (library not ready, address unreachable, unexpected errors) retry after 1, 5, 25 and 125 minutes, then fail; a bad file fails at once.","Cancelling a running job is seen at the next heartbeat; the worker kills its ffmpeg and throws its half-made output away."],"optimizations":["Claims, heartbeats and results are single short statements; no database lock is held while a video converts.","Ad creatives have their own lane, so they never wait behind a film."],"scale":["A project runs at most 2 programme jobs at once across all servers, so one project's 500-video sync can't starve the others; the rest wait their turn.","Add servers to add workers (2 programme + 1 ad thread each, configurable); the table coordinates them.","Known limits: an interrupted conversion restarts from the beginning; an idle worker picks a new job up within about 2 seconds; two servers claiming at the same instant can put a project one job over its share.","Not measured: behaviour with many servers or thousands of queued jobs."],"rules":["Jobs belong to a project and are protected by row-level security like videos; another project's user gets 404.","Cancel needs the asset editing permission; with nothing queued or running the answer is 409 NOT_PROCESSING.","Finished jobs are kept for 30 days."],"api":[{"text":"GET /api/orgs/{org}/assets/{id}/jobs","link":"API.html#ep-get-api-orgs-org-assets-id-jobs"},{"text":"POST /api/orgs/{org}/assets/{id}/jobs/cancel","link":"API.html#ep-post-api-orgs-org-assets-id-jobs-cancel"}],"tests":["MediaJobTest (10: duplicate enqueue, two workers, crash, stale worker, cancel queued and running, retries, permanent failure, fairness, isolation)","MediaStopTest (a real ffmpeg is killed)","MediaJobMigrationTest (converting videos survive the upgrade)"],"docs":["docs/MEDIA_JOBS_DESIGN.md","migration V22__media_jobs.sql"],"screenshots":[]},{"id":"connected-library","title":"Connected video library: sync and prepare","area":"Media library","status":"Built","completed":"2026-11-01","summary":"A project's existing video library (Mux today) is read into FAST Studio as a catalogue: every ready video appears as a Draft with its title and length, without fetching or converting anything. You then pick the videos you want on air and prepare only those. Syncs run in the background, continue where they stopped after an outage, never import a video twice and never overwrite what you edited here.","who":["Platform administrators: connect the library, check the connection, start a sync (Connectors page)","Owners and content managers with the library-sync feature: start a sync and prepare videos (API; Library screen to follow)","Everyone in the project: see the library status"],"flow":{"title":"Follow a library video from sync to air","intro":"The boxes are the parts involved; the pill is one sync or one video. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Connects and checks the library"},{"id":"conn","col":2,"row":1,"icon":"🔐","label":"Connection","sub":"Encrypted keys, last check, sync checkpoint"},{"id":"worker","col":3,"row":1,"icon":"⚙️","label":"Sync job","sub":"Reads one page at a time"},{"id":"library","col":4,"row":1,"icon":"☁️","label":"Video library","sub":"The project's own Mux account"},{"id":"you","col":1,"row":2,"icon":"👤","label":"Project user","sub":"Starts a sync, picks videos"},{"id":"catalogue","col":2,"row":2,"icon":"🗂️","label":"Catalogue","sub":"Draft videos + where each came from"},{"id":"prepare","col":3,"row":2,"icon":"🎞️","label":"Preparation job","sub":"Fetches the file, makes 5-second segments"},{"id":"air","col":4,"row":2,"icon":"📺","label":"Ready to air","sub":"Can be scheduled"}],"scenarios":[{"name":"Connect and check","steps":[{"at":"admin","state":"keys saved","say":"A platform admin enters the library's access keys for a project."},{"at":"conn","state":"not checked","say":"They are stored encrypted. Saved keys alone don't count as a working connection.","tech":"AES-GCM ciphertext in `media_connection`; never returned by any API."},{"at":"library","state":"checking","say":"\"Check connection\" reads the library with those keys."},{"at":"conn","state":"healthy","say":"The result and time are recorded, with the reason in plain words if it failed. New keys clear the old result."}]},{"name":"Catalogue sync","steps":[{"at":"you","state":"sync","say":"Someone starts a sync. It runs in the background; a second click just shows the running one.","tech":"A SYNC row in `media_job`, at most one active per project."},{"at":"worker","state":"page 1","say":"A worker reads the first page of the library."},{"at":"library","state":"page 1","say":"The library answers with up to 100 videos."},{"at":"catalogue","state":"+ drafts","say":"Each ready video that is new becomes a Draft with its title and length. Videos still processing in the library wait for a later sync.","tech":"Unique on project + source, so nothing is imported twice."},{"at":"conn","state":"checkpoint","say":"Before asking for the next page, the worker saves what it did and where to continue."},{"at":"catalogue","state":"SUCCEEDED","say":"After the last page the sync is complete. Nothing was downloaded or converted."}]},{"name":"Library goes down mid-sync","steps":[{"at":"worker","state":"page 2","say":"Page 1 is done and saved; the worker asks for page 2."},{"at":"library","state":"unreachable","down":["library"],"say":"The library doesn't answer."},{"at":"conn","state":"QUEUED · retry","down":["library"],"say":"The sync waits and tries again later (after 1, 5, 25 minutes…). Page 1 stays imported.","tech":"The job fails as retryable; the checkpoint still points at page 2."},{"at":"worker","state":"page 2","say":"Next time it continues at page 2, without reading page 1 again."},{"at":"catalogue","state":"SUCCEEDED","say":"The sync completes as if nothing happened."}]},{"name":"Prepare selected","steps":[{"at":"you","state":"5 picked","say":"You pick the Draft videos you want to air.","tech":"`POST /api/orgs/{org}/library/prepare` with up to 100 ids."},{"at":"catalogue","state":"checking each","say":"Each video is checked on its own: from the library, still Draft, ready in the library, within the project's conversion limit."},{"at":"prepare","state":"4 queued","say":"Eligible videos are queued; the rest are listed with a reason (already ready, not ready in the library, limit reached…)."},{"at":"library","state":"original file","say":"The preparation job fetches the video's original file from the library."},{"at":"air","state":"SUCCEEDED","say":"Converted into 5-second segments, the video is ready to schedule."}]},{"name":"Edited here, renamed there","steps":[{"at":"you","state":"edit title","say":"You give a synced video your own title and episode numbers."},{"at":"library","state":"renamed","say":"Later, someone renames it in the library."},{"at":"worker","state":"re-sync","say":"The next sync sees the new name."},{"at":"catalogue","state":"kept","say":"Your title stays. What the library says is recorded next to it, not over it.","tech":"`asset_source` holds the library's title and status; the asset row is never touched by a re-sync."}]},{"name":"Video removed from library","steps":[{"at":"library","state":"deleted","down":["library"],"say":"A video is deleted in the library."},{"at":"catalogue","state":"DELETED","say":"A webhook flags it as deleted. If no webhook comes, the next complete sync flags it as missing."},{"at":"air","state":"still airs","say":"The video and any media already prepared stay, so nothing scheduled breaks. Removing it is a separate, deliberate step."}]}]},"steps":["Platform administration → Connectors → a project → Mux video library: enter the access token ID and secret (and the webhook signing secret), then Check connection.","Sync library now: the page shows progress (videos seen, added as drafts, pages) and, after an outage, when it retries.","Projects with the library-sync feature can start the same sync with POST /api/orgs/{organization}/library/sync and watch it with GET /api/orgs/{organization}/library.","Prepare the videos you want to air: POST /api/orgs/{organization}/library/prepare with their ids. The answer lists anything that wasn't queued and why.","Your own direct uploads to the library still prepare automatically, because you uploaded them to air."],"howItWorks":["The connection (media_connection) stores the provider, encrypted keys, the last check and the sync checkpoint. Library code talks to the platform only through a provider adapter (IMediaProvider) that declares what the platform can do: CATALOGUE, DIRECT_UPLOAD, SOURCE_FILE, WEBHOOKS. Actions a platform can't do are refused with 409 NOT_SUPPORTED.","A sync is a durable SYNC job. The worker reads one page, imports it, then saves the next page's position under the job's fence; a crash, restart or outage continues from there. No database transaction or web request stays open while the library is called.","Importing a video is idempotent: a new ready video becomes a Draft asset bound by source_ref; a known one only updates its asset_source row (the library's title, length, status and when it was last seen).","When a full scan reaches its last page, videos of that library not seen since the scan started are flagged MISSING, in the same statement that completes the job.","Prepare marks each eligible video Processing and queues an ordinary packaging job, which fetches the original file and converts it.","Mux webhooks (created, ready, errored, deleted) take the same import path; a direct upload of ours is linked to its row and prepared at once.","Since V27 the Mux credentials are the project's mux connector connection (connector marketplace); media_connection keeps the sync checkpoint."],"optimizations":["Pages of 100; one small insert or update per video and one checkpoint update per page.","Nothing is downloaded or converted during sync, so a large library costs only listing calls.","The connector switch is cached for 30 seconds, like the other connector checks."],"scale":["A sync runs on any server's media workers and counts as one of the project's 2 running jobs, so a huge library can't take every worker.","Only one sync per project can be queued or running; repeated clicks are free.","Known limits: one connection per project; if a server dies between importing a page and saving its checkpoint, that page is read again (nothing is duplicated, only the \"videos seen\" count goes up twice); the media-hours limit is checked once when a sync starts.","Not measured: libraries with tens of thousands of videos."],"rules":["Library videos arrive as movies (Draft). Nothing is prepared unless someone picks it, or it was our own direct upload.","Titles, episodes and rights edited in FAST Studio are never overwritten by a sync.","A video deleted or missing in the library is only flagged; its local copy and prepared media stay.","Prepare takes 1 to 100 videos and needs asset editing; starting a sync also needs the library-sync feature (platform administrators can always).","Project users never see the provider's name; credentials are write-only.","Not built yet: cancelling a running sync from the screen, choosing the media type per video at import, scheduled automatic syncs, the Library screen for picking videos."],"api":[{"text":"GET /api/orgs/{org}/library","link":"API.html#ep-get-api-orgs-org-library"},{"text":"POST /api/orgs/{org}/library/sync","link":"API.html#ep-post-api-orgs-org-library-sync"},{"text":"POST /api/orgs/{org}/library/prepare","link":"API.html#ep-post-api-orgs-org-library-prepare"},{"text":"POST /api/platform/orgs/{orgId}/connectors/mux/check","link":"API.html#ep-post-api-platform-orgs-orgid-connectors-mux-check"},{"text":"GET /api/platform/orgs/{orgId}/connectors/mux/sync","link":"API.html#ep-get-api-platform-orgs-orgid-connectors-mux-sync"},{"text":"POST /api/platform/orgs/{orgId}/connectors/mux/sync","link":"API.html#ep-post-api-platform-orgs-orgid-connectors-mux-sync"}],"tests":["LibrarySyncTest (4: a catalogue-only fake platform, resume after an outage, edits kept and missing flagged, prepare selected)","MuxTest (connection check, catalogue-only sync, re-sync, white-label, signed webhooks incl. deleted)"],"docs":["docs/MEDIA_INGESTION_PLAN.md (Tenant Mux catalogue sync)","migration V23__media_connection_and_sources.sql"],"screenshots":[{"id":"connectors-mux","account":"platform","path":"/platform/connectors","caption":"Platform administration → Connectors for one project: the Mux video library card. Connect it with the access token, then Check connection; once connected, the card shows the last check and the library sync (videos seen, added as drafts, pages, when it finished or retries) next to Check connection and Sync library now. The demo has no Mux account, so it shows the connect form.","src":"../features/img/connected-library--connectors-mux.png","exists":true,"width":1440,"height":900}]},{"id":"project-limits","title":"Per-project limits","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Every project has a fair share: a cap on API requests per minute, on stored video hours and on videos converting at once, so one busy project can't slow everyone else down. Platform administrators set the limits per plan, tenant or project.","who":["Platform administrators set the limits","Every project is held to them"],"flow":{"title":"See how a busy project is kept to its share","intro":"The boxes are the checks a request or a conversion passes; the pill is one request. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Sets limits per plan, tenant or project"},{"id":"config","col":2,"row":1,"icon":"⚙️","label":"Settings","sub":"Global → tenant → project"},{"id":"user","col":3,"row":1,"icon":"👤","label":"Project user or script","sub":"Calls the API"},{"id":"counter","col":4,"row":1,"icon":"⏱️","label":"Request counter","sub":"Per project, per minute"},{"id":"storage","col":1,"row":2,"icon":"💾","label":"Stored hours check","sub":"Before uploads and syncs"},{"id":"converting","col":2,"row":2,"icon":"🎞️","label":"Converting check","sub":"Before a conversion starts"},{"id":"api","col":3,"row":2,"icon":"🔌","label":"Project API","sub":"Does the work"},{"id":"other","col":4,"row":2,"icon":"👥","label":"Other projects","sub":"Unaffected"}],"scenarios":[{"name":"Setting a limit","steps":[{"at":"admin","state":"1000 / min","say":"A platform admin sets \"API requests per minute\" for one tenant, or overrides it for one project."},{"at":"config","state":"saved","say":"The most specific value wins: project, then tenant, then the global default. 0 means unlimited.","tech":"Every server applies a change within a minute (cache lifetime)."}]},{"name":"Too many requests","steps":[{"at":"user","state":"request 6001","say":"A script in one project calls the API very fast."},{"at":"counter","state":"over limit","say":"Requests are counted per project in one-minute windows."},{"at":"user","state":"refused: 429","say":"Over the limit, the answer is \"made more than N requests in a minute\". It works again in the next minute."},{"at":"other","state":"SUCCEEDED","say":"Other projects keep their own allowance and notice nothing.","tech":"Known ceiling: counted per server, so N servers allow up to N times the limit."}]},{"name":"Storage full","steps":[{"at":"user","state":"upload","say":"Someone uploads a video."},{"at":"storage","state":"over 500 h","say":"The project's stored hours (archived videos excluded) are compared with its limit first."},{"at":"user","state":"refused: 409","say":"Refused with \"already stores its limit of N hours\". Archiving videos frees room."}]},{"name":"Too many converting","steps":[{"at":"user","state":"retry","say":"Someone retries a failed video while many are converting."},{"at":"converting","state":"20 converting","say":"The number of videos converting right now is compared with the limit."},{"at":"user","state":"refused: 409","say":"Refused with \"N videos are already converting\"; try again when some finish."}]},{"name":"Under the limits","steps":[{"at":"user","state":"upload","say":"A normal upload."},{"at":"counter","state":"ok","say":"Within the requests per minute."},{"at":"storage","state":"ok","say":"Within the stored hours."},{"at":"api","state":"SUCCEEDED","say":"The upload is accepted and its conversion is queued."}]}]},"steps":["Platform administration → Tenants → Manage <tenant>: under Custom properties, set \"API requests per minute\", \"Stored media hours\" or \"Videos converting at the same time\". Configuration scope \"Tenant defaults\" applies to all its projects; choose a project to override it for that project only.","Leave a value at the global default (6000 requests, 500 hours, 20 conversions), or use 0 for unlimited.","A project over a limit gets a clear message: \"made more than N requests in a minute\", \"already stores its limit of N hours\", or \"N videos are already converting\"."],"howItWorks":["The limits are ordinary configuration properties (limits.api_requests_per_minute, limits.media_hours, limits.processing_videos): global default, then tenant value, then project override.","API requests are counted per project in one-minute windows as soon as the project of a request is known; over the limit the answer is 429.","Before an upload, a generated sample, a direct upload or a library sync, the project's stored hours (all videos except archived ones) are compared with its limit; before starting a conversion, the number of videos converting is compared with its limit; over either the answer is 409."],"optimizations":["Each project's limits are read at most once a minute per server (cached), so the check costs nothing on most requests.","Request counting is in memory: no database write per request.","Stored hours and conversions come from one query on an (org_id, status) index."],"scale":["Known ceiling: request counts are per server, so with N servers a project can make up to N times its limit. Upgrade path: Cloudflare rate limiting in front, or a shared counter.","The media-hours check runs once before a library sync, so one sync can go past the limit; the next one is refused.","Changing a limit takes up to a minute to apply on every server (cache lifetime)."],"rules":["Limits are whole numbers; 0 means unlimited; anything else is refused (422).","Partner organizations are not counted (they have no content).","Videos arriving through library webhooks are not blocked by the conversion limit; fair scheduling of conversions is part of the durable job queue (Stage 2)."],"api":[{"text":"PUT /api/platform/tenants/{tenant}/properties/limits.*","link":"API.html#ep-put-api-platform-tenants-tenant-properties-key"},{"text":"PUT /api/platform/tenants/{tenant}/projects/{project}/properties/limits.*","link":"API.html#ep-put-api-platform-tenants-tenant-projects-project-properties-key"}],"tests":["TenantLimitsTest (3)"],"docs":["docs/MULTITENANCY.md §7","migration V19__project_limits.sql"],"screenshots":[{"id":"limits-settings","account":"platform","path":"/platform","caption":"Tenant page → Configuration: the limits sit with its other properties (API requests per minute shown at its old default of 600, now 6000; stored media hours and conversions further down). \"global\" means the global default is in effect; Save override sets it for this tenant, or for one project when a project scope is chosen.","src":"../features/img/project-limits--limits-settings.png","exists":true,"width":1440,"height":900}]},{"id":"tenant-export-delete","title":"Tenant data export and deletion","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"When a customer asks for its data or leaves, a platform administrator can export everything the tenant owns as one file, and then delete the tenant permanently, without touching any other customer.","who":["Platform administrators"],"flow":{"title":"See what export and deletion touch","intro":"The boxes are the steps of an export or deletion; the pill is the request. Pick a situation.","nodes":[{"id":"admin","col":1,"row":1,"icon":"🛠️","label":"Platform admin","sub":"Calls the API (no screen yet)"},{"id":"catalog","col":2,"row":1,"icon":"📚","label":"Table catalog","sub":"Finds every table with an organization"},{"id":"rows","col":3,"row":1,"icon":"🗄️","label":"Tenant's rows","sub":"Projects, videos, schedules, events…"},{"id":"file","col":4,"row":1,"icon":"📄","label":"Export file","sub":"JSON, secrets left out"},{"id":"suspend","col":1,"row":2,"icon":"⏸️","label":"Suspended tenant","sub":"Required before deletion"},{"id":"edge","col":2,"row":2,"icon":"📡","label":"Edge","sub":"Channels taken off air"},{"id":"people","col":3,"row":2,"icon":"👤","label":"People","sub":"Anonymized if only in this tenant"},{"id":"others","col":4,"row":2,"icon":"🏢","label":"Other tenants","sub":"Untouched"}],"scenarios":[{"name":"Export","steps":[{"at":"admin","state":"GET …/export","say":"A platform admin asks for the tenant's data."},{"at":"catalog","state":"finding tables","say":"The database catalog lists every table that carries an organization or tenant, so new tables are included automatically."},{"at":"rows","state":"reading","say":"All rows of the tenant's projects are read."},{"at":"file","state":"SUCCEEDED","say":"One JSON file. Credentials, hashes, webhook secrets, ad-tag URLs and queued email text are left out. Video files are not included."}]},{"name":"Delete","steps":[{"at":"suspend","state":"suspended","say":"The tenant is suspended first; then the admin types its exact name to confirm."},{"at":"edge","state":"ARCHIVED","say":"Its channels are taken off air: open players switch to the standby slate."},{"at":"rows","state":"deleting","say":"Rows are deleted children-first in one transaction, so it either all happens or nothing does.","tech":"Order comes from the foreign keys."},{"at":"people","state":"anonymized","say":"People who only belonged to this tenant are anonymized, not deleted, because audit records elsewhere may name them."},{"at":"others","state":"SUCCEEDED","say":"Other tenants are untouched; the action is recorded in the platform audit log.","tech":"Not yet: removing copies already on R2 edge storage."}]},{"name":"Safety checks","steps":[{"at":"admin","state":"POST …/delete","say":"Someone tries to delete a tenant that is still active, or
