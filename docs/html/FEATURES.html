<script>
const DATA = {"product":"FAST Studio","intro":"What each finished feature does, who can use it and how, with screenshots of the real screens. Screenshots are re-taken from the running demo by `npm run docs:shots` (frontend), so they follow the UI; the page is rebuilt by `node tools/build-feature-docs.mjs`. See .claude/skills/feature-docs/SKILL.md.","accounts":{"owner":"Asha Rao","operator":"Ravi Menon","analyst":"Lena Fischer","partner":"Sam Lee","platform":"Platform Admin"},"features":[{"id":"personal-access-tokens","title":"Personal access tokens (API tokens for scripts and MCP)","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Anyone can create long-lived tokens on their profile so a script or an AI assistant (an MCP client) can work as them without their password. Each token works in one place, as at most the role chosen for it, and never more than its owner may do now. Expiry is chosen per token: 7, 30, 90 or 365 days, a custom number of days, or none.","who":["Every signed-in person, in every role","Customer roles: Owner to Read-only","Partner roles: Partner admin, Partner viewer","Platform administrators: platform-scope tokens"],"steps":["Open your profile (your name, top right) and choose the API Tokens tab.","Give the token a name that says what uses it, e.g. \"Claude desktop (read-only)\".","Choose where it works: one of your organizations, or Platform administration (platform administrators only).","Choose the most it may do. Only your own role and lower ones are offered; Read-only is the default.","Choose when it expires, or No expiry.","Create it and copy the token straight away: it starts with fsp_ and is shown only once.","Use it as the header Authorization: Bearer fsp_… in the script or MCP client. Revoke it on the same tab when it is no longer needed."],"rules":["Only a SHA-256 fingerprint of the token is stored; the token itself is shown once.","Every call is checked again: a revoked or expired token, a removed membership or a lowered role takes effect at once.","A token never does more than the role chosen for it or the owner's current role (the permissions are the intersection).","Organization tokens reach only that organization's API (/api/orgs/{org}/…; partners also /api/partners/{partner}/…). Platform tokens reach only /api/platform/…. All can read GET /api/auth/me.","Tokens can't change passwords or create, list or revoke tokens.","Tokens are 256-bit random values, so they can't be guessed. Bad tokens are logged per client address for monitoring, but never block valid tokens (one old script retrying a revoked token must not lock out a whole office).","Creating and revoking tokens is recorded in the organization's (or platform's) audit trail.","There is no FAST Studio MCP server yet: MCP clients need a server that calls this API with the token."],"api":[{"text":"GET /api/auth/personal-tokens","link":"API.html#ep-get-api-auth-personal-tokens"},{"text":"POST /api/auth/personal-tokens {name, org (id, slug or \"platform\"), role, expiresInDays (null = no expiry)}","link":"API.html#ep-post-api-auth-personal-tokens"},{"text":"DELETE /api/auth/personal-tokens/{id}","link":"API.html#ep-delete-api-auth-personal-tokens-id"},{"text":"Any allowed API call with Authorization: Bearer fsp_…","link":null}],"tests":["backend: PersonalTokenTest","frontend: e2e/tokens.spec.ts"],"docs":["docs/PARTNER_ACCESS_AND_TOKENS.md","docs/SECURITY_AND_RIGHTS.md"],"screenshots":[{"id":"pat-tab","account":"owner","path":"/aurora","caption":"The API Tokens tab: name, where it works, the most it may do (your role or lower) and the expiry.","src":"../features/img/personal-access-tokens--pat-tab.png","exists":true,"width":920,"height":860},{"id":"pat-created","account":"owner","path":"/aurora","caption":"Right after creating: the token is shown once to copy (hidden in this picture). Here it was made with No expiry.","src":"../features/img/personal-access-tokens--pat-created.png","exists":true,"width":920,"height":860},{"id":"pat-platform","account":"platform","path":"/platform","caption":"A platform administrator can make platform-scope tokens for /api/platform/….","src":"../features/img/personal-access-tokens--pat-platform.png","exists":true,"width":920,"height":844},{"id":"pat-partner","account":"partner","path":"/","caption":"Partner members choose partner roles (Partner admin or Read-only partner viewer) for the partner API.","src":"../features/img/personal-access-tokens--pat-partner.png","exists":true,"width":920,"height":860}],"howItWorks":["Creating: 32 random bytes become the token (fsp_ + Base64). Only its SHA-256 fingerprint, the scope (organization, or none for platform), the role ceiling and the expiry are saved; the token itself is returned once.","Using: when a request carries Authorization: Bearer fsp_…, the security filter fingerprints it, finds the row, checks it is neither revoked nor expired and that the owner still belongs to that organization (or is still a platform administrator).","It then mints an ordinary 10-minute signed sign-in token (JWT) in memory, with only that organization and the narrowed role, and the request continues exactly like a normal signed-in call: organization-in-path check, database membership check and row-level security all apply.","Narrowing: permissions = what the chosen role allows AND what the owner's current role (including custom roles) allows; the role is the lower of the two. A demotion or removal therefore applies to the very next call.","Fencing: a web rule lets organization tokens reach only /api/orgs/… (partners also /api/partners/…), platform tokens only /api/platform/…, and every token GET /api/auth/me. Account endpoints (password, tokens) are never reachable with a token.","Revoking sets revoked_at; the server forgets its cached \"still valid\" answer at once."],"optimizations":["Lookup is one probe on a unique index (token_hash); the secret is never compared character by character, so there is no timing leak.","last_used_at is written at most once a minute per token, so a busy script doesn't turn every read into a database write.","The \"is this token still valid\" check on the minted sign-in token is cached for 30 seconds per server, like the existing sign-in version check.","Nothing is stored per call: no sessions, no saved access tokens. Servers stay stateless and interchangeable.","The profile tab loads one list request only when it is opened (the screen code itself is downloaded on demand).","Each person may keep at most 25 active tokens, which keeps the table and the list small."],"scale":["Per call the exchange costs about four small indexed queries and one ES256 signature (well under a millisecond of CPU). That is comfortable for scripts and AI assistants making tens to hundreds of calls a second per server.","Any number of servers can serve tokens: all state is in PostgreSQL and nothing is tied to one server.","Bad tokens cost one indexed lookup and are logged per client address in the shared database; a 256-bit token can't be guessed, so valid tokens are never blocked by an address's failures.","Known ceiling: a single token driving thousands of calls a second pays the exchange on every call. Upgrade path: cache the minted sign-in token per token fingerprint for its 10-minute life, keyed on the owner's token version and cleared on revoke.","Revocation is immediate on the server that handled it and within 30 seconds on other servers (the shared validity cache). Use \"sign out everywhere\" or a role change for an instant stop everywhere."]},{"id":"sign-in-protection","title":"Sign-in protection and security headers","area":"Account & security","status":"Built","completed":"2026-11-01","summary":"Limits on guessing passwords, reset emails and partner credentials, shared by every server; outbound address checks on ad servers and remote media including redirects; ad-tag URLs encrypted at rest; browser security headers. Nothing to click: it works in the background.","who":["Everyone, automatically"],"steps":["After 5 wrong passwords for one account within 5 minutes, that account waits a few minutes (\"Too many attempts\").","After 20 failed sign-ins from one address within 15 minutes (many accounts), that address waits.","One address can request at most 10 password-reset emails an hour; each account gets at most 3 an hour.","Partner client-credential guessing is limited per address the same way (20 failures per 15 minutes). Bad personal tokens are logged per address but never block valid ones."],"rules":["Limits are stored in the database (auth_attempt), so they hold across restarts and several servers; emails are stored only as hashes.","Behind a proxy the visitor's address is taken from X-Forwarded-For only when the proxy is on a private network.","Ad-server and remote media addresses must be public http(s) hosts; every redirect hop is checked too.","Ad-tag URLs are encrypted (AES-GCM) in the database; older plaintext rows are encrypted at start-up.","Pages send Content-Security-Policy (only the app's own scripts, no framing), Referrer-Policy and Permissions-Policy."],"api":[{"text":"429 RATE_LIMITED on POST /api/auth/login, /api/auth/token, /api/auth/forgot and /oauth/token","link":null}],"tests":["backend: SecurityHardeningTest, PublicUrlTest"],"docs":["docs/SECURITY_AND_RIGHTS.md"],"screenshots":[],"howItWorks":["Each counted event (a wrong password, a reset-email request, a bad partner secret or personal token) adds one row to auth_attempt with a bucket such as login-email:<hash> or login-ip:<address>.","Before the check runs, the server counts that bucket's rows in its time window; at the limit it answers 429 \"Too many attempts\" without checking the password. A successful sign-in clears the account's bucket.","Outbound addresses (ad servers, VAST wrappers, creative and remote video files) are resolved and refused when they point at a private, loopback, link-local, carrier-grade-NAT or other non-public network. Redirects are followed one hop at a time and each hop is checked again; for remote video the final address is resolved before ffmpeg starts.","Ad-tag URLs are sealed with AES-256-GCM before saving and opened only when an ad waterfall is built; rows saved before encryption are sealed automatically at start-up.","Every page carries a Content-Security-Policy that allows only the app's own scripts and forbids framing, plus Referrer-Policy and Permissions-Policy."],"optimizations":["One composite index (bucket, created_at) makes every limit check a short index range scan.","Only failures are counted for sign-in, so normal users add no rows; emails are stored as SHA-256 hashes (no personal data in the table).","An hourly job deletes rows older than a day, so the table stays small however long the system runs.","Inside the security filter the token limit uses a non-throwing check, so an over-limit request is a clean 401 instead of an error page.","Redirect checking reuses one HTTP client per source (connection pooling) and stops after 5 hops.","AES-GCM decryption of an ad tag takes microseconds and happens only when the waterfall is read."],"scale":["A sign-in adds two indexed counts (and two inserts only when it fails). That is tiny next to the deliberate cost of checking a password hash (bcrypt, tens of milliseconds), so the limiter is never the bottleneck.","Limits are shared by every server through PostgreSQL and survive restarts, so scaling out doesn't loosen them.","Behind a load balancer the real visitor address is used (X-Forwarded-For from private-network proxies only), so one busy proxy doesn't lock everyone out and visitors can't fake their address.","Known ceiling: a very large credential-stuffing attack (millions of attempts an hour) would still reach the application and the database. Block such floods earlier with Cloudflare rate limiting or WAF rules in front; this database limiter is the second line.","DNS rebinding between the address check and the actual connection is not yet prevented; the upgrade is an HTTP client that connects only to the checked address."]},{"id":"tenant-isolation","title":"Tenant isolation in the database","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Each customer only ever sees its own data, and the database itself enforces it: even a bug in the application can't read or change another customer's rows. Work that must span customers (background jobs, platform administration) runs through a separate, tightly held database login. Nothing to click: it applies to every screen and API.","who":["Everyone, automatically"],"steps":["Every project API path names the organization (/api/orgs/{organization}/…); platform tenant routes name the tenant (/api/platform/tenants/{tenant}/…).","The sign-in token carries the organization (org) and its tenant (tid); the organization in the path must be one the token lists and the person belongs to, otherwise the answer is 404.","Every database query of a project names that organization, and the database adds its own check on top."],"howItWorks":["Requests use a database login (faststudio_app_login) that may only see rows of the organization stamped on its connection. It is not the table owner and cannot switch to any other role.","Each borrowed connection is stamped with the current organization (app.org_id); PostgreSQL row-level security policies compare every row's organization with it. An unfiltered \"select * from asset\" returns only that project's videos, and inserting a row for another organization fails.","Cross-tenant system work (platform administration, media jobs, alert scans, edge publishing, partner client sign-in) gets its connection from a separate pool that logs in as faststudio_system_login. The policies trust that login, identified by session_user, which a request connection cannot become.","Both logins are created and kept up to date after every database migration; their passwords are derived from the server's secrets key, so every server sharing the key uses the same ones and nothing extra is configured.","Every table that carries an organization has a policy; organization and membership (they establish the tenant), personal tokens (they belong to a person) and the platform email outbox are deliberately outside, and a test fails if any other table is missing one.","In the code, every SQL statement on a tenant table also names the organization explicitly (or is marked as deliberate cross-tenant system work); a CI check enforces this."],"optimizations":["The organization is stamped once per connection checkout with one tiny statement; no per-query overhead in the application.","Policies are simple equality checks on org_id, which the tenant-first indexes serve directly, so row-level security adds no extra table reads.","System work and requests use separate connection pools (10 each per server; the system pool also serves viewer session lookups and platform administration), so a burst of background work can't take every request connection."],"scale":["All projects share one database, so adding a customer costs one row, not a database. Isolation does not weaken with more customers: every query is filtered by organization in the database itself.","Indexes on large tables lead with org_id, so one project's queries read only its own slice however large other projects grow.","Known ceiling: one PostgreSQL server for all tenants. Upgrade path, in order: connection pooling (PgBouncer), read replicas for reports, then sharding by tenant (e.g. Citus) without changing the application. A dedicated database for one tenant is possible when a contract requires it.","Not measured: behaviour under sustained multi-tenant load."],"rules":["A request connection that tries \"set role\" to the system role is refused; \"reset role\" leaves it as the same restricted login.","The old app.bypass session switch no longer exists; setting it changes nothing.","The configured database user only migrates and must be allowed to create roles (CREATEROLE)."],"api":[],"tests":["RowLevelSecurityTest (7, production logins)","CrossTenantMatrixTest","tools/check-tenant-filters.mjs (CI)"],"docs":["docs/MULTITENANCY.md","migration V18__system_login_and_rls_coverage.sql"],"screenshots":[]},{"id":"project-limits","title":"Per-project limits","area":"Multi-tenancy","status":"Built","completed":"2026-11-01","summary":"Every project has a fair share: a cap on API requests per minute, on stored video hours and on videos converting at once, so one busy project can't slow everyone else down. Platform administrators set the limits per plan, tenant or project.","who":["Platform administrators set the limits","Every project is held to them"],"steps":["Platform administration → Tenants → Manage <tenant>: under Custom properties, set \"API requests per minute\", \"Stored media hours\" or \"Videos converting at the same time\". Configuration scope \"Tenant defaults\" applies to all its projects; choose a project to override it for that project only.","Leave a value at the global default (6000 requests, 500 hours, 20 conversions), or use 0 for unlimited.","A project over a limit gets a clear message: \"made more than N requests in a minute\", \"already stores its limit of N hours\", or \"N videos are already converting\"."],"howItWorks":["The limits are ordinary configuration properties (limits.api_requests_per_minute, limits.media_hours, limits.processing_videos): global default, then tenant value, then project override.","API requests are counted per project in one-minute windows as soon as the project of a request is known; over the limit the answer is 429.","Before an upload, a generated sample, a direct upload or a library sync, the project's stored hours (all videos except archived ones) are compared with its limit; before starting a conversion, the number of videos converting is compared with its limit; over either the answer is 409."],"optimizations":["Each project's limits are read at most ary":"When a customer asks for its data or leaves, a platform administrator can export everything the tenant owns as one file, and then delete the tenant permanently, without touching any other customer.","who":["Platform administrators"],"steps":["Export: call GET /api/platform/tenants/{tenant}/export (a platform personal access token works). The answer is a JSON file with the tenant, its projects, members and every table's rows.","Delete: first suspend the tenant (Platform administration → Tenants → Suspend).","Then call POST /api/platform/tenants/{tenant}/delete with {\"confirm\": \"<the tenant's exact name>\"}. The answer lists how many rows were deleted per table.","There is no screen for these two actions yet; they are API only."],"howItWorks":["The tables to export and delete are found from the database catalog: every table with an org_id, owner_org_id, partner_org_id or tenant_id column. New tables are covered without code changes.","Export leaves out credentials, hashes and unredacted mail (token ids and secrets, webhook secrets, ad-tag URLs, password and token hashes, queued email text).","Deletion runs in one transaction: channels are taken off the edge (a final ARCHIVED snapshot, so open players show the standby slate), references between the tenant's own tables are cleared, rows are deleted children-first using the foreign keys, projects and the tenant are removed.","People who belonged only to this tenant are anonymized (email, name and password replaced; sign-in tokens and personal tokens removed), not deleted, because audit records elsewhere may name them. People who also belong to another tenant keep their account.","Local video and upload folders of the deleted projects are removed; both actions are recorded in the platform audit log."],"optimizations":["One query per table, filtered by the tenant's organizations with = any(array), so each table is read or deleted with one index-assisted statement.","No hand-kept table list to fall out of date."]," const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const list = (items, tag = 'ul') => items && items.length ? `<${tag}>${items.map(i => `<li>${md(i)}</li>`).join('')}</${tag.split(' ')[0]}>` : '<p style="color:var(--muted);margin:0">None.</p>';
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const api = a => a.link ? `<a href="${esc(a.link)}" title="Open in the API reference"><code>${esc(a.text)}</code> ↗</a>` : `<code>${esc(a.text)}</code>`;
const TABS = [['howItWorks', 'How it works'], ['optimizations', 'Optimizations'], ['scale', 'Under heavy load'], ['rules', 'Rules and limits'], ['api', 'API'], ['tests', 'Tests'], ['docs', 'More detail']];

document.getElementById('intro').innerHTML = md(DATA.intro);
const SHOTS = [];   // every picture, for the zoom's previous/next
let nav = '', main = '', area = '';
for (const f of DATA.features) {
  if (f.area !== area) { area = f.area; nav += `<div class="area" data-area="${esc(area)}">${esc(area)}</div>` }
  nav += `<a href="#${esc(f.id)}" data-id="${esc(f.id)}">${esc(f.title)}</a>`;
  const tabs = TABS.filter(([k]) => f[k] && f[k].length);
  const text = [f.title, f.summary, f.area, ...f.who, ...f.steps, ...f.howItWorks, ...f.optimizations, ...f.scale, ...f.rules, ...f.api.map(a => a.text)].join(' ').toLowerCase();
  main += `<article class="card" id="${esc(f.id)}" data-area="${esc(f.area)}" data-text="${esc(text)}">
    <h2>${esc(f.title)}</h2>
    <div class="meta"><span class="chip ok">${esc(f.status)}</span><span class="chip">${esc(f.area)}</span><span class="chip">Completed ${esc(f.completed)}</span></div>
    <p class="summary">${md(f.summary)}</p>
    <div class="glance"><div class="box"><h3>Who can use it</h3>${list(f.who)}</div><div class="box"><h3>How to use it</h3>${list(f.steps, 'ol class="steps"')}</div></div>
    ${f.screenshots.length ? `<div class="shots">${f.screenshots.map(s => {
      if (!s.exists) return `<figure><div class="missing">Screenshot not taken yet: run npm run docs:shots</div><figcaption>${md(s.caption)}</figcaption></figure>`;
      const i = SHOTS.push(s) - 1;
      return `<figure><button data-shot="${i}" aria-label="Enlarge: ${esc(s.caption)}"><img src="${esc(s.src)}" width="${s.width}" height="${s.height}" alt="${esc(s.caption)}" loading="lazy" decoding="async" style="aspect-ratio:${s.width}/${s.height}"></button><figcaption>${md(s.caption)}</figcaption></figure>`;
    }).join('')}</div>` : ''}
    <div class="tabs" role="tablist">${tabs.map(([k, l], n) => `<button role="tab" data-tab="${k}" class="${n ? '' : 'on'}">${l}</button>`).join('')}</div>
    <div class="panels">${tabs.map(([k], n) => `<div class="panel${k === 'scale' ? ' load' : ''}${n ? '' : ' on'}" data-panel="${k}">${k === 'api' ? `<ul>${f.api.map(a => `<li>${api(a)}</li>`).join('')}</ul>` : list(f[k])}</div>`).join('')}</div>
  </article>`;
}
document.getElementById('nav').innerHTML = nav;
document.getElementById('main').innerHTML = main;
document.getElementById('overview').innerHTML = DATA.features.map(f => `<a href="#${esc(f.id)}" data-id="${esc(f.id)}"><b>${esc(f.title)}</b><span>${esc(f.area)}</span></a>`).join('');
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from docs/features/features.json. ${DATA.features.length} features.`;

// search hides non-matching features instead of rebuilding the page, so nothing flickers or jumps
const articles = [...document.querySelectorAll('article')];
function filter(text) {
  const f = text.trim().toLowerCase();
  let shown = 0;
  for (const a of articles) {
    const hit = !f || a.dataset.text.includes(f);
    a.classList.toggle('hidden', !hit);
    document.querySelectorAll(`[data-id="${a.id}"]`).forEach(x => x.classList.toggle('hidden', !hit));
    shown += hit;
  }
  document.querySelectorAll('nav .area').forEach(h => h.classList.toggle('hidden', !articles.some(a => a.dataset.area === h.dataset.area && !a.classList.contains('hidden'))));
  document.getElementById('none').classList.toggle('hidden', shown > 0);
  document.getElementById('count').textContent = f ? `${shown} of ${articles.length}` : `${articles.length} features`;
}
filter('');
document.getElementById('q').addEventListener('input', e => filter(e.target.value));
document.getElementById('main').addEventListener('click', e => {
  const t = e.target.closest('.tabs button');
  if (t) {
    const art = t.closest('article');
    art.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === t));
    art.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.dataset.panel === t.dataset.tab));
    return;
  }
  const s = e.target.closest('button[data-shot]');
  if (s) show(+s.dataset.shot);
});
// the menu follows the reading position
const links = [...document.querySelectorAll('nav a')];
const obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.id === x.target.id)) }),
  { rootMargin: '-76px 0px -70% 0px' });
articles.forEach(a => obs.observe(a));
// zoom with previous/next and keyboard
const zoom = document.getElementById('zoom'), zimg = zoom.querySelector('img');
let cur = 0;
function show(i) {
  cur = (i + SHOTS.length) % SHOTS.length;
  zimg.src = SHOTS[cur].src; zimg.alt = SHOTS[cur].caption;
  document.getElementById('zcap').textContent = SHOTS[cur].caption;
  zoom.classList.add('on');
  document.getElementById('zprev').classList.toggle('hidden', SHOTS.length < 2);
  document.getElementById('znext').classList.toggle('hidden', SHOTS.length < 2);
}
const close = () => zoom.classList.remove('on');
document.getElementById('zclose').onclick = close;
document.getElementById('zprev').onclick = e => { e.stopPropagation(); show(cur - 1) };
document.getElementById('znext').onclick = e => { e.stopPropagation(); show(cur + 1) };
zoom.addEventListener('click', e => { if (e.target === zoom) close() });
document.addEventListener('keydown', e => {
  if (zoom.classList.contains('on')) { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') show(cur + 1); if (e.key === 'ArrowLeft') show(cur - 1); return }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus() }
});
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
</script>
