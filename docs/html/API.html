<script>
const DATA = {"title":"FAST Studio API","intro":"Everything the FAST Studio screens can do is also an HTTP API. This page explains each feature's endpoints in plain words and gives a ready curl for every one. Fill in your values once at the top (server address, token, IDs): every example on the page updates. Paste a curl into a terminal, or import it into Postman (Import → Raw text), or download the whole Postman collection.","auth":["Most endpoints need a token in the header `Authorization: Bearer <token>`.","Easiest for scripts, Postman and AI assistants: a **personal access token** (`fsp_…`). Make one on your profile (Profile and Settings → API Tokens) and paste it into the Token box above. It works only for the organization and role you chose, until it expires or you revoke it.","Alternatively sign in with email and password (`POST /api/auth/token`, below) and use the `access_token` from the answer; it lasts 10 minutes and the `refresh_token` gets a new one.","Project endpoints take the organization in the path: `/api/orgs/{org}/…`, where `{org}` is the project's short name (e.g. `aurora`) or its ID. You must be a member, and your token must be for that organization; otherwise the answer is 404.","Platform endpoints (`/api/platform/…`) are for platform administrators only and use IDs (UUIDs) for organizations and tenants.","Errors come back as JSON with a `code` and a plain `detail` message, for example 400 (invalid input), 403 (not allowed), 404 (not found or not yours), 409 (conflict, e.g. someone changed the schedule), 429 (too many requests)."],"variables":[{"key":"baseUrl","label":"Server address","value":"http://localhost:8080","help":"Where FAST Studio runs"},{"key":"token","label":"Token","value":"fsp_PASTE_YOUR_TOKEN","help":"Personal access token (fsp_…) or an access token","secret":true},{"key":"org","label":"Project (org)","value":"aurora","help":"Short name or ID of your project"},{"key":"channelId","label":"Channel ID","value":"PASTE-CHANNEL-ID","help":"From List channels"},{"key":"channelSlug","label":"Channel short name","value":"PASTE-CHANNEL-SLUG","help":"The channel slug, for viewer playback"},{"key":"assetId","label":"Video (asset) ID","value":"PASTE-ASSET-ID","help":"From List videos"},{"key":"orgId","label":"Organization ID (platform)","value":"PASTE-ORG-ID","help":"UUID, from Project details or List organizations"},{"key":"tenant","label":"Tenant ID (platform)","value":"PASTE-TENANT-ID","help":"From List tenants"},{"key":"project","label":"Project ID (platform)","value":"PASTE-PROJECT-ID","help":"UUID of a project of that tenant"},{"key":"partner","label":"Partner (org)","value":"partner-tv","help":"Short name or ID of a partner organization"},{"key":"partnerOrgId","label":"Partner organization ID","value":"PASTE-PARTNER-ORG-ID","help":"From Partner directory"},{"key":"owner","label":"Sharing customer","value":"aurora","help":"The customer that shares channels with the partner"},{"key":"campaignId","label":"Campaign ID","value":"PASTE-CAMPAIGN-ID","help":"From List campaigns"},{"key":"destinationId","label":"Destination ID","value":"PASTE-DESTINATION-ID","help":"From List destinations"},{"key":"linkId","label":"Partner share ID","value":"PASTE-LINK-ID","help":"From List partner shares"},{"key":"userId","label":"Member (user) ID","value":"PASTE-USER-ID","help":"From List members"},{"key":"sessionId","label":"Playback session ID","value":"PASTE-SESSION-ID","help":"From Start a viewing session"}],"categories":[{"id":"auth","title":"Sign-in and tokens","summary":"Getting a token, refreshing it, switching project, signing out, and managing your personal access tokens.","who":"Anyone with an account. Sign-in endpoints need no token.","endpoints":[{"method":"POST","path":"/api/auth/token","title":"Sign in (get a token)","auth":"none","description":"Email and password in, a 10-minute access token and a 30-day refresh token out. For scripts and partner systems; the browser uses /api/auth/login instead. Too many wrong passwords are slowed down (429).","body":{"email":"owner@aurora.test","password":"demo1234"},"route":{"query":[],"bodyType":"LoginRequest"}},{"method":"POST","path":"/api/auth/token/refresh","title":"Refresh the access token","auth":"none","description":"Gives a new access token and a new refresh token. The old refresh token stops working; reusing it signs out that sign-in everywhere (it was stolen).","body":{"refresh_token":"PASTE_REFRESH_TOKEN"},"route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/auth/token/switch","title":"Switch project","description":"A new access token for another organization you belong to. Personal access tokens can't switch: they are fixed to one organization.","body":{"org":"{{org}}"},"route":{"query":[],"bodyType":"SwitchRequest"}},{"method":"GET","path":"/api/auth/me","title":"Who am I","description":"The signed-in person, the active organization with its role and permissions, and the organizations you can switch to.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/auth/login","title":"Browser sign-in","auth":"none","description":"The screen's sign-in: puts the tokens in secure cookies instead of the answer. Scripts should use Sign in (get a token).","body":{"email":"owner@aurora.test","password":"demo1234"},"route":{"query":[],"bodyType":"LoginRequest"}},{"method":"POST","path":"/api/auth/logout","title":"Sign out","auth":"none","description":"Ends this sign-in (its refresh token). Always answers 204.","body":{"refresh_token":"PASTE_REFRESH_TOKEN"},"route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/auth/logout-all","title":"Sign out everywhere","description":"Ends every sign-in of yours on every device; access tokens stop working at once.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/auth/password","title":"Change password","description":"Needs the current password. Signs out other sign-ins.","body":{"currentPassword":"demo1234","newPassword":"a-new-long-password"},"route":{"query":[],"bodyType":"ChangePassword"}},{"method":"POST","path":"/api/auth/forgot","title":"Forgot password","auth":"none","description":"Emails a reset link if the address has an account. Always answers the same, so nobody can find out who has an account.","body":{"email":"owner@aurora.test"},"route":{"query":[],"bodyType":"ForgotRequest"}},{"method":"POST","path":"/api/auth/reset","title":"Reset password with the emailed code","auth":"none","description":"The token comes from the reset email link.","body":{"token":"PASTE_RESET_TOKEN","newPassword":"a-new-long-password"},"route":{"query":[],"bodyType":"ResetRequest"}},{"method":"GET","path":"/api/auth/options","title":"Sign-in options","auth":"none","description":"What the sign-in screen offers on this server (for example whether demo accounts are shown).","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/auth/demo-accounts","title":"Demo accounts","auth":"none","description":"The fictional demo people (demo mode only; empty in a pilot).","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/auth/csrf","title":"CSRF token (browsers only)","auth":"none","description":"Browsers using cookies need this value in an X-XSRF-TOKEN header for changes. Calls with a Bearer token don't.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/auth/personal-tokens","title":"List my personal access tokens","description":"Your active tokens: name, organization, role, last used and expiry. The secret itself is never shown again.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/auth/personal-tokens","title":"Create a personal access token","description":"Shown once in the answer (field token). org is a project short name or ID, or \"platform\" for platform administrators. role can't be higher than yours. expiresInDays: 1–3650, or leave it out for no expiry. Can't be called with a personal access token itself.","body":{"name":"Postman","org":"{{org}}","role":"ANALYST","expiresInDays":30},"route":{"query":[],"bodyType":"CreatePersonalToken"}},{"method":"DELETE","path":"/api/auth/personal-tokens/{id}","title":"Revoke a personal access token","params":{"id":"PASTE-TOKEN-ID"},"description":"Stops it at once. The id comes from List my personal access tokens.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/.well-known/jwks.json","title":"Public signing keys","auth":"none","description":"Lets other systems verify FAST Studio access tokens (ES256) without calling us.","route":{"query":[],"bodyType":null}}]},{"id":"project","title":"Project, settings and team","summary":"What the project is, its programming and media settings, configuration values, and who works in it.","who":"Members of the project. Changing settings and the team needs an owner or admin.","endpoints":[{"method":"GET","path":"/api/orgs/{org}/project-details","title":"Project details","description":"The project's identity (ID, name, tenant), your role and permissions, enabled features and limits. A good first call: it also tells you the organization ID.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/dashboard","title":"Dashboard","description":"The home screen numbers: channels on air, videos, upcoming schedule coverage, open alerts.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/settings","title":"Media and programming settings","description":"Enabled media types, default type, default premiere time and weekdays, personalized ads, and a revision number to send back when saving.","route":{"query":[],"bodyType":null}},{"method":"PUT","path":"/api/orgs/{org}/settings","title":"Save media and programming settings","description":"Send expectedRevision from the settings you read; if someone saved in between you get 409 and should reload.","body":{"enabledTypes":["MOVIE","EPISODE","SHORT","AD"],"defaultType":"MOVIE","premiereTime":"20:00","weekdays":[1,2,3,4,5,6,7],"personalizedAds":false,"expectedRevision":0},"route":{"query":[],"bodyType":"SettingsRequest"}},{"method":"POST","path":"/api/orgs/{org}/settings/viewer-key","title":"Set the viewer-context signing key","description":"Write-only key (32+ characters) your apps use to sign viewer context for personalized ads. Never returned.","body":{"key":"replace-with-a-random-key-of-at-least-32-characters"},"route":{"query":[],"bodyType":"ViewerKeyRequest"}},{"method":"GET","path":"/api/orgs/{org}/configuration","title":"Project configuration","description":"Connectors and properties as they apply to this project (global default → tenant → project override).","route":{"query":[],"bodyType":null}},{"method":"PUT","path":"/api/orgs/{org}/configuration/properties/{key}","title":"Override a property for this project","params":{"key":"programming.premiere_time"},"description":"Send {\"reset\": true} instead to go back to the inherited value.","body":{"value":"21:00"},"route":{"query":[],"bodyType":"Value"}},{"method":"PUT","path":"/api/orgs/{org}/configuration/connectors/{key}","title":"Switch a connector on or off for this project","params":{"key":"vast"},"description":"Only connectors the platform made available to your tenant. Switching off keeps existing media and credentials.","body":{"enabled":true},"route":{"query":[],"bodyType":"Enable"}},{"method":"GET","path":"/api/orgs/{org}/tenant-settings","title":"Tenant-wide settings","description":"Settings shared by all projects of your company (owners and admins).","route":{"query":[],"bodyType":null}},{"method":"PUT","path":"/api/orgs/{org}/tenant-settings/properties/{key}","title":"Set a tenant-wide property","params":{"key":"programming.weekdays"},"description":"Applies to every project of the tenant that doesn't override it.","body":{"value":"1,2,3,4,5"},"route":{"query":[],"bodyType":"Value"}},{"method":"GET","path":"/api/orgs/{org}/members","title":"List members","description":"People in the project with their roles.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/members/roles","title":"Roles you can give","description":"Built-in and custom roles, limited to those not higher than yours.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/members","title":"Invite a member","description":"Adds the person (creating the account if needed and emailing a temporary password). Roles: OWNER, ADMIN, CONTENT_MANAGER, CHANNEL_OPERATOR, AD_OPS, ANALYST.","body":{"email":"new.person@example.com","name":"New Person","role":"ANALYST"},"route":{"query":[],"bodyType":"InviteRequest"}},{"method":"PATCH","path":"/api/orgs/{org}/members/{userId}","title":"Change a member's role","description":"You can't give a role higher than your own; only owners manage owners.","body":{"role":"CONTENT_MANAGER"},"route":{"query":[],"bodyType":"RoleRequest"}},{"method":"DELETE","path":"/api/orgs/{org}/members/{userId}","title":"Remove a member","description":"The project always keeps at least one owner; you can't remove yourself.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/members/{userId}/password-reset","title":"Send a member a password reset","description":"Emails them a reset link.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/audit","title":"Activity log","query":{"limit":"50"},"description":"Who did what in the project, newest first.","route":{"query":[{"name":"limit","required":false}],"bodyType":null}}]},{"id":"library","title":"Video library","summary":"Videos (assets): list, create, upload, edit metadata and cue points, retry, archive, and sync from the connected video library.","who":"Content managers, admins and owners change videos; every member can read.","endpoints":[{"method":"GET","path":"/api/orgs/{org}/assets","title":"List videos","query":{"q":"","kind":"","archived":"false"},"description":"All videos with status, signed thumbnail/preview links, rights status and where they air. Filter with q (text), kind (MOVIE, EPISODE, SHORT, AD) or archived=true.","route":{"query":[{"name":"q","required":false},{"name":"kind","required":false},{"name":"archived","required":false}],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/assets/{id}","title":"One video","params":{"id":"{{assetId}}"},"description":"The same fields as the list, for one video.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/assets","title":"Create a video","description":"Creates the entry (status DRAFT) waiting for a file. With sampleSeconds the server generates a fictional demo clip instead (needs ffmpeg). Episodes need series, season and episode, unique in the project.","body":{"title":"Ocean Tales: Episode 1","description":"Pilot episode","kind":"EPISODE","genre":"Documentary","language":"en","series":"Ocean Tales","season":1,"episode":1},"route":{"query":[],"bodyType":"CreateRequest"}},{"method":"POST","path":"/api/orgs/{org}/assets/{id}/upload","title":"Upload the video file","params":{"id":"{{assetId}}"},"multipart":true,"description":"Multipart upload (field file): MP4, MOV, MKV, WEBM, M4V. The server converts it into 5-second segments in three qualities; status goes PROCESSING → READY. Limited by the project's stored hours and conversions at once (409).","route":{"query":[{"name":"file","required":true}],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/assets/{id}/upload-url","title":"Get a direct-upload address","params":{"id":"{{assetId}}"},"description":"A one-time https address to PUT the file to directly (connected video library). The file never passes through our server; when the library has it, conversion starts by itself.","route":{"query":[],"bodyType":null}},{"method":"PATCH","path":"/api/orgs/{org}/assets/{id}","title":"Edit metadata and cue points","params":{"id":"{{assetId}}"},"description":"Only the fields you send change. cuePoints are milliseconds; they snap to 5-second boundaries.","body":{"title":"Ocean Tales: Episode 1 (remastered)","genre":"Nature","cuePoints":[600000,1200000]},"route":{"query":[],"bodyType":"UpdateRequest"}},{"method":"POST","path":"/api/orgs/{org}/assets/{id}/retry","title":"Retry a failed conversion","params":{"id":"{{assetId}}"},"description":"Only for videos with status FAILED.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/assets/{id}/archive","title":"Archive a video","params":{"id":"{{assetId}}"},"description":"Hides it from the library (never a hard delete). Refused while it airs, is in a draft, is a channel's fallback or an active campaign's creative; the answer lists where.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/library/sync","title":"Sync from the connected library","description":"Imports every ready video of the connected library not imported yet; re-running adds nothing twice. Needs the library-sync feature for your project.","route":{"query":[],"bodyType":null}}]},{"id":"rights","title":"Rights and availability","summary":"Where and when each video may be shown, and checking a country and time before scheduling.","who":"Content managers, admins and owners set rights; members can check.","endpoints":[{"method":"PUT","path":"/api/orgs/{org}/assets/{id}/rights","title":"Set a video's rights","params":{"id":"{{assetId}}"},"description":"Allowed and blocked countries (2-letter codes, WW = worldwide), licence window and whether ads may run. Blank allowed countries means incomplete rights, never worldwide.","body":{"allowedCountries":["IN","GB","US"],"blockedCountries":[],"validFrom":"2026-11-01T00:00:00Z","validUntil":"2027-10-31T23:59:59Z","adsAllowed":true,"notes":"Licence #123"},"route":{"query":[],"bodyType":"RightsRequest"}},{"method":"POST","path":"/api/orgs/{org}/rights/check","title":"Can it play there and then?","description":"Checks one video for a country and time (optionally on a channel). The country is your input, not a location lookup.","body":{"assetId":"{{assetId}}","country":"IN","minutes":60},"route":{"query":[],"bodyType":"CheckRequest"}}]},{"id":"channels","title":"Channels","summary":"24/7 linear channels: create, edit, go live, stop, archive.","who":"Channel operators, admins and owners change channels; every member can read.","endpoints":[{"method":"GET","path":"/api/orgs/{org}/channels","title":"List channels","description":"Every channel with what is on now and next, its published version and how far ahead it is scheduled.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/channels/{id}","title":"One channel","params":{"id":"{{channelId}}"},"description":"The same as the list, for one channel, including readiness to go live.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/channels","title":"Create a channel","description":"Name and territories are the essentials. Optionally pass assetIds and autofillHours to start with a filled schedule. Limited by your plan's channel allowance.","body":{"name":"Ocean TV","description":"Nature documentaries","genre":"Documentary","language":"en","timezone":"Asia/Kolkata","territories":["IN","GB"],"adSecondsPerHour":360,"breakSeconds":90},"route":{"query":[],"bodyType":"CreateRequest"}},{"method":"PATCH","path":"/api/orgs/{org}/channels/{id}","title":"Edit a channel","params":{"id":"{{channelId}}"},"description":"Only the fields you send change. clearFallback: true removes the fallback video.","body":{"description":"Nature and ocean documentaries","adSecondsPerHour":300},"route":{"query":[],"bodyType":"UpdateRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/go-live","title":"Go live","params":{"id":"{{channelId}}"},"description":"Starts streaming the published schedule. Refused until the channel is ready (published schedule, ready videos).","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/stop","title":"Stop streaming","params":{"id":"{{channelId}}"},"description":"T ly","params":{"id":"{{channelId}}"},"description":"Fills the next hours with ready videos (all, or the assetIds you pass), with ad breaks. replace: true starts from empty.","body":{"expectedRevision":0,"hours":24,"replace":false},"route":{"query":[],"bodyType":"AutofillRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/schedule/close-gaps","title":"Close gaps","params":{"id":"{{channelId}}"},"description":"Moves later entries up so there is no dead air between programmes.","body":{"expectedRevision":0},"route":{"query":[],"bodyType":"RevisionRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/schedule/clear","title":"Clear the draft","params":{"id":"{{channelId}}"},"description":"Empties the future part of the draft. The published schedule is unchanged until you publish.","body":{"expectedRevision":0},"route":{"query":[],"bodyType":"RevisionRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/schedule/publish","title":"Publish","params":{"id":"{{channelId}}"},"description":"Makes the draft the live schedule as a new version. Refused (422) with the list of problems if it has errors (rights, missing videos, overlaps).","body":{"expectedRevision":0,"note":"November line-up"},"route":{"query":[],"bodyType":"PublishRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/schedule/restore","title":"Restore an older version into the draft","params":{"id":"{{channelId}}"},"description":"Copies published version N into the draft; publish to make it live again.","body":{"expectedRevision":0,"versionNumber":1},"route":{"query":[],"bodyType":"RestoreRequest"}},{"method":"GET","path":"/api/orgs/{org}/channels/{id}/epg","title":"Programme guide (JSON)","params":{"id":"{{channelId}}"},"query":{"hours":"24"},"description":"The published schedule as viewers see it: titles, times, descriptions.","route":{"query":[{"name":"from","required":false},{"name":"hours","required":false}],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/channels/{id}/epg.xml","title":"Programme guide (XMLTV)","params":{"id":"{{channelId}}"},"description":"The same guide in XMLTV format, which TV platforms import.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/channels/{id}/avails","title":"Ad break inventory","params":{"id":"{{channelId}}"},"description":"Upcoming ad breaks with their length and checks (markers, rights) for ad sales.","route":{"query":[],"bodyType":null}}]},{"id":"programming","title":"Smart programming","summary":"Rules that schedule a series by themselves: premiere a new episode on chosen weekdays, repeats, season roll-over and loops.","who":"Channel operators, admins and owners.","endpoints":[{"method":"GET","path":"/api/orgs/{org}/channels/{id}/programming","title":"List rules","params":{"id":"{{channelId}}"},"description":"The channel's series rules and what they planned.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/programming/preview","title":"Preview a rule","params":{"id":"{{channelId}}"},"description":"Shows which episodes would air when, without saving anything.","body":{"series":"Slow Roads","startDate":"2026-11-02","endDate":"2026-11-30","premiereTime":"20:00","repeatTime":"23:00","weekdays":[1,3,5],"startSeason":1,"startEpisode":1,"loop":false},"route":{"query":[],"bodyType":"RuleRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{id}/programming","title":"Create a rule","params":{"id":"{{channelId}}"},"description":"Saves the rule; generate then writes its episodes into the draft schedule.","body":{"series":"Slow Roads","startDate":"2026-11-02","endDate":"2026-11-30","premiereTime":"20:00","repeatTime":"23:00","weekdays":[1,3,5],"startSeason":1,"startEpisode":1,"loop":false},"route":{"query":[],"bodyType":"RuleRequest"}},{"method":"PUT","path":"/api/orgs/{org}/channels/{id}/programming/{ruleId}","title":"Pause or resume a rule","params":{"id":"{{channelId}}","ruleId":"PASTE-RULE-ID"},"descr s next break, and why.","body":{"channelId":"{{channelId}}","country":"IN"},"route":{"query":[],"bodyType":"SimulateRequest"}}]},{"id":"distribution","title":"Distribution and partners","summary":"Where channels are delivered (destinations), publishing to them, and sharing channels with partner TV platforms.","who":"Channel operators, admins and owners (sharing: owners and admins).","endpoints":[{"method":"GET","path":"/api/orgs/{org}/destinations","title":"List destinations","description":"Your web player and partner TV platforms, with ad mode and marker format.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/destinations","title":"Add a destination","description":"adMode SSAI (ads stitched in), SGAI (player inserts) or PASSTHROUGH; markerFormat DATERANGE or CUE_OUT.","body":{"name":"Partner TV app","kind":"PARTNER_TV","adMode":"SSAI","markerFormat":"DATERANGE","maxAdSecondsPerHour":480,"notes":""},"route":{"query":[],"bodyType":"DestinationRequest"}},{"method":"POST","path":"/api/orgs/{org}/channels/{channelId}/distribute/{destinationId}","title":"Publish a channel to a destination","description":"Runs the delivery checks (live, 6 hours scheduled, EPG, ad load, markers) and records the result. Partner deliveries are simulated in this prototype.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/partners","title":"List partner shares","description":"Which partners see which channels and what they may read.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/api/orgs/{org}/partners/directory","title":"Partner directory","description":"Partner organizations you can share with.","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/api/orgs/{org}/partners","title":"Share channels with a partner","description":"Scopes: channels:read, epg:read, stream:read, breaks:read, delivery:read. allChannels: true includes future channels. The partner admins get an email to accept.","body":{"partnerOr ID"},"description":"Its tokens stop working within seconds.","route":{"query":[],"bodyType":null}}]},{"id":"viewer","title":"Playback (viewers and players)","summary":"Starting a viewing session for a live channel, ad decisions and beacons, and signed media files. Used by players; no sign-in.","who":"Public: anyone who can reach the channel. Everything is bound to the session's channel.","endpoints":[{"method":"POST","path":"/play/sessions","title":"Start a viewing session","auth":"none","description":"org and channel are short names; country is where the viewer is (2 letters). The answer has sessionId and playlistUrl: open that in any HLS player. A destinationId chooses ad mode; viewerToken carries signed viewer context for personalized ads.","body":{"org":"{{org}}","channel":"{{channelSlug}}","country":"IN"},"route":{"query":[],"bodyType":"StartRequest"}},{"method":"GET","path":"/play/{session}/info","title":"Session info","auth":"none","params":{"session":"{{sessionId}}"},"description":"What is on now and next for this session, and whether it may play in the viewer's country.","route":{"query":[],"bodyType":null}},{"method":"GET","path":"/play/{session}/decisions/{breakId}","title":"Ads for a break","auth":"none","params":{"session":"{{sessionId}}","breakId":"PASTE-BREAK-ID"},"description":"Which ads fill this break for this viewer (SGAI players ask this; with SSAI the stream already contains them).","route":{"query":[],"bodyType":null}},{"method":"POST","path":"/play/{session}/beacons","title":"Report ad progress","auth":"none","params":{"session":"{{sessionId}}"},"description":"event: IMPRESSION, FIRST_QUARTILE, MIDPOINT, THIRD_QUARTILE, COMPLETE. Each is counted once.","body":{"breakId":"PASTE-BREAK-ID","campaignId":"{{campaignId}}","event":"IMPRESSION"},"route":{"query":[],"bodyType":"Beacon"}},{"method":"POST","path":"/play/{session}/privacy/contextual","title":"Viewer opts out of personalized ads","auth":"none","params":{"session":"{{sessionId}}"},"descript const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
const DEFAULTS = Object.fromEntries(DATA.variables.map(v => [v.key, v.value]));
let values = { ...DEFAULTS };
try { Object.assign(values, JSON.parse(store.get('fs-api-values') || '{}')) } catch {}
// path variables the page fills in by name; endpoints can override ({id}, {key}, …) in "params"
const PATH = { org: '{{org}}', orgId: '{{orgId}}', tenant: '{{tenant}}', project: '{{project}}', partner: '{{partner}}', owner: '{{owner}}',
  channelId: '{{channelId}}', destinationId: '{{destinationId}}', linkId: '{{linkId}}', userId: '{{userId}}', session: '{{sessionId}}' };

function fill(text, postman) { return String(text).replace(/\{\{(\w+)\}\}/g, (m, k) => postman || !(k in values) ? m : values[k]) }
function url(ep, postman) {
  let p = ep.path.replace(/\{(\w+)\}/g, (m, k) => (ep.params && ep.params[k]) || PATH[k] || m);
  const q = Object.entries(ep.query || {}).filter(([, v]) => v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  return fill('{{baseUrl}}' + p + (q ? '?' + q : ''), postman);
}
const sq = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
function curl(ep, postman) {
  const lines = [`curl -X ${ep.method} ${sq(url(ep, postman))}`];
  if (ep.auth === 'basic') lines.push(`-u ${sq('CLIENT_ID:CLIENT_SECRET')}`);
  else if (!ep.auth || ep.auth === 'bearer') lines.push(`-H ${sq('Authorization: Bearer ' + fill('{{token}}', postman))}`);
  if (ep.form) for (const [k, v] of Object.entries(ep.form)) lines.push(`--data-urlencode ${sq(k + '=' + v)}`);
  if (ep.multipart) lines.push(`-F ${sq('file=@/path/to/video.mp4')}`);
  if (ep.body) { lines.push(`-H ${sq('Content-Type: application/json')}`); lines.push(`--data-raw ${sq(fill(JSON.stringify(ep.body, null, 2), postman))}`) }
  return lines.join(' \\\n  ');
}
function params(ep) {
  const rows = [];
  for (const m of ep.path.matchAll(/\{(\w+)\}/g)) { const v = (ep.params && ep.params[m[1]]) || PATH[m[1]]; rows.push(['path', m[1], v ? v.replace(/\{\{(\w+)\}\}/, '$1 (your value)') : 'see description']) }
  for (const q of ep.route.query) rows.push(['query', q.name, q.required ? 'required' : 'optional' + (ep.query && ep.query[q.name] ? ', e.g. ' + ep.query[q.name] : '')]);
  return rows.length ? `<table><tr><th>Where</th><th>Name</th><th>Value</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}</table>` : '';
}
const authText = { none: 'No token needed.', basic: 'HTTP Basic with the API client id and secret.', webhook: 'Signed by the sender (no token).' };

function renderVars() {
  document.getElementById('vars').innerHTML = DATA.variables.map(v => `<label>${esc(v.label)}<input data-k="${esc(v.key)}" value="${esc(values[v.key])}" ${v.secret ? 'type="password" autocomplete="off"' : ''} spellcheck="false" title="${esc(v.help)}" placeholder="${esc(v.help)}"></label>`).join('');

}
const EPS = [];
function render(filter = '') {
  const f = filter.trim().toLowerCase();
  const nav = document.getElementById('nav'), main = document.getElementById('main');
  let html = '', links = '', total = 0;
  EPS.length = 0;
  for (const c of DATA.categories) {
    const eps = c.endpoints.filter(e => !f || (e.method + ' ' + e.path + ' ' + e.title + ' ' + e.description + ' ' + c.title).toLowerCase().includes(f));
    if (!eps.length) continue;
    total += eps.length;
    links += `<a href="#${c.id}">${esc(c.title)}<span>${eps.length}</span></a>`;
    html += `<section class="cat" id="${c.id}"><h2>${esc(c.title)}</h2><p class="muted" style="margin:0 0 4px">${md(c.summary)}</p><div class="who">Who: ${md(c.who)}</div>`;
    for (const e of eps) {
      const i = EPS.push(e) - 1;
      html += `<details class="ep" ${f ? 'open' : ''}><summary><span class="m ${e.method}">${e.method}</span><span class="path">${esc(e.path)}</span>${e.danger ? '<span class="tag danger">cannot be undone</span>' : ''}<span class="t">${esc(e.title)}</span></summary>
        <div class="body"><p>${md(e.description)}</p><p class="muted">${authText[e.auth] || 'Needs a token (Authorization: Bearer …).'}</p>${params(e)}
        ${e.noExample ? '' : `<div class="curl"><button data-copy="${i}">Copy</button><pre data-i="${i}" style="margin:0;white-space:pre-wrap"></pre></div>`}</div></details>`;
    }

  }
  nav.innerHTML = links;
  main.innerHTML = html || '<div class="panel empty">No endpoint matches. Try another word.</div>';

  spy();
}
function collection() {
  const item = e => {
    const raw = url(e, true), [base, qs] = raw.split('?');
    const r = { method: e.method, header: [], url: { raw, host: ['{{baseUrl}}'], path: base.replace('{{baseUrl}}', '').split('/').filter(Boolean),
      query: qs ? qs.split('&').map(p => { const [k, v] = p.split('='); return { key: k, value: decodeURIComponent(v) } }) : [] } };
    if (e.auth === 'none' || e.auth === 'webhook') r.auth = { type: 'noauth' };
    if (e.auth === 'basic') r.auth = { type: 'basic', basic: [{ key: 'username', value: 'CLIENT_ID' }, { key: 'password', value: 'CLIENT_SECRET' }] };
    if (e.body) { r.header.push({ key: 'Content-Type', value: 'application/json' }); r.body = { mode: 'raw', raw: JSON.stringify(e.body, null, 2), options: { raw: { language: 'json' } } } }
    if (e.form) r.body = { mode: 'urlencoded', urlencoded: Object.entries(e.form).map(([key, value]) => ({ key, value })) };
    if (e.multipart) r.body = { mode: 'formdata', formdata: [{ key: 'file', type: 'file', src: [] }] };
    return { name: e.title, request: r };
  };
  const out = { info: { name: 'FAST Studio API', schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json', description: DATA.intro },
    auth: { type: 'bearer', bearer: [{ key: 'token', value: '{{token}}', type: 'string' }] },
    variable: DATA.variables.map(v => ({ key: v.key, value: values[v.key] })),
    item: DATA.categories.map(c => ({ name: c.title, description: c.summary, item: c.endpoints.filter(e => !e.noExample).map(item) })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'FAST-Studio.postman_collection.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let observer;
function spy() {

document.getElementById('main').addEventListener('click', e => {
  const b = e.target.closest('button[data-copy]'); if (!b) return;

  const done = () => { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok') }, 1400) };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done() });
