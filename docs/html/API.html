const DATA = {"title":"FAST Studio API","intro":"Everything the FAST Studio screens can do is also an HTTP API. This page explains each feature's endpoints in plain words and gives a ready curl for every one. Fill in your values once at the top (server address, token, IDs): every example on the page updates. Paste a curl into a terminal, or import it into Postman (Import → Raw text), or download the whole Postman collection.","auth":["Most endpoints need a token in the header `Authorization: Bearer <token>`.","Easiest for scripts, Postman and AI assistants: a **personal access token** (`fsp_…`). Make one on your profile (Profile and Settings → API Tokens) and paste it into the Token box above. It works only for the organization and role you chose, until it expires or you revoke it.","Alternatively sign in with email and password (`POST /api/auth/token`, below) and use the `access_token` from the answer; it lasts 10 minutes and the `refresh_token` gets a new one.","Project endpoints take the organization in the path: `/api/orgs/{org}/…`, where `{org}` is the project's short name (e.g. `aurora`) or its ID. You must be a member, and your token must be for that organization; otherwise the answer is 404.","Platform endpoints (`/api/platform/…`) are for platform administrators only and use IDs (UUIDs) for organizations and tenants.","Errors come back as JSON with a `code` and a plain `detail` message, for example 400 (invalid input), 403 (not allowed), 404 (not found or not yours), 409 (conflict, e.g. someone changed the schedule), 429 (too many requests)."],"variables":[{"key":"baseUrl","label":"Server address","value":"http://localhost:8080","help":"Where FAST Studio runs"},{"key":"token","label":"Token","value":"fsp_PASTE_YOUR_TOKEN","help":"Personal access token (fsp_…) or an access token","secret":true},{"key":"org","label":"Project (org)","value":"aurora","help":"Short name or ID of your project"},{"key":"channelId","label":"Channel ID","value":"PASTE-CHANNEL-ID","h     </div>
    <details class="more"><summary>How signing in and errors work</summary><ul>${DATA.auth.map(a => `<li>${md(a)}</li>`).join('')}</ul>
      <div class="codes">${codes.map(([c, t]) => `<div><b>${c}</b>${t}</div>`).join('')}</div></details>`;
}
function renderVars() {
  document.getElementById('vars').innerHTML = DATA.variables.map(v => `<label>${esc(v.label)}<input data-k="${esc(v.key)}" value="${esc(values[v.key])}" ${v.secret ? 'type="password" autocomplete="off"' : ''} spellcheck="false" title="${esc(v.help)}"><span class="muted" style="font-weight:400">${esc(v.help)}</span></label>`).join('');
  const mark = i => i.classList.toggle('unset', /PASTE/.test(i.value));
  document.querySelectorAll('#vars input').forEach(i => { mark(i); i.addEventListener('input', () => { values[i.dataset.k] = i.value; mark(i); store.set('fs-api-values', JSON.stringify(values)); paintAll() }) });
}
function render(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '', nav = '';
  for (const c of DATA.categories) {
    const eps = c.endpoints.filter(e => !f || [e.method, e.path, e.title, e.description, c.title, ...(e.bodyFields || []).map(x => x.name), ...Object.keys(e.data || {})].join(' ').toLowerCase().includes(f));
    if (!eps.length) continue;
    nav += `<div class="group" data-cat="${c.id}"><a href="#${c.id}"><span class="ic">${ICONS[c.id] || '•'}</span>${esc(c.title)}<span class="n">${eps.length}</span></a>
      <div class="eps">${eps.map(e => `<a href="#${e.id}" data-ep="${e.id}"><span class="pill ${e.method}">${e.method}</span>${esc(e.title)}</a>`).join('')}</div></div>`;
    html += `<section class="cat" id="${c.id}"><div class="cat-head"><div class="ic">${ICONS[c.id] || '•'}</div><div><h2>${esc(c.title)}</h2><p>${md(c.summary)}</p><span class="who">👤 ${md(c.who)}</span></div></div>`;
    for (const e of eps)
      html += `<details class="card ep" id="${e.id}" ${f ? 'open' : ''}><summary><span class="pill ${e.method}">${e.method}</span>
        <span><div class="ttl">${esc(e.title)}</div><div class="pth">${pathHtml(e.path)}</div></span>
        <span class="badges">${e.danger ? '<span class="badge danger">cannot be undone</span>' : ''}${authBadge(e)}<span class="chev">›</span></span></summary>
        <div class="ep-body"><div class="doc">${docHtml(e)}</div>${codeHtml(e)}</div></details>`;
    html += '</section>';
  }
  const navEl = document.getElementById('nav');
  navEl.innerHTML = nav;
  navEl.classList.toggle('filtered', !!f);
  document.getElementById('main').innerHTML = html || '<div class="card empty">No endpoint matches. Try another word.</div>';
  paintAll();
  spy();
}
function collection() {
  const item = e => {
    const raw = url(e, true), [b, qs] = raw.split('?');
    const r = { method: e.method, header: [], description: e.description, url: { raw, host: ['{{baseUrl}}'], path: b.replace('{{baseUrl}}', '').split('/').filter(Boolean),
      query: qs ? qs.split('&').map(p => { const [k, v] = p.split('='); return { key: k, value: decodeURIComponent(v) } }) : [] } };
    if (e.auth === 'none' || e.auth === 'webhook') r.auth = { type: 'noauth' };
    if (e.auth === 'basic') r.auth = { type: 'basic', basic: [{ key: 'username', value: 'CLIENT_ID' }, { key: 'password', value: 'CLIENT_SECRET' }] };
    if (e.body) { r.header.push({ key: 'Content-Type', value: 'application/json' }); r.body = { mode: 'raw', raw: JSON.stringify(e.body, null, 2), options: { raw: { language: 'json' } } } }
    if (e.form) r.body = { mode: 'urlencoded', urlencoded: Object.entries(e.form).map(([key, value]) => ({ key, value })) };
    if (e.multipart) r.body = { mode: 'formdata', formdata: [{ key: 'file', type: 'file', src: [] }] };
    const out = { name: e.title, request: r };
    if (e.response && typeof e.response.body !== 'string') out.response = [{ name: 'Example', originalRequest: r, code: e.response.status, header: [{ key: 'Content-Type', value: 'application/json' }], body: JSON.stringify(e.response.body, null, 2), _postman_previewlanguage: 'json' }];
    return out;
  };
  const out = { info: { name: 'FAST Studio API', schema: 'https://schema.getpostman.com/json/collection/v2.1.0/collection.json', description: DATA.intro },
    auth: { type: 'bearer', bearer: [{ key: 'token', value: '{{token}}', type: 'string' }] },
    variable: DATA.variables.map(v => ({ key: v.key, value: values[v.key] })),
    item: DATA.categories.map(c => ({ name: c.title, description: c.summary, item: c.endpoints.filter(e => !e.noExample).map(item) })) };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = 'FAST-Studio.postman_collection.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
let observer;
function spy() {
  observer?.disconnect();
  observer = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return;
    document.querySelectorAll('#nav .group').forEach(g => g.classList.toggle('on', g.dataset.cat === x.target.id)) }), { rootMargin: '-72px 0px -75% 0px' });
  document.querySelectorAll('section.cat').forEach(s => observer.observe(s));
}
function openHash() {
  const t = location.hash && document.querySelector(location.hash);
  if (t && t.tagName === 'DETAILS') { t.open = true; paint(t.querySelector('.code[data-i]') || document.createElement('div')); setTimeout(() => t.scrollIntoView({ block: 'start', behavior: 'instant' }), 120) }
}
renderHero();
renderVars();
render();
document.getElementById('foot').textContent = `Generated ${DATA.generatedAt} from the server's ${DATA.routeCount} routes, docs/api/*.json and ${DATA.responseCount} answers recorded from the demo (shortened; secrets replaced). Every route, field and parameter is documented; the build fails otherwise.`;
document.getElementById('q').addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus() } });
document.getElementById('postman').addEventListener('change', paintAll);
document.getElementById('collection').addEventListener('click', collection);
document.getElementById('reset').addEventListener('click', () => { values = { ...DEFAULTS }; store.set('fs-api-values', '{}'); renderVars(); paintAll() });
document.getElementById('expand').addEventListener('click', e => { const open = e.target.textContent === 'Expand all'; document.querySelectorAll('details.ep').forEach(d => d.open = open); e.target.textContent = open ? 'Collapse all' : 'Expand all'; paintAll() });
document.getElementById('main').addEventListener('toggle', e => { if (e.target.open) { const c = e.target.querySelector('.code[data-i]'); if (c) paint(c) } }, true);
document.getElementById('main').addEventListener('click', e => {
  const tab = e.target.closest('.tabs button[data-tab]');
  if (tab) { tab.parentElement.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab)); paint(tab.closest('.code')); return }
  const cp = e.target.closest('.tabs .cp'); if (!cp) return;
  const text = cp.closest('.code').querySelector('pre').dataset.copy || '';
  const done = () => { cp.textContent = 'Copied ✓'; cp.classList.add('ok'); setTimeout(() => { cp.textContent = 'Copy'; cp.classList.remove('ok') }, 1400) };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); done() });
});
document.getElementById('nav').addEventListener('click', e => { const a = e.target.closest('a[data-ep]'); if (a) { const d = document.getElementById(a.dataset.ep); d.open = true; } });
window.addEventListener('hashchange', openHash);
const theme = store.get('fs-theme'); if (theme) document.documentElement.dataset.theme = theme;
document.getElementById('theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('fs-theme', document.documentElement.dataset.theme);
});
openHash();
</script>
